<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img"><title>Charging a grounded conductor by induction</title><rect width="100%" height="100%" fill="white" /><rect x="50" y="180" width="170" height="70" fill="#eff4f7" stroke="#263445" stroke-width="1.5" /><rect x="430" y="180" width="170" height="70" fill="#eff4f7" stroke="#263445" stroke-width="1.5" /><rect x="840" y="180" width="170" height="70" fill="#eff4f7" stroke="#263445" stroke-width="1.5" /><path d="M220 215L295 215" fill="none" stroke="#263445" stroke-width="2" /><path d="M295 215L295 290" fill="none" stroke="#263445" stroke-width="2" /><path d="M295 275L295 310" fill="none" stroke="#263445" stroke-width="2" /><path d="M271 310L319 310" fill="none" stroke="#263445" stroke-width="3" /><path d="M279 319L311 319" fill="none" stroke="#263445" stroke-width="3" /><path d="M287 328L303 328" fill="none" stroke="#263445" stroke-width="3" /><rect x="372" y="145" width="26" height="140" fill="#d4edf5" stroke="#167fa4" stroke-width="1.5" /><path d="M600 215L675 215" fill="none" stroke="#263445" stroke-width="2" /><path d="M675 215L675 290" fill="none" stroke="#263445" stroke-width="2" /><path d="M675 275L675 310" fill="none" stroke="#263445" stroke-width="2" /><path d="M651 310L699 310" fill="none" stroke="#263445" stroke-width="3" /><path d="M659 319L691 319" fill="none" stroke="#263445" stroke-width="3" /><path d="M667 328L683 328" fill="none" stroke="#263445" stroke-width="3" /><path d="M610 230L655 230" fill="none" stroke="#167fa4" stroke-width="2.5" /><path d="M655 230L644.0 226.0L644.0 234.0Z" fill="#167fa4" stroke="#167fa4" stroke-width="0" /><path d="M655 230L655 280" fill="none" stroke="#167fa4" stroke-width="2.5" /><path d="M655 280L659.0 269.0L651.0 269.0Z" fill="#167fa4" stroke="#167fa4" stroke-width="0" /><path d="M1010 215L1060 215" fill="none" stroke="#263445" stroke-width="2" /><text x="28" y="38" fill="#263445" font-size="25" font-family="Arial,sans-serif" font-weight="700" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">Charging a grounded conductor by induction</text><text x="50" y="100" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="700" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">1 Neutral and grounded</text><text x="430" y="100" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="700" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">2 Bring a negative rod near</text><text x="840" y="100" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="700" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">3 Isolate; remove the rod</text><text x="90" y="220" fill="#263445" font-size="24" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">+  −  +  −</text><text x="385" y="175" fill="#167fa4" font-size="23" font-family="Arial,sans-serif" font-weight="400" text-anchor="middle" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">−</text><text x="385" y="210" fill="#167fa4" font-size="23" font-family="Arial,sans-serif" font-weight="400" text-anchor="middle" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">−</text><text x="385" y="245" fill="#167fa4" font-size="23" font-family="Arial,sans-serif" font-weight="400" text-anchor="middle" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">−</text><text x="450" y="210" fill="#c74454" font-size="24" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">+  +</text><text x="450" y="235" fill="#c74454" font-size="24" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">+  +</text><text x="435" y="350" fill="#167fa4" font-size="18" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">Electrons leave through ground.</text><text x="865" y="220" fill="#c74454" font-size="24" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">+   +   +   +</text><text x="840" y="310" fill="#263445" font-size="19" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">Disconnect earth first.</text><text x="840" y="343" fill="#263445" font-size="19" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">The conductor retains positive charge.</text></svg>