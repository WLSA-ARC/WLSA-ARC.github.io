<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img"><title>Charging a capacitor with a 12 V battery</title><rect width="100%" height="100%" fill="white" /><path d="M155 310L155 180" fill="none" stroke="#263445" stroke-width="2" /><path d="M155 180L420 180" fill="none" stroke="#263445" stroke-width="2" /><path d="M155 310L300 310" fill="none" stroke="#263445" stroke-width="2" /><path d="M360 310L650 310" fill="none" stroke="#263445" stroke-width="2" /><path d="M650 310L650 180" fill="none" stroke="#263445" stroke-width="2" /><path d="M650 180L485 180" fill="none" stroke="#263445" stroke-width="2" /><path d="M420 100L420 260" fill="none" stroke="#167fa4" stroke-width="6" /><path d="M485 100L485 260" fill="none" stroke="#167fa4" stroke-width="6" /><path d="M300 280L300 340" fill="none" stroke="#263445" stroke-width="4" /><path d="M360 295L360 325" fill="none" stroke="#263445" stroke-width="4" /><text x="28" y="38" fill="#263445" font-size="25" font-family="Arial,sans-serif" font-weight="700" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">Charging a capacitor with a 12 V battery</text><text x="285" y="270" fill="#c74454" font-size="23" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">+</text><text x="360" y="270" fill="#167fa4" font-size="23" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">−</text><text x="300" y="385" fill="#263445" font-size="25" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">12 V</text><text x="380" y="80" fill="#c74454" font-size="23" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">+Q</text><text x="480" y="80" fill="#167fa4" font-size="23" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">−Q</text><text x="735" y="135" fill="#263445" font-size="23" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">Capacitance C</text><text x="735" y="180" fill="#263445" font-size="23" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">Equal and opposite charges</text><text x="735" y="225" fill="#263445" font-size="23" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">At equilibrium:</text><text x="735" y="270" fill="#263445" font-size="23" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">ΔVC = ΔVbattery = 12 V</text></svg>