<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img"><title>The slope of a Q–V graph is capacitance</title><rect width="100%" height="100%" fill="white" /><path d="M80 345L550 345" fill="none" stroke="#263445" stroke-width="2.5" /><path d="M550 345L539.0 341.0L539.0 349.0Z" fill="#263445" stroke="#263445" stroke-width="0" /><path d="M80 345L80 80" fill="none" stroke="#263445" stroke-width="2.5" /><path d="M80 80L76.0 91.0L84.0 91.0Z" fill="#263445" stroke="#263445" stroke-width="0" /><path d="M80 345L255 90" fill="none" stroke="#c74454" stroke-width="3" /><path d="M80 345L385 150" fill="none" stroke="#c74454" stroke-width="3" /><path d="M80 345L500 235" fill="none" stroke="#c74454" stroke-width="3" /><text x="28" y="38" fill="#263445" font-size="25" font-family="Arial,sans-serif" font-weight="700" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">The slope of a Q–V graph is capacitance</text><text x="535" y="380" fill="#263445" font-size="23" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">V</text><text x="45" y="90" fill="#263445" font-size="23" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">Q</text><text x="267" y="82" fill="#c74454" font-size="23" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">A</text><text x="397" y="142" fill="#c74454" font-size="23" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">B</text><text x="512" y="227" fill="#c74454" font-size="23" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">C</text><text x="620" y="145" fill="#263445" font-size="25" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">Q = CΔV</text><text x="620" y="200" fill="#263445" font-size="25" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">Slope = ΔQ/ΔV = C</text><text x="620" y="255" fill="#263445" font-size="25" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">C(A) &gt; C(B) &gt; C(C)</text></svg>