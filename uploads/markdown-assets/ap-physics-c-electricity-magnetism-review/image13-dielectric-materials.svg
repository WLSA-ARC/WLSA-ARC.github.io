ite" stroke-width="3" stroke-linejoin="round">Paper</text><text x="550" y="366" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">3.7</text><text x="805" y="366" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">15 × 10⁶</text><text x="55" y="406" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">Quartz</text><text x="550" y="406" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">4.3</text><text x="805" y="406" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">8 × 10⁶</text><text x="55" y="446" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">Oil</text><text x="550" y="446" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">4</text><text x="805" y="446" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">12 × 10⁶</text><text x="55" y="486" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">Glass, Pyrex</text><text x="550" y="486" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">5</text><text x="805" y="486" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">14 × 10⁶</text><text x="55" y="526" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">Rubber, neoprene</text><text x="550" y="526" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">6.7</text><text x="805" y="526" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">12 × 10⁶</text><text x="55" y="566" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">Porcelain</text><text x="550" y="566" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">6–8</text><text x="805" y="566" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">5 × 10⁶</text><text x="55" y="606" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">Mica</text><text x="550" y="606" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">7</text><text x="805" y="606" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">150 × 10⁶</text><text x="55" y="646" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">Water (liquid)</text><text x="550" y="646" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">80</text><text x="805" y="646" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">—</text><text x="55" y="686" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">Strontium titanate</text><text x="550" y="686" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">300</text><text x="805" y="686" fill="#263445" font-size="21" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">8 × 10⁶</text></svg>