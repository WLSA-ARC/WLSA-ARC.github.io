<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img"><title>Open surface and closed surface</title><rect width="100%" height="100%" fill="white" /><path d="M75 285L355 285L430 160L150 160Z" fill="#e3f0f5" stroke="#167fa4" stroke-width="2" /><circle cx="730" cy="220" r="110" fill="#f4e8be" stroke="#263445" stroke-width="2" /><ellipse cx="730" cy="220" rx="110" ry="28" fill="none" stroke="#263445" stroke-width="2" transform="rotate(0 730 220)" stroke-dasharray="5 5" /><ellipse cx="730" cy="220" rx="38" ry="110" fill="none" stroke="#263445" stroke-width="2" transform="rotate(0 730 220)" /><text x="28" y="38" fill="#263445" font-size="25" font-family="Arial,sans-serif" font-weight="700" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">Open surface and closed surface</text><text x="80" y="345" fill="#263445" font-size="22" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">Open plane</text><text x="80" y="378" fill="#263445" font-size="22" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">Does not enclose a volume.</text><text x="615" y="365" fill="#263445" font-size="22" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">Closed sphere</text><text x="615" y="398" fill="#263445" font-size="22" font-family="Arial,sans-serif" font-weight="400" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">Encloses a volume.</text></svg>