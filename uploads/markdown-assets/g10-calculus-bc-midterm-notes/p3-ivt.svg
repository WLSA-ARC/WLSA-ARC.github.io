<svg xmlns="http://www.w3.org/2000/svg" width="780" height="350" viewBox="0 0 780 350" role="img"><title>Intermediate value theorem: continuous curve froma tob crosses heightL atc,withf(a),f(b) and dashed guides.</title><rect width="100%" height="100%" fill="white"/><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve">Intermediate value theorem</text><path d="M70 285L500 285" fill="none" stroke="#263445" stroke-width="1.5"/><path d="M500 285L490.0 281.0L490.0 289.0Z" stroke="#263445" stroke-width="0" fill="#263445"/><path d="M70 285L70 75" fill="none" stroke="#263445" stroke-width="1.5"/><path d="M70 75L66.0 85.0L74.0 85.0Z" stroke="#263445" stroke-width="0" fill="#263445"/><text x="508" y="292" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">x</text><text x="58" y="63" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">y</text><path d="M105 210 C175 200 140 260 230 230 S265 155 295 155 C330 155 345 85 390 95" stroke="#147fa5" stroke-width="3" fill="none"/><path d="M105 285L105 210" fill="none" stroke="#263445" stroke-width="1" stroke-dasharray="5 5"/><text x="105" y="315" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#263445" text-anchor="middle" xml:space="preserve">a</text><path d="M295 285L295 155" fill="none" stroke="#263445" stroke-width="1" stroke-dasharray="5 5"/><text x="295" y="315" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#263445" text-anchor="middle" xml:space="preserve">c</text><path d="M390 285L390 95" fill="none" stroke="#263445" stroke-width="1" stroke-dasharray="5 5"/><text x="390" y="315" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#263445" text-anchor="middle" xml:space="preserve">b</text><path d="M70 210L390 210" fill="none" stroke="#263445" stroke-width="1" stroke-dasharray="5 5"/><text x="20" y="216" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">f(a)</text><path d="M70 155L390 155" fill="none" stroke="#263445" stroke-width="1" stroke-dasharray="5 5"/><text x="20" y="161" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">L</text><path d="M70 95L390 95" fill="none" stroke="#263445" stroke-width="1" stroke-dasharray="5 5"/><text x="20" y="101" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">f(b)</text><text x="535" y="125" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">f is continuous on [a,b].</text><text x="535" y="162" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">If L lies between f(a),f(b),</text><text x="535" y="199" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">then some c ∈ [a,b]</text><text x="535" y="236" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">satisfies f(c)=L.</text></svg>
