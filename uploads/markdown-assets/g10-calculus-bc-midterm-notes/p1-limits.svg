ue</text><text x="288" y="232" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">x</text><text x="43" y="73" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">y</text><text x="623" y="232" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">x</text><text x="378" y="73" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">y</text><text x="65" y="275" font-family="Arial,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">y = x + 1</text><text x="65" y="310" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">lim(x→1) f(x) = 2</text><text x="395" y="275" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">f(x)=x+1 if x≠1; f(1)=1</text><text x="395" y="310" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">lim(x→1) f(x) = 2</text><text x="1018" y="232" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">x</text><text x="748" y="73" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">y</text><text x="750" y="275" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Left-hand limit = 3</text><text x="750" y="306" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Right-hand limit = 1</text><text x="750" y="337" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">f(1)=2; two-sided limit does not exist.</text><text x="50" y="395" font-family="Arial,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">lim(x→c) f(x)=L  ⇔  both one-sided limits equal L.</text><text x="50" y="440" font-family="Arial,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Unbounded near x=0: no finite limit (both sides rise without bound).</text><text x="267" y="677" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">0</text><text x="540" y="570" font-family="Arial,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Both sides grow without bound as x → 0.</text></svg>