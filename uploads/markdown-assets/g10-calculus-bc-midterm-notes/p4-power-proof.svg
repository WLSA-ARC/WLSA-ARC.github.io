<svg xmlns="http://www.w3.org/2000/svg" width="900" height="289" viewBox="0 0 900 289" role="img"><title>Power rule f(x)=x^n,fprime=nx^(n-1),n∈N+,with red binomial-expansion proof and cancellations across the line.</title><rect width="100%" height="100%" fill="white"/><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve">Power rule from the difference quotient</text><g id="review-equations-and-explanation"><text x="30" y="85" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">f(x) = xⁿ, n ∈ N⁺</text><text x="30" y="119" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">f′(x) = lim(h→0) [(x+h)ⁿ − xⁿ] / h</text><text x="30" y="153" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">By the binomial expansion, the xⁿ terms cancel.</text><text x="30" y="187" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">After dividing by h: n xⁿ⁻¹ + terms containing h.</text><text x="30" y="221" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">As h → 0, the remaining terms vanish.</text><text x="30" y="255" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Therefore f′(x) = n xⁿ⁻¹.</text></g></svg>
