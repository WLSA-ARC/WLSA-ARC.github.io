rial, sans-serif" font-size="17" font-weight="normal" fill="#25384b" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">x</text><text x="843.4166666666667" y="54" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#25384b" text-anchor="end" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">y</text><text x="662.9166666666666" y="279.125" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#25384b" text-anchor="middle" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">−3</text><text x="855.4166666666667" y="279.125" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#25384b" text-anchor="middle" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">0</text><text x="956.2094309693392" y="279.125" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#25384b" text-anchor="middle" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">π/2</text><text x="844.4166666666667" y="126.75" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#25384b" text-anchor="end" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">1</text><text x="595" y="329" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#b94d5d" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">Right boundary: x = πy / 2</text><text x="595" y="355" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#247da1" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">Left boundary: x = arcsin y</text><text x="595" y="381" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#45977c" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">R: green; r: blue; same y = 1/2 slice</text></g><text x="45" y="451" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#25384b" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">Use distances from the rotation axis, not x-coordinates alone.</text><text x="45" y="505" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#b94d5d" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">R(y) = πy / 2 + 3</text><text x="45" y="552" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#247da1" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">r(y) = arcsin y + 3</text><text x="45" y="617" font-family="Arial, sans-serif" font-size="25" font-weight="normal" fill="#25384b" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">V = π ∫₀¹ [(πy / 2 + 3)² − (arcsin y + 3)²] dy</text><text x="45" y="686" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#25384b" text-anchor="start" paint-order="stroke fill" stroke="white" stroke-width="3" stroke-linejoin="round">Horizontal slices are perpendicular to the vertical rotation axis.</text></svg>