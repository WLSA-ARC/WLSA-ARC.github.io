<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="397" viewBox="0 0 1100 540"><title>Groupperiodconfiguration</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="550" y="110" font-size="49" fill="#172033" text-anchor="middle">(Full inner shells) + 4s² 4p²</text><rect x="65" y="210" width="450" height="65.7" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="80" y="251" font-size="29" fill="#172033">Group 4: four valence electrons.</text><rect x="585" y="210" width="450" height="103.4" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="600" y="251" font-size="29" fill="#172033">Period 4: outer electrons are in</text><text x="600" y="288.12" font-size="29" fill="#172033">the 4th shell.</text><rect x="230" y="370" width="650" height="103.4" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="245" y="411" font-size="29" fill="#172033">Second element in the p-block: two electrons in</text><text x="245" y="448.12" font-size="29" fill="#172033">the p subshell.</text></g></svg>
