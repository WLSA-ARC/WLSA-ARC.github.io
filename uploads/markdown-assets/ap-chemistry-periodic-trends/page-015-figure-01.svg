<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="589" viewBox="0 0 1100 589"><title>Bevalenceconfiguration</title><rect width="100%" height="100%" fill="white" /><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle cx="325" cy="235" r="72" fill="none" stroke="#64748b" stroke-width="2" /><circle cx="325" cy="235" r="145" fill="none" stroke="#64748b" stroke-width="2" /><circle cx="325" cy="235" r="24" fill="#fef3c7" stroke="#172033" stroke-width="2" /><text x="325" y="228.35" font-size="12.35" fill="#172033" text-anchor="middle">4p</text><text x="325" y="242.6" font-size="12.35" fill="#172033" text-anchor="middle">5n</text><circle cx="325.0" cy="163.0" r="7" fill="#dc2626" stroke="#dc2626" stroke-width="0" /><circle cx="325.0" cy="307.0" r="7" fill="#dc2626" stroke="#dc2626" stroke-width="0" /><circle cx="325.0" cy="90.0" r="7" fill="#dc2626" stroke="#dc2626" stroke-width="0" /><circle cx="325.0" cy="380.0" r="7" fill="#dc2626" stroke="#dc2626" stroke-width="0" /><rect x="650" y="55" width="350" height="152.8" rx="8" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.6" /><text x="665" y="99" font-size="32" fill="#172033">⁹₄Be</text><text x="665" y="139.96" font-size="32" fill="#172033">Group 2 / II</text><text x="665" y="180.92" font-size="32" fill="#172033">Period 2 / II</text><rect x="650" y="255" width="350" height="163.20000000000002" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" /><text x="665" y="293" font-size="26" fill="#172033">Group 2: 2 valence</text><text x="665" y="326.28" font-size="26" fill="#172033">electrons.</text><text x="665" y="359.56" font-size="26" fill="#172033">Period 2: electrons occupy</text><text x="665" y="392.84" font-size="26" fill="#172033">the 2nd shell.</text><text x="300" y="440" font-size="27" fill="#172033" text-anchor="middle">Outer shell = valence shell</text><line x1="300" y1="410" x2="325" y2="380" stroke="#2563eb" stroke-width="2.4" /><path d="M315.141 384.801 L325 380 L322.055 390.563" fill="none" stroke="#2563eb" stroke-width="2.4" /><rect x="600" y="430" width="450" height="133.3" rx="8" fill="#bbf7d0" stroke="#94a3b8" stroke-width="1.6" /><text x="615" y="469" font-size="27" fill="#172033">1s² 2s²</text><text x="615" y="503.56" font-size="27" fill="#172033">2 before s = shell number</text><text x="615" y="538.12" font-size="27" fill="#172033">² after s = 2 valence electrons</text><text x="60" y="505" font-size="24" fill="#172033">Key: p = proton; n = neutron</text><text x="60" y="540" font-size="24" fill="#172033">Red dots = electrons</text></g></svg>