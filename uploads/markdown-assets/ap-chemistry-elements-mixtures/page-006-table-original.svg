<svg xmlns="http://www.w3.org/2000/svg" width="546" height="461" viewBox="0 0 1100 929"><title>EmpiricalformulaCH2</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="80" width="340" height="125" rx="0" fill="#bae6fd" stroke="#64748b" stroke-width="1.5"/><text x="30" y="117" font-size="28" fill="#172033" font-weight="700">Procedure</text><rect x="360" y="80" width="360" height="125" rx="0" fill="#bae6fd" stroke="#64748b" stroke-width="1.5"/><text x="370" y="117" font-size="28" fill="#172033" font-weight="700">Carbon</text><rect x="720" y="80" width="360" height="125" rx="0" fill="#bae6fd" stroke="#64748b" stroke-width="1.5"/><text x="730" y="117" font-size="28" fill="#172033" font-weight="700">Hydrogen</text><rect x="20" y="205" width="340" height="125" rx="0" fill="white" stroke="#64748b" stroke-width="1.5"/><text x="30" y="242" font-size="28" fill="#172033">Mass percentage</text><rect x="360" y="205" width="360" height="125" rx="0" fill="white" stroke="#64748b" stroke-width="1.5"/><text x="370" y="242" font-size="28" fill="#172033">86.0%</text><rect x="720" y="205" width="360" height="125" rx="0" fill="white" stroke="#64748b" stroke-width="1.5"/><text x="730" y="242" font-size="28" fill="#172033">14.0%</text><rect x="20" y="330" width="340" height="125" rx="0" fill="white" stroke="#64748b" stroke-width="1.5"/><text x="30" y="367" font-size="28" fill="#172033">Assume a 100 g sample</text><rect x="360" y="330" width="360" height="125" rx="0" fill="white" stroke="#64748b" stroke-width="1.5"/><text x="370" y="367" font-size="28" fill="#172033">86.0 g</text><rect x="720" y="330" width="360" height="125" rx="0" fill="white" stroke="#64748b" stroke-width="1.5"/><text x="730" y="367" font-size="28" fill="#172033">14.0 g</text><rect x="20" y="455" width="340" height="125" rx="0" fill="white" stroke="#64748b" stroke-width="1.5"/><text x="30" y="492" font-size="28" fill="#172033">Moles n = m/M</text><rect x="360" y="455" width="360" height="125" rx="0" fill="white" stroke="#64748b" stroke-width="1.5"/><text x="370" y="492" font-size="28" fill="#172033">86.0 g / (12.01 g mol⁻¹)</text><text x="370" y="525.6" font-size="28" fill="#172033">= 7.16 mol</text><rect x="720" y="455" width="360" height="125" rx="0" fill="white" stroke="#64748b" stroke-width="1.5"/><text x="730" y="492" font-size="28" fill="#172033">14.0 g / (1.008 g mol⁻¹)</text><text x="730" y="525.6" font-size="28" fill="#172033">= 13.8 mol</text><rect x="20" y="580" width="340" height="125" rx="0" fill="white" stroke="#64748b" stroke-width="1.5"/><text x="30" y="617" font-size="28" fill="#172033">Divide by smaller value</text><rect x="360" y="580" width="360" height="125" rx="0" fill="white" stroke="#64748b" stroke-width="1.5"/><text x="370" y="617" font-size="28" fill="#172033">7.16 / 7.16 = 1</text><rect x="720" y="580" width="360" height="125" rx="0" fill="white" stroke="#64748b" stroke-width="1.5"/><text x="730" y="617" font-size="28" fill="#172033">13.8 / 7.16</text><text x="730" y="650.6" font-size="28" fill="#172033">= 1.93 ≈ 2</text><rect x="20" y="705" width="340" height="125" rx="0" fill="white" stroke="#64748b" stroke-width="1.5"/><text x="30" y="742" font-size="28" fill="#172033">Use ratio as subscripts</text><rect x="360" y="705" width="360" height="125" rx="0" fill="white" stroke="#64748b" stroke-width="1.5"/><text x="370" y="742" font-size="28" fill="#172033">C : H = 1 : 2</text><rect x="720" y="705" width="360" height="125" rx="0" fill="white" stroke="#64748b" stroke-width="1.5"/><text x="730" y="742" font-size="28" fill="#172033">CH₂</text><text x="550" y="45" font-size="35" fill="#172033" text-anchor="middle" font-weight="700">Empirical formula from composition</text></g></svg>
