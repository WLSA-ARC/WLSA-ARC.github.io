<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1865" viewBox="0 0 1100 1865"><title>Paperchromatography</title><rect width="100%" height="100%" fill="white" /><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="50" y="40" width="1000" height="65.7" rx="8" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.6" /><text x="65" y="81" font-size="29" fill="#172033">1 Set up chromatography paper as shown.</text><rect x="350" y="200" width="370" height="290" rx="0" fill="none" stroke="#172033" stroke-width="2" /><line x1="350" y1="445" x2="720" y2="445" stroke="#172033" stroke-width="2" /><circle cx="400" cy="445" r="12" fill="#172033" stroke="#172033" stroke-width="2" /><circle cx="488" cy="445" r="12" fill="#fb7185" stroke="#172033" stroke-width="2" /><circle cx="576" cy="445" r="12" fill="#06b6d4" stroke="#172033" stroke-width="2" /><circle cx="664" cy="445" r="12" fill="#facc15" stroke="#172033" stroke-width="2" /><text x="535" y="535" font-size="25" fill="#172033" text-anchor="middle">Pencil baseline</text><text x="785" y="290" font-size="24" fill="#172033">Black ink: lane 1</text><text x="785" y="320.72" font-size="24" fill="#172033">References:</text><text x="785" y="351.44" font-size="24" fill="#172033">red, blue, yellow</text><text x="785" y="382.16" font-size="24" fill="#172033">Chromatography paper</text><rect x="50" y="640" width="1000" height="103.4" rx="8" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.6" /><text x="65" y="681" font-size="29" fill="#172033">2 Lower the paper into a beaker with appropriate solvent. Wait for solvent to</text><text x="65" y="718.12" font-size="29" fill="#172033">travel up the paper.</text><rect x="302" y="1070.6" width="466" height="52.4" rx="0" fill="#bae6fd" stroke="none" stroke-width="0" /><path d="M300 785 L300 1113 Q300 1125 312 1125 L758 1125 Q770 1125 770 785" fill="none" stroke="#172033" stroke-width="2" /><rect x="350" y="800" width="370" height="290" rx="0" fill="none" 