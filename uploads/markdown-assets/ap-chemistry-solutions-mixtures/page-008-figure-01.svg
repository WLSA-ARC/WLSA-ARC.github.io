<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="637" viewBox="0 0 1100 750"><title>CuSO4solutionpreparation1–3</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="550" y="45" font-size="31" fill="#172033" text-anchor="middle" font-weight="700">Preparing a CuSO₄ solution: stages 1–3</text><rect x="70" y="310" width="220" height="65" rx="0" fill="#e2e8f0" stroke="#172033" stroke-width="2"/><rect x="110" y="326" width="140" height="36" rx="0" fill="white" stroke="#172033" stroke-width="2"/><text x="180" y="354" font-size="29" fill="#172033" text-anchor="middle">39.9 g</text><path d="M90 300 H270 L240 270 H120 Z" fill="#bae6fd" stroke="#172033" stroke-width="2"/><rect x="40" y="450" width="290" height="95.60000000000001" rx="8" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.6"/><text x="55" y="488" font-size="26" fill="#172033">1 Weigh out 39.9 g of</text><text x="55" y="521.28" font-size="26" fill="#172033">CuSO₄.</text><rect x="412" y="260.0" width="206" height="108.00000000000001" rx="0" fill="#bae6fd" stroke="none" stroke-width="0"/><path d="M410 170 L410 358 Q410 370 422 370 L608 370 Q620 370 620 170" fill="none" stroke="#172033" stroke-width="2"/><line x1="535" y1="115" x2="480" y2="330" stroke="#172033" stroke-width="6"/><text x="530" y="95" font-size="24" fill="#172033" text-anchor="middle">Glass rod</text><path d="M555 250 Q590 290 550 325" fill="none" stroke="#2563eb" stroke-width="3"/><line x1="560" y1="311" x2="550" y2="325" stroke="#2563eb" stroke-width="2.4"/><path d="M559.474 319.478 L550 325 L552.151 314.247" fill="none" stroke="#2563eb" stroke-width="2.4"/><rect x="375" y="450" width="290" height="158.0" rx="8" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.6"/><text x="390" y="487" font-size="25" fill="#172033">2 Add to a small</text><text x="390" y="519" font-size="25" fill="#172033">volume of water in a</text><text x="390" y="551" font-size="25" fill="#172033">beaker. Stir to</text><text x="390" y="583" font-size="25" fill="#172033">pre-dissolve the solid.</text><path d="M850.0 150.0 V234.0 C758.0 334.0 790.0 390.0 870 390.0 C950.0 390.0 982.0 334.0 890.0 234.0 V150.0" fill="white" stroke="#172033" stroke-width="3"/><path d="M797.2 306.0 Q870 322.0 942.8 306.0 C958.0 358.0 926.0 390.0 870 390.0 C814.0 390.0 782.0 358.0 797.2 306.0" fill="#bae6fd" stroke="#172033" stroke-width="1.4"/><line x1="843.6" y1="194" x2="896.4" y2="194" stroke="#dc2626" stroke-width="2"/><path d="M810 100 H930 L885 150 V190 H855 V150 Z" fill="white" stroke="#172033" stroke-width="2"/><text x="1015" y="130" font-size="23" fill="#172033" text-anchor="middle">Funnel</text><rect x="735" y="450" width="320" height="125.5" rx="8" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.6"/><text x="750" y="487" font-size="25" fill="#172033">3 Transfer the solution</text><text x="750" y="519" font-size="25" fill="#172033">through a funnel into a</text><text x="750" y="551" font-size="25" fill="#172033">volumetric flask.</text><line x1="310" y1="300" x2="375" y2="300" stroke="#059669" stroke-width="5"/><path d="M362 294.15 L375 300 L362 305.85" fill="none" stroke="#059669" stroke-width="5"/><line x1="665" y1="300" x2="725" y2="300" stroke="#059669" stroke-width="5"/><path d="M712 294.15 L725 300 L712 305.85" fill="none" stroke="#059669" stroke-width="5"/></g></svg>
