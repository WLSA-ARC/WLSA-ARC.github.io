<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="670" viewBox="0 0 1400 670" role="img"><title>Binary conversion and hexadecimal example</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1400" height="670" fill="#fff"/><g id="heading-0" data-role="heading-0"><text xml:space="preserve" x="23.450" y="50.696" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27.246" font-weight="700" fill="#123b51" text-anchor="start">Convert 100 to binary by repeated division by 2</text></g><g id="text-1" data-role="text-1"><text xml:space="preserve" x="23.450" y="93.358" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23.900" font-weight="400" fill="#123b51" text-anchor="start">Divide the quotient by 2 until the quotient reaches 0. Read the remainders from bottom to top: most</text><text xml:space="preserve" x="23.450" y="123.233" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23.900" font-weight="400" fill="#123b51" text-anchor="start">significant bit (MSB) to least significant bit (LSB).</text></g><g id="table-2" data-role="table-2"><rect x="23.45" y="135.183" width="338.275" height="47.8" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="33.010" y="161.951" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="700" fill="#fff" text-anchor="start">Division</text><rect x="361.725" y="135.183" width="338.275" height="47.8" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="371.285" y="161.951" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="700" fill="#fff" text-anchor="start">Quotient</text><rect x="700.0" y="135.183" width="338.275" height="47.8" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="709.560" y="161.951" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="700" fill="#fff" text-anchor="start">Remainder</text><rect x="1038.275" y="135.183" width="338.275" height="47.8" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="1047.835" y="161.951" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="700" fill="#fff" text-anchor="start">Bit position</text><rect x="23.45" y="182.983" width="338.275" height="47.8" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="33.010" y="209.751" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start">100 ÷ 2</text><rect x="361.725" y="182.983" width="338.275" height="47.8" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="371.285" y="209.751" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start">50</text><rect x="700.0" y="182.983" width="338.275" height="47.8" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="709.560" y="209.751" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start">0</text><rect x="1038.275" y="182.983" width="338.275" height="47.8" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="1047.835" y="209.751" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start">LSB</text><rect x="23.45" y="230.783" width="338.275" height="47.8" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="33.010" y="257.551" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start">50 ÷ 2</text><rect x="361.725" y="230.783" width="338.275" height="47.8" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="371.285" y="257.551" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start">25</text><rect x="700.0" y="230.783" width="338.275" height="47.8" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="709.560" y="257.551" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start">0</text><rect x="1038.275" y="230.783" width="338.275" height="47.8" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="1047.835" y="257.551" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start"></text><rect x="23.45" y="278.583" width="338.275" height="47.8" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="33.010" y="305.351" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start">25 ÷ 2</text><rect x="361.725" y="278.583" width="338.275" height="47.8" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="371.285" y="305.351" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start">12</text><rect x="700.0" y="278.583" width="338.275" height="47.8" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="709.560" y="305.351" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start">1</text><rect x="1038.275" y="278.583" width="338.275" height="47.8" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="1047.835" y="305.351" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start"></text><rect x="23.45" y="326.383" width="338.275" height="47.8" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="33.010" y="353.151" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start">12 ÷ 2</text><rect x="361.725" y="326.383" width="338.275" height="47.8" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="371.285" y="353.151" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start">6</text><rect x="700.0" y="326.383" width="338.275" height="47.8" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="709.560" y="353.151" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start">0</text><rect x="1038.275" y="326.383" width="338.275" height="47.8" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="1047.835" y="353.151" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start"></text><rect x="23.45" y="374.183" width="338.275" height="47.8" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="33.010" y="400.951" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start">6 ÷ 2</text><rect x="361.725" y="374.183" width="338.275" height="47.8" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="371.285" y="400.951" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start">3</text><rect x="700.0" y="374.183" width="338.275" height="47.8" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="709.560" y="400.951" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start">0</text><rect x="1038.275" y="374.183" width="338.275" height="47.8" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="1047.835" y="400.951" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start"></text><rect x="23.45" y="421.983" width="338.275" height="47.8" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="33.010" y="448.751" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start">3 ÷ 2</text><rect x="361.725" y="421.983" width="338.275" height="47.8" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="371.285" y="448.751" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start">1</text><rect x="700.0" y="421.983" width="338.275" height="47.8" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="709.560" y="448.751" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start">1</text><rect x="1038.275" y="421.983" width="338.275" height="47.8" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="1047.835" y="448.751" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start"></text><rect x="23.45" y="469.783" width="338.275" height="47.8" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="33.010" y="496.551" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start">1 ÷ 2</text><rect x="361.725" y="469.783" width="338.275" height="47.8" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="371.285" y="496.551" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start">0</text><rect x="700.0" y="469.783" width="338.275" height="47.8" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="709.560" y="496.551" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start">1</text><rect x="1038.275" y="469.783" width="338.275" height="47.8" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="1047.835" y="496.551" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.988" font-weight="400" fill="#163142" text-anchor="start">MSB</text></g><g id="text-3" data-role="text-3"><text xml:space="preserve" x="23.450" y="555.823" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23.900" font-weight="400" fill="#123b51" text-anchor="start">100 (decimal) = 1100100 (binary)</text></g><g id="text-4" data-role="text-4"><text xml:space="preserve" x="23.450" y="591.673" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23.900" font-weight="400" fill="#123b51" text-anchor="start">Decimal examples: 13, 82, 90, 81, 23 — base 10.</text></g><g id="text-5" data-role="text-5"><text xml:space="preserve" x="23.450" y="627.523" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23.900" font-weight="400" fill="#123b51" text-anchor="start">Hexadecimal example: BD = 11 × 16 + 13 × 1 = 189 — base 16.</text></g></svg>