<svg xmlns="http://www.w3.org/2000/svg" width="1470" height="1450" viewBox="0 0 1470 1450" role="img"><title>Operators, assignment, lists, input and display</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1470" height="1450" fill="#fff"/><g id="heading-0" data-role="heading-0"><text xml:space="preserve" x="50.750" y="74.918" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.168" font-weight="700" fill="#123b51" text-anchor="start">Mathematical operators</text></g><g id="heading-1" data-role="heading-1"><text xml:space="preserve" x="50.750" y="115.728" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.168" font-weight="700" fill="#123b51" text-anchor="start">Comparison (relational) operators</text></g><g id="table-2" data-role="table-2"><rect x="50.75" y="132.37" width="520.03" height="42.4" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="59.230" y="156.114" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="700" fill="#fff" text-anchor="start">Operator</text><rect x="570.78" y="132.37" width="848.47" height="42.4" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="579.260" y="156.114" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="700" fill="#fff" text-anchor="start">Meaning</text><rect x="50.75" y="174.77" width="520.03" height="42.4" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="59.230" y="198.514" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="400" fill="#163142" text-anchor="start">&gt;</text><rect x="570.78" y="174.77" width="848.47" height="42.4" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="579.260" y="198.514" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="400" fill="#163142" text-anchor="start">Greater than: left value is larger</text><rect x="50.75" y="217.17" width="520.03" height="42.4" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="59.230" y="240.914" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="400" fill="#163142" text-anchor="start">&lt;</text><rect x="570.78" y="217.17" width="848.47" height="42.4" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="579.260" y="240.914" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="400" fill="#163142" text-anchor="start">Less than: left value is smaller</text><rect x="50.75" y="259.57" width="520.03" height="42.4" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="59.230" y="283.314" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="400" fill="#163142" text-anchor="start">&gt;=</text><rect x="570.78" y="259.57" width="848.47" height="42.4" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="579.260" y="283.314" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="400" fill="#163142" text-anchor="start">Greater than or equal to</text><rect x="50.75" y="301.97" width="520.03" height="42.4" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="59.230" y="325.714" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="400" fill="#163142" text-anchor="start">&lt;=</text><rect x="570.78" y="301.97" width="848.47" height="42.4" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="579.260" y="325.714" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="400" fill="#163142" text-anchor="start">Less than or equal to</text></g><g id="text-3" data-role="text-3"><text xml:space="preserve" x="50.750" y="378.290" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.200" font-weight="400" fill="#123b51" text-anchor="start">These compare two values and usually result in a Boolean value (True or False).</text></g><g id="heading-4" data-role="heading-4"><text xml:space="preserve" x="50.750" y="413.058" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.168" font-weight="700" fill="#123b51" text-anchor="start">Logical operators</text></g><g id="table-5" data-role="table-5"><rect x="50.75" y="429.7" width="520.03" height="42.4" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="59.230" y="453.444" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="700" fill="#fff" text-anchor="start">Operator</text><rect x="570.78" y="429.7" width="848.47" height="42.4" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="579.260" y="453.444" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="700" fill="#fff" text-anchor="start">Meaning</text><rect x="50.75" y="472.1" width="520.03" height="42.4" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="59.230" y="495.844" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="400" fill="#163142" text-anchor="start">AND</text><rect x="570.78" y="472.1" width="848.47" height="42.4" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="579.260" y="495.844" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="400" fill="#163142" text-anchor="start">True if both statements are true</text><rect x="50.75" y="514.5" width="520.03" height="42.4" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="59.230" y="538.244" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="400" fill="#163142" text-anchor="start">OR</text><rect x="570.78" y="514.5" width="848.47" height="42.4" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="579.260" y="538.244" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="400" fill="#163142" text-anchor="start">True if at least one statement is true</text><rect x="50.75" y="556.9" width="520.03" height="42.4" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="59.230" y="580.644" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="400" fill="#163142" text-anchor="start">NOT</text><rect x="570.78" y="556.9" width="848.47" height="42.4" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="579.260" y="580.644" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="400" fill="#163142" text-anchor="start">Reverses the result: True becomes False</text></g><g id="text-6" data-role="text-6"><text xml:space="preserve" x="50.750" y="633.220" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.200" font-weight="400" fill="#123b51" text-anchor="start">Used to combine conditional statements.</text></g><g id="heading-7" data-role="heading-7"><text xml:space="preserve" x="50.750" y="667.988" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.168" font-weight="700" fill="#123b51" text-anchor="start">Bitwise operators</text></g><g id="table-8" data-role="table-8"><rect x="50.75" y="684.63" width="520.03" height="42.4" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="59.230" y="708.374" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="700" fill="#fff" text-anchor="start">Operator</text><rect x="570.78" y="684.63" width="848.47" height="42.4" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="579.260" y="708.374" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="700" fill="#fff" text-anchor="start">Meaning</text><rect x="50.75" y="727.03" width="520.03" height="42.4" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="59.230" y="750.774" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="400" fill="#163142" text-anchor="start">&amp;</text><rect x="570.78" y="727.03" width="848.47" height="42.4" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="579.260" y="750.774" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="400" fill="#163142" text-anchor="start">AND on each bit pair</text><rect x="50.75" y="769.43" width="520.03" height="42.4" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="59.230" y="793.174" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="400" fill="#163142" text-anchor="start">|</text><rect x="570.78" y="769.43" width="848.47" height="42.4" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="579.260" y="793.174" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="400" fill="#163142" text-anchor="start">OR on each bit pair</text><rect x="50.75" y="811.83" width="520.03" height="42.4" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="59.230" y="835.574" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="400" fill="#163142" text-anchor="start">^</text><rect x="570.78" y="811.83" width="848.47" height="42.4" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="579.260" y="835.574" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="400" fill="#163142" text-anchor="start">XOR (exclusive OR)</text><rect x="50.75" y="854.23" width="520.03" height="42.4" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="59.230" y="877.974" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="400" fill="#163142" text-anchor="start">~</text><rect x="570.78" y="854.23" width="848.47" height="42.4" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="579.260" y="877.974" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="400" fill="#163142" text-anchor="start">NOT: invert all bits</text><rect x="50.75" y="896.63" width="520.03" height="42.4" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="59.230" y="920.374" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="400" fill="#163142" text-anchor="start">&lt;&lt;</text><rect x="570.78" y="896.63" width="848.47" height="42.4" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="579.260" y="920.374" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="400" fill="#163142" text-anchor="start">Shift bits left</text><rect x="50.75" y="939.03" width="520.03" height="42.4" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="59.230" y="962.774" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="400" fill="#163142" text-anchor="start">&gt;&gt;</text><rect x="570.78" y="939.03" width="848.47" height="42.4" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="579.260" y="962.774" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.504" font-weight="400" fill="#163142" text-anchor="start">Shift bits right</text></g><g id="text-9" data-role="text-9"><text xml:space="preserve" x="50.750" y="1015.350" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.200" font-weight="400" fill="#123b51" text-anchor="start">Operate on binary digits (bits) directly.</text></g><g id="heading-10" data-role="heading-10"><text xml:space="preserve" x="50.750" y="1050.118" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.168" font-weight="700" fill="#123b51" text-anchor="start">Assignment</text></g><g id="text-11" data-role="text-11"><text xml:space="preserve" x="50.750" y="1087.960" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.200" font-weight="400" fill="#123b51" text-anchor="start">a ← expression: evaluate expression and assign the result to variable a.</text></g><g id="heading-12" data-role="heading-12"><text xml:space="preserve" x="50.750" y="1122.728" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.168" font-weight="700" fill="#123b51" text-anchor="start">Lists</text></g><g id="text-13" data-role="text-13"><text xml:space="preserve" x="50.750" y="1160.570" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.200" font-weight="400" fill="#123b51" text-anchor="start">A list is a data abstraction that reduces program complexity by naming a collection of data without referring to the</text><text xml:space="preserve" x="50.750" y="1187.070" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.200" font-weight="400" fill="#123b51" text-anchor="start">specific details of the representation.</text></g><g id="bullet-14" data-role="bullet-14"><circle cx="54.56600000000001" cy="1211.4500000000023" r="2.7560000000000042" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="71.950" y="1218.870" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.200" font-weight="400" fill="#123b51" text-anchor="start">aList ← [value1, value2, value3]: create a new list; aList[1] = value1, aList[2] = value2, and so on.</text></g><g id="bullet-15" data-role="bullet-15"><circle cx="54.56600000000001" cy="1243.2500000000023" r="2.7560000000000042" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="71.950" y="1250.670" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.200" font-weight="400" fill="#123b51" text-anchor="start">aList ← []: create an empty list and assign it to aList.</text></g><g id="bullet-16" data-role="bullet-16"><circle cx="54.56600000000001" cy="1275.0500000000022" r="2.7560000000000042" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="71.950" y="1282.470" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.200" font-weight="400" fill="#123b51" text-anchor="start">aList ← bList: assign a copy of bList to aList.</text></g><g id="heading-17" data-role="heading-17"><text xml:space="preserve" x="50.750" y="1317.238" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.168" font-weight="700" fill="#123b51" text-anchor="start">Input and display</text></g><g id="bullet-18" data-role="bullet-18"><circle cx="54.56600000000001" cy="1347.6600000000024" r="2.7560000000000042" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="71.950" y="1355.080" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.200" font-weight="400" fill="#123b51" text-anchor="start">DISPLAY(expression): display the value followed by a space.</text></g><g id="bullet-19" data-role="bullet-19"><circle cx="54.56600000000001" cy="1379.4600000000023" r="2.7560000000000042" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="71.950" y="1386.880" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.200" font-weight="400" fill="#123b51" text-anchor="start">INPUT(): accept a value from the user and return it.</text></g></svg>