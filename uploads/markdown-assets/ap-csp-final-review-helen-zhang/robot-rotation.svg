<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1400" viewBox="0 0 1040 1400" role="img"><title>Robot directions, 90-degree rotations and computing concepts</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1040" height="1400" fill="#fff"/><g id="heading-0" data-role="heading-0"><text xml:space="preserve" x="36.400" y="60.959" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.559" font-weight="700" fill="#123b51" text-anchor="start">Robot movement and rotation</text></g><g id="table-1" data-role="table-1"><rect x="36.4" y="77.87" width="367.536" height="43.086" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="45.017" y="101.998" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="700" fill="#fff" text-anchor="start">Direction</text><rect x="403.936" y="77.87" width="599.664" height="43.086" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="412.553" y="101.998" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="700" fill="#fff" text-anchor="start">Movement effect</text><rect x="36.4" y="120.956" width="367.536" height="43.086" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="45.017" y="145.084" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">North</text><rect x="403.936" y="120.956" width="599.664" height="43.086" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="412.553" y="145.084" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">Up: y + 1</text><rect x="36.4" y="164.041" width="367.536" height="43.086" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="45.017" y="188.169" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">South</text><rect x="403.936" y="164.041" width="599.664" height="43.086" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="412.553" y="188.169" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">Down: y − 1</text><rect x="36.4" y="207.127" width="367.536" height="43.086" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="45.017" y="231.255" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">East</text><rect x="403.936" y="207.127" width="599.664" height="43.086" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="412.553" y="231.255" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">Right: x + 1</text><rect x="36.4" y="250.213" width="367.536" height="43.086" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="45.017" y="274.341" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">West</text><rect x="403.936" y="250.213" width="599.664" height="43.086" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="412.553" y="274.341" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">Left: x − 1</text></g><g id="table-2" data-role="table-2"><rect x="36.4" y="306.224" width="322.4" height="43.086" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="45.017" y="330.352" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="700" fill="#fff" text-anchor="start">Command</text><rect x="358.8" y="306.224" width="322.4" height="43.086" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="367.417" y="330.352" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="700" fill="#fff" text-anchor="start">Description</text><rect x="681.2" y="306.224" width="322.4" height="43.086" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="689.817" y="330.352" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="700" fill="#fff" text-anchor="start">Return value</text><rect x="36.4" y="349.31" width="322.4" height="71.091" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="45.017" y="373.438" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">MOVE_FORWARD()</text><rect x="358.8" y="349.31" width="322.4" height="71.091" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="367.417" y="373.438" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">Move one square in the</text><text xml:space="preserve" x="367.417" y="401.444" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">direction currently faced</text><rect x="681.2" y="349.31" width="322.4" height="71.091" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="689.817" y="373.438" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">None</text><rect x="36.4" y="420.401" width="322.4" height="99.097" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="45.017" y="444.529" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">ROTATE_LEFT()</text><rect x="358.8" y="420.401" width="322.4" height="99.097" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="367.417" y="444.529" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">Rotate 90°</text><text xml:space="preserve" x="367.417" y="472.535" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">counterclockwise, e.g.</text><text xml:space="preserve" x="367.417" y="500.541" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">North → West</text><rect x="681.2" y="420.401" width="322.4" height="99.097" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="689.817" y="444.529" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">None</text><rect x="36.4" y="519.499" width="322.4" height="71.091" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="45.017" y="543.627" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">ROTATE_RIGHT()</text><rect x="358.8" y="519.499" width="322.4" height="71.091" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="367.417" y="543.627" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">Rotate 90° clockwise, e.g.</text><text xml:space="preserve" x="367.417" y="571.632" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">North → East</text><rect x="681.2" y="519.499" width="322.4" height="71.091" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="689.817" y="543.627" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">None</text><rect x="36.4" y="590.59" width="322.4" height="71.091" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="45.017" y="614.718" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">CAN_MOVE(direction)</text><rect x="358.8" y="590.59" width="322.4" height="71.091" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="367.417" y="614.718" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">Check if a move is possible</text><text xml:space="preserve" x="367.417" y="642.724" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">in the given direction</text><rect x="681.2" y="590.59" width="322.4" height="71.091" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="689.817" y="614.718" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">Boolean: true / false</text></g><g id="table-3" data-role="table-3"><rect x="36.4" y="674.607" width="367.536" height="43.086" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="45.017" y="698.735" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="700" fill="#fff" text-anchor="start">Condition</text><rect x="403.936" y="674.607" width="599.664" height="43.086" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="412.553" y="698.735" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="700" fill="#fff" text-anchor="start">Behavior / logic</text><rect x="36.4" y="717.693" width="367.536" height="71.091" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="45.017" y="741.821" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">Grid boundaries</text><rect x="403.936" y="717.693" width="599.664" height="71.091" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="412.553" y="741.821" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">Grid is typically bounded, e.g. 1 to n; movement</text><text xml:space="preserve" x="412.553" y="769.827" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">outside is not allowed</text><rect x="36.4" y="788.784" width="367.536" height="71.091" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="45.017" y="812.912" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">CAN_MOVE result</text><rect x="403.936" y="788.784" width="599.664" height="71.091" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="412.553" y="812.912" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">False if move hits wall/boundary or obstacle (black</text><text xml:space="preserve" x="412.553" y="840.918" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">square); otherwise true</text><rect x="36.4" y="859.876" width="367.536" height="71.091" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="45.017" y="884.004" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">Runtime error</text><rect x="403.936" y="859.876" width="599.664" height="71.091" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="412.553" y="884.004" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">MOVE_FORWARD() when CAN_MOVE is false usually</text><text xml:space="preserve" x="412.553" y="912.009" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">terminates with an error</text><rect x="36.4" y="930.967" width="367.536" height="71.091" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="45.017" y="955.095" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">Goal state</text><rect x="403.936" y="930.967" width="599.664" height="71.091" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="412.553" y="955.095" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">Success when robot reaches the designated goal</text><text xml:space="preserve" x="412.553" y="983.101" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.819" font-weight="400" fill="#163142" text-anchor="start">square, often green</text></g><g id="heading-4" data-role="heading-4"><text xml:space="preserve" x="36.400" y="1039.543" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.559" font-weight="700" fill="#123b51" text-anchor="start">Computing concepts visible below the robot notes</text></g><g id="bullet-5" data-role="bullet-5"><circle cx="40.277714285714296" cy="1070.4571428571442" r="2.8005714285714323" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="57.943" y="1077.997" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.543" font-weight="400" fill="#123b51" text-anchor="start">Computing device: a physical artifact that can run a program; examples include</text><text xml:space="preserve" x="57.943" y="1104.926" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.543" font-weight="400" fill="#123b51" text-anchor="start">computers, tablets and servers.</text></g><g id="bullet-6" data-role="bullet-6"><circle cx="40.277714285714296" cy="1129.7000000000014" r="2.8005714285714323" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="57.943" y="1137.240" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.543" font-weight="400" fill="#123b51" text-anchor="start">Input → processing → output.</text></g><g id="bullet-7" data-role="bullet-7"><circle cx="40.277714285714296" cy="1162.014285714287" r="2.8005714285714323" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="57.943" y="1169.554" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.543" font-weight="400" fill="#123b51" text-anchor="start">Computing input devices include keyboard, mouse and scanner.</text></g><g id="bullet-8" data-role="bullet-8"><circle cx="40.277714285714296" cy="1194.3285714285728" r="2.8005714285714323" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="57.943" y="1201.869" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.543" font-weight="400" fill="#123b51" text-anchor="start">Digital cameras, printers and calculators can all be computing devices; not all</text><text xml:space="preserve" x="57.943" y="1228.797" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.543" font-weight="400" fill="#123b51" text-anchor="start">computing devices are computers.</text></g><g id="bullet-9" data-role="bullet-9"><circle cx="40.277714285714296" cy="1253.57142857143" r="2.8005714285714323" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="57.943" y="1261.111" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.543" font-weight="400" fill="#123b51" text-anchor="start">Computing system: computing devices and programs working together for a common</text><text xml:space="preserve" x="57.943" y="1288.040" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.543" font-weight="400" fill="#123b51" text-anchor="start">purpose.</text></g><g id="bullet-10" data-role="bullet-10"><circle cx="40.277714285714296" cy="1312.8142857142873" r="2.8005714285714323" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="57.943" y="1320.354" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.543" font-weight="400" fill="#123b51" text-anchor="start">Network bandwidth: maximum amount of data that can be sent in a fixed amount of</text><text xml:space="preserve" x="57.943" y="1347.283" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.543" font-weight="400" fill="#123b51" text-anchor="start">time.</text></g></svg>