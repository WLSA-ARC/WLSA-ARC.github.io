<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 850"><title>Ethanolvapourequilibrium</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="550" y="42" font-size="31" fill="#172033" text-anchor="middle" font-weight="700">Establishing ethanol equilibrium vapour pressure</text><circle cx="190" cy="300" r="115" fill="white" stroke="#172033" stroke-width="3"/><rect x="155" y="110" width="70" height="88" rx="0" fill="white" stroke="#172033" stroke-width="3"/><rect x="145" y="103" width="90" height="20" rx="0" fill="#e2e8f0" stroke="#172033" stroke-width="2"/><text x="190" y="75" font-size="24" fill="#172033" text-anchor="middle">P = 0</text><rect x="40" y="470" width="300" height="93.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="55" y="507" font-size="25" fill="#172033">Evacuated sealed flask:</text><text x="55" y="539" font-size="25" fill="#172033">pressure zero.</text><circle cx="550" cy="300" r="115" fill="white" stroke="#172033" stroke-width="3"/><rect x="515" y="110" width="70" height="88" rx="0" fill="white" stroke="#172033" stroke-width="3"/><rect x="505" y="103" width="90" height="20" rx="0" fill="#e2e8f0" stroke="#172033" stroke-width="2"/><path d="M440 335 Q550 400 660 335" fill="#fecdd3" stroke="#172033" stroke-width="1.5"/><text x="550" y="75" font-size="24" fill="#172033" text-anchor="middle">P increasing</text><circle cx="500" cy="245" r="8" fill="#fecdd3" stroke="#172033" stroke-width="2"/><circle cx="600" cy="235" r="8" fill="#fecdd3" stroke="#172033" stroke-width="2"/><circle cx="550" cy="290" r="8" fill="#fecdd3" stroke="#172033" stroke-width="2"/><circle cx="485" cy="290" r="8" fill="#fecdd3" stroke="#172033" stroke-width="2"/><circle cx="600" cy="295" r="8" fill="#fecdd3" stroke="#172033" stroke-width="2"/><line x1="520" y1="340" x2="520" y2="255" stroke="#dc2626" stroke-width="3"/><path d="M515.5 265 L520 255 L524.5 265" fill="none" stroke="#dc2626" stroke-width="3"/><rect x="400" y="470" width="300" height="125.5" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="415" y="507" font-size="25" fill="#172033">Add liquid ethanol.</text><text x="415" y="539" font-size="25" fill="#172033">Vaporisation raises the</text><text x="415" y="571" font-size="25" fill="#172033">pressure.</text><circle cx="910" cy="300" r="115" fill="white" stroke="#172033" stroke-width="3"/><rect x="875" y="110" width="70" height="88" rx="0" fill="white" stroke="#172033" stroke-width="3"/><rect x="865" y="103" width="90" height="20" rx="0" fill="#e2e8f0" stroke="#172033" stroke-width="2"/><path d="M800 335 Q910 400 1020 335" fill="#fecdd3" stroke="#172033" stroke-width="1.5"/><text x="910" y="75" font-size="24" fill="#172033" text-anchor="middle">P = equilibrium vapour pressure</text><circle cx="860" cy="245" r="8" fill="#fecdd3" stroke="#172033" stroke-width="2"/><circle cx="960" cy="235" r="8" fill="#fecdd3" stroke="#172033" stroke-width="2"/><circle cx="910" cy="290" r="8" fill="#fecdd3" stroke="#172033" stroke-width="2"/><circle cx="845" cy="290" r="8" fill="#fecdd3" stroke="#172033" stroke-width="2"/><circle cx="960" cy="295" r="8" fill="#fecdd3" stroke="#172033" stroke-width="2"/><line x1="880" y1="340" x2="880" y2="255" stroke="#dc2626" stroke-width="3"/><path d="M875.5 265 L880 255 L884.5 265" fill="none" stroke="#dc2626" stroke-width="3"/><line x1="940" y1="255" x2="940" y2="340" stroke="#2563eb" stroke-width="3"/><path d="M944.5 330 L940 340 L935.5 330" fill="none" stroke="#2563eb" stroke-width="3"/><rect x="760" y="470" width="300" height="190.5" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="775" y="507" font-size="25" fill="#172033">At equilibrium,</text><text x="775" y="539" font-size="25" fill="#172033">molecules enter and</text><text x="775" y="571" font-size="25" fill="#172033">leave the liquid at equal</text><text x="775" y="603" font-size="25" fill="#172033">rates. Pressure is</text><text x="775" y="635" font-size="25" fill="#172033">steady.</text><line x1="315" y1="300" x2="420" y2="300" stroke="#2563eb" stroke-width="4"/><path d="M406 293.7 L420 300 L406 306.3" fill="none" stroke="#2563eb" stroke-width="4"/><line x1="675" y1="300" x2="780" y2="300" stroke="#2563eb" stroke-width="4"/><path d="M766 293.7 L780 300 L766 306.3" fill="none" stroke="#2563eb" stroke-width="4"/><text x="550" y="735" font-size="29" fill="#172033" text-anchor="middle">Liquid ethanol ⇌ ethanol vapour in a closed system</text></g></svg>
