<svg xmlns="http://www.w3.org/2000/svg" width="850" height="360" viewBox="0 0 850 360" role="img"><title>Probability tree: first-stage A/B withP(A)/P(B), children A1/A2 andB1/B2 withP(A1),P(A2),P(B1),P(B2) labels.</title><rect width="100%" height="100%" fill="white"/><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve">Two-stage probability tree</text><path d="M50 200L230 115" fill="none" stroke="#263445" stroke-width="2"/><path d="M50 200L230 285" fill="none" stroke="#263445" stroke-width="2"/><text x="135" y="130" font-family="Arial,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">A: P(A)</text><text x="135" y="300" font-family="Arial,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">B: P(B)</text><path d="M230 115L420 67" fill="none" stroke="#263445" stroke-width="2"/><text x="440" y="74" font-family="Arial,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">A₁: P(A₁)</text><path d="M230 115L420 163" fill="none" stroke="#263445" stroke-width="2"/><text x="440" y="170" font-family="Arial,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">A₂: P(A₂)</text><path d="M230 285L420 237" fill="none" stroke="#263445" stroke-width="2"/><text x="440" y="244" font-family="Arial,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">B₁: P(B₁)</text><path d="M230 285L420 333" fill="none" stroke="#263445" stroke-width="2"/><text x="440" y="340" font-family="Arial,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">B₂: P(B₂)</text></svg>
