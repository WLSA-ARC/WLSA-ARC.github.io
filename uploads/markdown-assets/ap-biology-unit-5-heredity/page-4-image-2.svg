<svg xmlns="http://www.w3.org/2000/svg" width="1111" height="603" viewBox="0 0 1111 603" role="img"><title>## Random Fertilization</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1111" height="603" fill="#fff"/><g id="heading-0" data-role="heading-0"><text xml:space="preserve" x="21.105" y="64.425" font-family="Arial, Microsoft YaHei, sans-serif" font-size="43.320" font-weight="700" fill="#123b51" text-anchor="start">Random Fertilization</text></g><g id="bullet-1" data-role="bullet-1"><circle cx="27.945" cy="118.955" r="4.94" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="59.105" y="132.255" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">Any sperm can fuse with any ovum (unfertilized</text><text xml:space="preserve" x="59.105" y="179.755" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">egg), adding genetic variation.</text></g><g id="bullet-2" data-role="bullet-2"><circle cx="27.945" cy="223.45499999999998" r="4.94" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="59.105" y="236.755" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">Each gamete has 8.4 million possible chromosome</text><text xml:space="preserve" x="59.105" y="284.255" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">combinations from independent assortment. Fusion</text><text xml:space="preserve" x="59.105" y="331.755" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">of two gametes produces a zygote with about 70</text><text xml:space="preserve" x="59.105" y="379.255" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">trillion diploid combinations.</text></g></svg>