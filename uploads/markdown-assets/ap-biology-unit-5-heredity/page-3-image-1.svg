<svg xmlns="http://www.w3.org/2000/svg" width="1075" height="775" viewBox="0 0 1075 775" role="img"><title>Crossing over</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1075" height="775" fill="#fff"/><g transform="scale(1.075 1.1071428571428572)"><text xml:space="preserve" x="28.000" y="38.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.000" font-weight="700" fill="#173c52" text-anchor="start">Crossing Over</text><text xml:space="preserve" x="35.000" y="100.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="26.000" font-weight="400" fill="#173c52" text-anchor="start">Crossing over produces recombinant chromosomes, combining DNA</text><text xml:space="preserve" x="35.000" y="132.500" font-family="Arial, Microsoft YaHei, sans-serif" font-size="26.000" font-weight="400" fill="#173c52" text-anchor="start">inherited from each parent.</text><text xml:space="preserve" x="35.000" y="200.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="26.000" font-weight="400" fill="#173c52" text-anchor="start">Crossing over contributes to genetic variation by combining DNA</text><text xml:space="preserve" x="35.000" y="232.500" font-family="Arial, Microsoft YaHei, sans-serif" font-size="26.000" font-weight="400" fill="#173c52" text-anchor="start">from two parents into a single chromosome.</text><text xml:space="preserve" x="35.000" y="300.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="26.000" font-weight="400" fill="#173c52" text-anchor="start">In humans an average of one to three crossover events occurs per</text><text xml:space="preserve" x="35.000" y="332.500" font-family="Arial, Microsoft YaHei, sans-serif" font-size="26.000" font-weight="400" fill="#173c52" text-anchor="start">chromosome.</text><g id="crossover-stage-1" data-role="crossover-stage-1"><line x1="70" y1="470" x2="70" y2="635" stroke="#477fa5" stroke-width="7"/><line x1="84" y1="470" x2="84" y2="635" stroke="#477fa5" stroke-width="7"/><line x1="116" y1="470" x2="116" y2="635" stroke="#c67a83" stroke-width="7"/><line x1="130" y1="470" x2="130" y2="635" stroke="#c67a83" stroke-width="7"/><line x1="165" y1="550" x2="285" y2="550" stroke="#28546c" stroke-width="3" marker-end="url(#arrow)"/></g><g id="crossover-stage-2" data-role="crossover-stage-2"><line x1="325" y1="470" x2="325" y2="635" stroke="#477fa5" stroke-width="7"/><line x1="339" y1="470" x2="339" y2="635" stroke="#477fa5" stroke-width="7"/><line x1="371" y1="470" x2="371" y2="635" stroke="#c67a83" stroke-width="7"/><line x1="385" y1="470" x2="385" y2="635" stroke="#c67a83" stroke-width="7"/><line x1="420" y1="550" x2="540" y2="550" stroke="#28546c" stroke-width="3" marker-end="url(#arrow)"/></g><g id="crossover-stage-3" data-role="crossover-stage-3"><line x1="580" y1="470" x2="580" y2="635" stroke="#477fa5" stroke-width="7"/><line x1="594" y1="470" x2="594" y2="635" stroke="#477fa5" stroke-width="7"/><line x1="626" y1="470" x2="626" y2="635" stroke="#c67a83" stroke-width="7"/><line x1="640" y1="470" x2="640" y2="635" stroke="#c67a83" stroke-width="7"/><path d="M594 520L626 565M626 520L594 565" fill="none" stroke="#586e85" stroke-width="3"/><line x1="675" y1="550" x2="795" y2="550" stroke="#28546c" stroke-width="3" marker-end="url(#arrow)"/></g><g id="crossover-stage-4" data-role="crossover-stage-4"><line x1="835" y1="470" x2="835" y2="635" stroke="#477fa5" stroke-width="7"/><line x1="849" y1="470" x2="849" y2="635" stroke="#477fa5" stroke-width="7"/><line x1="881" y1="470" x2="881" y2="635" stroke="#c67a83" stroke-width="7"/><line x1="895" y1="470" x2="895" y2="635" stroke="#c67a83" stroke-width="7"/><line x1="849" y1="560" x2="849" y2="635" stroke="#c67a83" stroke-width="7"/><line x1="881" y1="560" x2="881" y2="635" stroke="#477fa5" stroke-width="7"/></g></g></svg>