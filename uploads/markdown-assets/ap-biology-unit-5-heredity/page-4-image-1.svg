<svg xmlns="http://www.w3.org/2000/svg" width="1129" height="612" viewBox="0 0 1129 612" role="img"><title>## Independent Assortment of Chromosomes</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1129" height="612" fill="#fff"/><g id="heading-0" data-role="heading-0"><text xml:space="preserve" x="21.420" y="64.740" font-family="Arial, Microsoft YaHei, sans-serif" font-size="43.320" font-weight="700" fill="#123b51" text-anchor="start">Independent Assortment of Chromosomes</text></g><g id="bullet-1" data-role="bullet-1"><circle cx="28.26" cy="119.27" r="4.94" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="59.420" y="132.570" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">Homologous pairs of chromosomes orient randomly at</text><text xml:space="preserve" x="59.420" y="180.070" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">metaphase I of meiosis.</text></g><g id="bullet-2" data-role="bullet-2"><circle cx="28.26" cy="223.76999999999998" r="4.94" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="59.420" y="237.070" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">Each pair sorts maternal and paternal homologs</text><text xml:space="preserve" x="59.420" y="284.570" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">into daughter cells independently of the other</text><text xml:space="preserve" x="59.420" y="332.070" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">pairs.</text></g></svg>