<svg xmlns="http://www.w3.org/2000/svg" width="1098" height="814" viewBox="0 0 1098 814" role="img"><title>Cyclic AMP second messenger</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1098" height="814" fill="#fff"/><g transform="scale(1.098 1.1628571428571428)"><text xml:space="preserve" x="28.000" y="38.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.000" font-weight="700" fill="#173c52" text-anchor="start">Cyclic AMP (cAMP)</text><text xml:space="preserve" x="35.000" y="100.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="26.000" font-weight="400" fill="#173c52" text-anchor="start">cAMP is one of the most widely used second messengers.</text><text xml:space="preserve" x="35.000" y="160.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.000" font-weight="400" fill="#173c52" text-anchor="start">Adenylyl cyclase is an enzyme in the plasma membrane. An extracellular</text><text xml:space="preserve" x="35.000" y="190.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.000" font-weight="400" fill="#173c52" text-anchor="start">signal triggers ATP → cAMP + pyrophosphate (PPᵢ).</text><rect x="35" y="245" width="220" height="75" rx="10" fill="#edf5fa" stroke="#7396ab"/><text xml:space="preserve" x="47.000" y="293.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#132e40" text-anchor="start">ATP</text><line x1="280" y1="282" x2="490" y2="282" stroke="#28546c" stroke-width="4" marker-end="url(#arrow)"/><text xml:space="preserve" x="280.000" y="235.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23.000" font-weight="400" fill="#173c52" text-anchor="start">Adenylyl cyclase</text><rect x="520" y="245" width="200" height="75" rx="10" fill="#edf5fa" stroke="#7396ab"/><text xml:space="preserve" x="532.000" y="293.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#132e40" text-anchor="start">cAMP</text><text xml:space="preserve" x="755.000" y="296.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="35.000" font-weight="400" fill="#173c52" text-anchor="start">+</text><rect x="800" y="245" width="170" height="75" rx="10" fill="#edf5fa" stroke="#7396ab"/><text xml:space="preserve" x="812.000" y="293.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#132e40" text-anchor="start">PPᵢ</text><circle cx="70" cy="475" r="25" fill="#f6e3ab" stroke="#28546c" stroke-width="2"/><text xml:space="preserve" x="70.000" y="480.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16.000" font-weight="700" fill="#102b3b" text-anchor="middle">P</text><circle cx="130" cy="475" r="25" fill="#f6e3ab" stroke="#28546c" stroke-width="2"/><text xml:space="preserve" x="130.000" y="480.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16.000" font-weight="700" fill="#102b3b" text-anchor="middle">P</text><circle cx="190" cy="475" r="25" fill="#f6e3ab" stroke="#28546c" stroke-width="2"/><text xml:space="preserve" x="190.000" y="480.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16.000" font-weight="700" fill="#102b3b" text-anchor="middle">P</text><line x1="96" y1="475" x2="104" y2="475" stroke="#28546c" stroke-width="2"/><line x1="156" y1="475" x2="164" y2="475" stroke="#28546c" stroke-width="2"/><line x1="215" y1="475" x2="250" y2="475" stroke="#28546c" stroke-width="2"/><rect x="250" y="440" width="95" height="70" rx="10" fill="#edf5fa" stroke="#7396ab"/><text xml:space="preserve" x="262.000" y="470.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.000" font-weight="400" fill="#132e40" text-anchor="start">Ribose</text><line x1="345" y1="475" x2="370" y2="475" stroke="#28546c" stroke-width="2"/><rect x="370" y="440" width="100" height="70" rx="10" fill="#edf5fa" stroke="#7396ab"/><text xml:space="preserve" x="382.000" y="470.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.000" font-weight="400" fill="#132e40" text-anchor="start">Adenine</text><text xml:space="preserve" x="40.000" y="555.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22.000" font-weight="400" fill="#173c52" text-anchor="start">ATP: three phosphate groups</text><rect x="565" y="440" width="100" height="70" rx="10" fill="#edf5fa" stroke="#7396ab"/><text xml:space="preserve" x="577.000" y="470.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.000" font-weight="400" fill="#132e40" text-anchor="start">Ribose</text><line x1="665" y1="475" x2="690" y2="475" stroke="#28546c" stroke-width="2"/><rect x="690" y="440" width="100" height="70" rx="10" fill="#edf5fa" stroke="#7396ab"/><text xml:space="preserve" x="702.000" y="470.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.000" font-weight="400" fill="#132e40" text-anchor="start">Adenine</text><circle cx="615" cy="600" r="25" fill="#f6e3ab" stroke="#28546c" stroke-width="2"/><text xml:space="preserve" x="615.000" y="605.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16.000" font-weight="700" fill="#102b3b" text-anchor="middle">P</text><path d="M580 510V570L593 585M650 510V570L637 585" fill="none" stroke="#28546c" stroke-width="2"/><text xml:space="preserve" x="530.000" y="555.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.000" font-weight="400" fill="#173c52" text-anchor="start">5′–O</text><text xml:space="preserve" x="655.000" y="555.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.000" font-weight="400" fill="#173c52" text-anchor="start">3′–O</text><text xml:space="preserve" x="535.000" y="655.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.000" font-weight="400" fill="#173c52" text-anchor="start">One cyclic phosphate</text><circle cx="865" cy="490" r="25" fill="#f6e3ab" stroke="#28546c" stroke-width="2"/><text xml:space="preserve" x="865.000" y="495.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16.000" font-weight="700" fill="#102b3b" text-anchor="middle">P</text><circle cx="935" cy="490" r="25" fill="#f6e3ab" stroke="#28546c" stroke-width="2"/><text xml:space="preserve" x="935.000" y="495.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16.000" font-weight="700" fill="#102b3b" text-anchor="middle">P</text><line x1="890" y1="490" x2="910" y2="490" stroke="#28546c" stroke-width="2"/><text xml:space="preserve" x="820.000" y="555.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.000" font-weight="400" fill="#173c52" text-anchor="start">PPᵢ: two linked</text><text xml:space="preserve" x="820.000" y="580.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.000" font-weight="400" fill="#173c52" text-anchor="start">phosphate groups</text></g></svg>