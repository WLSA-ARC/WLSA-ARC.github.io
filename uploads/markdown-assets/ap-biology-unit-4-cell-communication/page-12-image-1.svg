<svg xmlns="http://www.w3.org/2000/svg" width="1054" height="699" viewBox="0 0 1054 699" role="img"><title>Cyclins and cyclin-dependent kinases</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1054" height="699" fill="#fff"/><g id="text-0" data-role="text-0"><text xml:space="preserve" x="24.465" y="62.108" font-family="Arial, Microsoft YaHei, sans-serif" font-size="37.643" font-weight="400" fill="#123b51" text-anchor="start">The Cell Cycle Clock: Cyclins and</text><text xml:space="preserve" x="24.465" y="109.161" font-family="Arial, Microsoft YaHei, sans-serif" font-size="37.643" font-weight="400" fill="#123b51" text-anchor="start">Cyclin-Dependent Kinases</text></g><g id="text-1" data-role="text-1"><text xml:space="preserve" x="24.465" y="165.626" font-family="Arial, Microsoft YaHei, sans-serif" font-size="37.643" font-weight="400" fill="#123b51" text-anchor="start">a) Two types of regulatory proteins are involved</text><text xml:space="preserve" x="24.465" y="212.679" font-family="Arial, Microsoft YaHei, sans-serif" font-size="37.643" font-weight="400" fill="#123b51" text-anchor="start">in cell cycle control: cyclins and</text><text xml:space="preserve" x="24.465" y="259.733" font-family="Arial, Microsoft YaHei, sans-serif" font-size="37.643" font-weight="400" fill="#123b51" text-anchor="start">cyclin-dependent kinases (Cdks). b) The activity</text><text xml:space="preserve" x="24.465" y="306.786" font-family="Arial, Microsoft YaHei, sans-serif" font-size="37.643" font-weight="400" fill="#123b51" text-anchor="start">of a Cdk rises and falls with changes in</text><text xml:space="preserve" x="24.465" y="353.840" font-family="Arial, Microsoft YaHei, sans-serif" font-size="37.643" font-weight="400" fill="#123b51" text-anchor="start">concentration of its cyclin partner. c) MPF</text><text xml:space="preserve" x="24.465" y="400.894" font-family="Arial, Microsoft YaHei, sans-serif" font-size="37.643" font-weight="400" fill="#123b51" text-anchor="start">(maturation-promoting factor) is a cyclin-Cdk</text><text xml:space="preserve" x="24.465" y="447.947" font-family="Arial, Microsoft YaHei, sans-serif" font-size="37.643" font-weight="400" fill="#123b51" text-anchor="start">complex that triggers a cell’s passage past the</text><text xml:space="preserve" x="24.465" y="495.001" font-family="Arial, Microsoft YaHei, sans-serif" font-size="37.643" font-weight="400" fill="#123b51" text-anchor="start">G₂ checkpoint into the M phase.</text></g></svg>