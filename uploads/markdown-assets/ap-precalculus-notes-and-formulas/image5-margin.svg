<svg xmlns="http://www.w3.org/2000/svg" width="900" height="289" viewBox="0 0 900 289" role="img"><title>Complex-number polar form z=r(cos theta+i sin theta), examples3+4i and4-i, modulus5, principal argument tan theta=y/x=4/3; red/blue annotations and clipped neighbors.</title><rect width="100%" height="100%" fill="white"/><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve">Polar form of a complex number</text><g id="review-equations-and-explanation"><text x="30" y="85" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">z = r(cos θ + i sin θ)</text><text x="30" y="119" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Example: z = 3 + 4i ↔ point (3, 4)</text><text x="30" y="153" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">r = |z| = √(3² + 4²) = 5</text><text x="30" y="187" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Principal argument: tan θ = y/x = 4/3</text><text x="30" y="221" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">θ = arctan(4/3), with the quadrant taken into account.</text><text x="30" y="255" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Another example: z = 4 − i ↔ point (4, −1)</text></g></svg>
