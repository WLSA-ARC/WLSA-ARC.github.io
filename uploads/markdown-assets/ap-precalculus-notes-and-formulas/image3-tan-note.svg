<svg xmlns="http://www.w3.org/2000/svg" width="900" height="187" viewBox="0 0 900 187" role="img"><title>Tangent sign rule written in blue Chinese: same-sign numerator/denominator positive, opposite-sign negative, with a clipped prior line.</title><rect width="100%" height="100%" fill="white"/><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve">Signs of the tangent ratio</text><g id="review-equations-and-explanation"><text x="30" y="85" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">tan θ = sin θ / cos θ</text><text x="30" y="119" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Same signs in numerator and denominator → positive.</text><text x="30" y="153" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Opposite signs → negative.</text></g></svg>
