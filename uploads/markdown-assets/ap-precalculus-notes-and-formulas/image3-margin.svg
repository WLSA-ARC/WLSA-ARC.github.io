<svg xmlns="http://www.w3.org/2000/svg" width="900" height="391" viewBox="0 0 900 391" role="img"><title>Nine trigonometric/inverse-trigonometric identity groups: tan/cot ratios, reciprocal sec/csc, Pythagorean identities, parity, tangent period, arcsin/arccos/arctan domains; right-edge tangent line is cut.</title><rect width="100%" height="100%" fill="white"/><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve">Trigonometric identities and inverse functions</text><g id="review-equations-and-explanation"><text x="30" y="85" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">tan θ = sin θ / cos θ; cot θ = cos θ / sin θ</text><text x="30" y="119" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">csc θ = 1/sin θ; sec θ = 1/cos θ; cot θ = 1/tan θ</text><text x="30" y="153" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">sin²θ + cos²θ = 1</text><text x="30" y="187" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">tan²θ + 1 = sec²θ; cot²θ + 1 = csc²θ</text><text x="30" y="221" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">sin(−θ) = −sin θ; cos(−θ) = cos θ; tan(−θ) = −tan θ</text><text x="30" y="255" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">tan(θ + π) = tan θ; full rotation = 2π</text><text x="30" y="289" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">y = arcsin x ↔ x = sin y; −π/2 ≤ y ≤ π/2</text><text x="30" y="323" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">y = arccos x ↔ x = cos y; 0 ≤ y ≤ π</text><text x="30" y="357" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">y = arctan x ↔ x = tan y; −π/2 &lt; y &lt; π/2</text></g></svg>
