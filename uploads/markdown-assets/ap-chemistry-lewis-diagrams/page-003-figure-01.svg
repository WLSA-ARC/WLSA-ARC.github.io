<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="735" viewBox="0 0 1100 735"><title>CCl4Lewissteps</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="550" y="42" font-size="32" fill="#172033" text-anchor="middle" font-weight="700">Drawing CCl₄: 32 valence electrons</text><rect x="40" y="90" width="560" height="93.0" rx="8" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.6"/><text x="55" y="127" font-size="25" fill="#172033">1 Count valence electrons</text><text x="55" y="159" font-size="25" fill="#172033">C + 4Cl = 4 + (4 × 7) = 32</text><rect x="40" y="238" width="560" height="93.0" rx="8" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.6"/><text x="55" y="275" font-size="25" fill="#172033">2 Place the atoms</text><text x="55" y="307" font-size="25" fill="#172033">Carbon central, four chlorine atoms</text><rect x="40" y="386" width="560" height="93.0" rx="8" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.6"/><text x="55" y="423" font-size="25" fill="#172033">3 Add four bonding pairs</text><text x="55" y="455" font-size="25" fill="#172033">8 electrons used; 32 − 8 = 24 left</text><rect x="40" y="534" width="560" height="125.5" rx="8" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.6"/><text x="55" y="571" font-size="25" fill="#172033">4 Add the remaining lone pairs</text><text x="55" y="603" font-size="25" fill="#172033">24 electrons = 12 lone pairs; three pairs on</text><text x="55" y="635" font-size="25" fill="#172033">every Cl</text><line x1="835" y1="350" x2="835" y2="165" stroke="#172033" stroke-width="2.8"/><rect x="812.5" y="142.38" width="45.0" height="43.68000000000001" rx="0" fill="white" stroke="none" stroke-width="0"/><text x="835" y="177.48" font-size="39" fill="#172033" text-anchor="middle">Cl</text><circle cx="828" cy="125" r="4" fill="#172033" stroke="#172033" stroke-width="0"/><circle cx="842" cy="125" r="4" fill="#172033" stroke="#172033" stroke-width="0"/><circle cx="795" cy="158" r="4" fill="#172033" stroke="#172033" stroke-width="0"/><circle cx="795" cy="172" r="4" fill="#172033" stroke="#172033" stroke-width="0"/><circle cx="875" cy="158" r="4" fill="#172033" stroke="#172033" stroke-width="0"/><circle cx="875" cy="172" r="4" fill="#172033" stroke="#172033" stroke-width="0"/><line x1="835" y1="350" x2="650" y2="350" stroke="#172033" stroke-width="2.8"/><rect x="627.5" y="327.38" width="45.0" height="43.68000000000001" rx="0" fill="white" stroke="none" stroke-width="0"/><text x="650" y="362.48" font-size="39" fill="#172033" text-anchor="middle">Cl</text><circle cx="643" cy="310" r="4" fill="#172033" stroke="#172033" stroke-width="0"/><circle cx="657" cy="310" r="4" fill="#172033" stroke="#172033" stroke-width="0"/><circle cx="610" cy="343" r="4" fill="#172033" stroke="#172033" stroke-width="0"/><circle cx="610" cy="357" r="4" fill="#172033" stroke="#172033" stroke-width="0"/><circle cx="643" cy="390" r="4" fill="#172033" stroke="#172033" stroke-width="0"/><circle cx="657" cy="390" r="4" fill="#172033" stroke="#172033" stroke-width="0"/><line x1="835" y1="350" x2="1020" y2="350" stroke="#172033" stroke-width="2.8"/><rect x="997.5" y="327.38" width="45.0" height="43.68000000000001" rx="0" fill="white" stroke="none" stroke-width="0"/><text x="1020" y="362.48" font-size="39" fill="#172033" text-anchor="middle">Cl</text><circle cx="1013" cy="310" r="4" fill="#172033" stroke="#172033" stroke-width="0"/><circle cx="1027" cy="310" r="4" fill="#172033" stroke="#172033" stroke-width="0"/><circle cx="1060" cy="343" r="4" fill="#172033" stroke="#172033" stroke-width="0"/><circle cx="1060" cy="357" r="4" fill="#172033" stroke="#172033" stroke-width="0"/><circle cx="1013" cy="390" r="4" fill="#172033" stroke="#172033" stroke-width="0"/><circle cx="1027" cy="390" r="4" fill="#172033" stroke="#172033" stroke-width="0"/><line x1="835" y1="350" x2="835" y2="535" stroke="#172033" stroke-width="2.8"/><rect x="812.5" y="512.38" width="45.0" height="43.68000000000001" rx="0" fill="white" stroke="none" stroke-width="0"/><text x="835" y="547.48" font-size="39" fill="#172033" text-anchor="middle">Cl</text><circle cx="828" cy="575" r="4" fill="#172033" stroke="#172033" stroke-width="0"/><circle cx="842" cy="575" r="4" fill="#172033" stroke="#172033" stroke-width="0"/><circle cx="795" cy="528" r="4" fill="#172033" stroke="#172033" stroke-width="0"/><circle cx="795" cy="542" r="4" fill="#172033" stroke="#172033" stroke-width="0"/><circle cx="875" cy="528" r="4" fill="#172033" stroke="#172033" stroke-width="0"/><circle cx="875" cy="542" r="4" fill="#172033" stroke="#172033" stroke-width="0"/><rect x="815.5" y="325.06" width="39.0" height="48.160000000000004" rx="0" fill="white" stroke="none" stroke-width="0"/><text x="835" y="363.76" font-size="43" fill="#172033" text-anchor="middle">C</text><text x="835" y="665" font-size="25" fill="#172033" text-anchor="middle">Completed Lewis structure</text></g></svg>
