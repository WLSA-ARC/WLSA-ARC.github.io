<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1317" viewBox="0 0 1100 1317"><title>Dispersionpolarizationstages</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="550" y="45" font-size="32" fill="#172033" text-anchor="middle" font-weight="700">London dispersion: instantaneous and induced dipoles</text><defs><linearGradient id="dipole"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#fb7185"/></linearGradient></defs><text x="320" y="75" font-size="29" fill="#172033" text-anchor="middle" font-weight="700">A: average distribution</text><circle cx="180" cy="180" r="75" fill="#f1f5f9" stroke="#172033" stroke-width="2"/><circle cx="180" cy="180" r="7" fill="#172033" stroke="#172033" stroke-width="0"/><text x="180" y="300" font-size="27" fill="#172033" text-anchor="middle">Atom X</text><circle cx="450" cy="180" r="75" fill="#f1f5f9" stroke="#172033" stroke-width="2"/><circle cx="450" cy="180" r="7" fill="#172033" stroke="#172033" stroke-width="0"/><text x="450" y="300" font-size="27" fill="#172033" text-anchor="middle">Atom Y</text><rect x="620" y="105" width="410" height="168.4" rx="8" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.6"/><text x="635" y="144" font-size="27" fill="#172033">Electron distribution is</text><text x="635" y="178.56" font-size="27" fill="#172033">symmetrical. Atoms X and Y</text><text x="635" y="213.12" font-size="27" fill="#172033">have no permanent dipole and</text><text x="635" y="247.68" font-size="27" fill="#172033">are nonpolar.</text><text x="320" y="475" font-size="29" fill="#172033" text-anchor="middle" font-weight="700">B: instantaneous dipole</text><circle cx="180" cy="580" r="75" fill="#f1f5f9" stroke="#172033" stroke-width="2"/><circle cx="180" cy="580" r="7" fill="#172033" stroke="#172033" stroke-width="0"/><text x="180" y="700" font-size="27" fill="#172033" text-anchor="middle">Atom X</text><circle cx="450" cy="580" r="75" fill="url(#dipole)" stroke="#172033" stroke-width="2"/><circle cx="450" cy="580" r="7" fill="#172033" stroke="#172033" stroke-width="0"/><text x="450" y="700" font-size="27" fill="#172033" text-anchor="middle">Atom Y</text><text x="405" y="590" font-size="29" fill="white" text-anchor="middle">δ⁻</text><text x="495" y="590" font-size="29" fill="white" text-anchor="middle">δ⁺</text><rect x="620" y="505" width="410" height="168.4" rx="8" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.6"/><text x="635" y="544" font-size="27" fill="#172033">Electrons momentarily</text><text x="635" y="578.56" font-size="27" fill="#172033">accumulate on one side of</text><text x="635" y="613.12" font-size="27" fill="#172033">atom Y, producing δ⁻ and δ⁺</text><text x="635" y="647.68" font-size="27" fill="#172033">ends.</text><text x="320" y="875" font-size="29" fill="#172033" text-anchor="middle" font-weight="700">C: induced dipole</text><circle cx="180" cy="980" r="75" fill="url(#dipole)" stroke="#172033" stroke-width="2"/><circle cx="180" cy="980" r="7" fill="#172033" stroke="#172033" stroke-width="0"/><text x="180" y="1100" font-size="27" fill="#172033" text-anchor="middle">Atom X</text><text x="135" y="990" font-size="29" fill="white" text-anchor="middle">δ⁻</text><text x="225" y="990" font-size="29" fill="white" text-anchor="middle">δ⁺</text><circle cx="450" cy="980" r="75" fill="url(#dipole)" stroke="#172033" stroke-width="2"/><circle cx="450" cy="980" r="7" fill="#172033" stroke="#172033" stroke-width="0"/><text x="450" y="1100" font-size="27" fill="#172033" text-anchor="middle">Atom Y</text><text x="405" y="990" font-size="29" fill="white" text-anchor="middle">δ⁻</text><text x="495" y="990" font-size="29" fill="white" text-anchor="middle">δ⁺</text><line x1="255" y1="980" x2="375" y2="980" stroke="#dc2626" stroke-width="3" stroke-dasharray="9 7"/><rect x="620" y="905" width="410" height="133.3" rx="8" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.6"/><text x="635" y="944" font-size="27" fill="#172033">The dipole in Y induces</text><text x="635" y="978.56" font-size="27" fill="#172033">polarization in X. Opposite</text><text x="635" y="1013.12" font-size="27" fill="#172033">nearby ends attract weakly.</text></g></svg>
