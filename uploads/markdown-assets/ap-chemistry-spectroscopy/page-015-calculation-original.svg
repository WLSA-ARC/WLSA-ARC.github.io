<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img"><title>Calculate the unknown concentration</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Microsoft YaHei,sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="550" y="42" font-size="31" fill="#172033" text-anchor="middle" font-weight="700">Calculate the unknown concentration</text><text x="550" y="105" font-size="31" fill="#172033" text-anchor="middle">c = (A + 0.02) / 60</text><text x="550" y="167" font-size="31" fill="#172033" text-anchor="middle">c = (0.275 + 0.02) / 60</text><text x="550" y="229" font-size="31" fill="#172033" text-anchor="middle">c = 4.92 × 10⁻³ M</text></g></svg>
