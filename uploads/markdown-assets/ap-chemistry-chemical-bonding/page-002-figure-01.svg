<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="589" viewBox="0 0 1100 589"><title>Electronegativity across a period</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="550" y="42" font-size="32" fill="#172033" text-anchor="middle" font-weight="700">Across a period</text><circle cx="210" cy="300" r="103" fill="#bae6fd" stroke="#172033" stroke-width="2"/><text x="210" y="311.9" font-size="35" fill="#172033" text-anchor="middle">Li</text><circle cx="515" cy="300" r="78" fill="#bae6fd" stroke="#172033" stroke-width="2"/><text x="515" y="311.9" font-size="35" fill="#172033" text-anchor="middle">Be</text><circle cx="835" cy="300" r="46" fill="#bae6fd" stroke="#172033" stroke-width="2"/><text x="835" y="311.9" font-size="35" fill="#172033" text-anchor="middle">F</text><line x1="160" y1="470" x2="935" y2="470" stroke="#059669" stroke-width="6"/><path d="M918 462.35 L935 470 L918 477.65" fill="none" stroke="#059669" stroke-width="6"/><text x="550" y="520" font-size="30" fill="#059669" text-anchor="middle">Electronegativity increases →</text><rect x="170" y="75" width="760" height="93.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="185" y="112" font-size="25" fill="#172033">Nuclear charge increases; atomic radius decreases; attraction</text><text x="185" y="144" font-size="25" fill="#172033">between nucleus and outer electrons increases.</text></g></svg>
