<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="682" viewBox="0 0 1100 682"><title>Electronegativity down a group</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><circle cx="170" cy="100" r="43" fill="#bae6fd" stroke="#172033" stroke-width="2"/><text x="170" y="111.9" font-size="35" fill="#172033" text-anchor="middle">Li</text><circle cx="170" cy="320" r="75" fill="#bae6fd" stroke="#172033" stroke-width="2"/><text x="170" y="331.9" font-size="35" fill="#172033" text-anchor="middle">Na</text><circle cx="170" cy="560" r="100" fill="#bae6fd" stroke="#172033" stroke-width="2"/><text x="170" y="571.9" font-size="35" fill="#172033" text-anchor="middle">K</text><line x1="420" y1="70" x2="420" y2="610" stroke="#059669" stroke-width="6"/><path d="M428.1 592 L420 610 L411.9 592" fill="none" stroke="#059669" stroke-width="6"/><text x="650" y="650" font-size="27" fill="#059669" text-anchor="middle">Electronegativity decreases down a group</text><rect x="550" y="130" width="490" height="197.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="565" y="168" font-size="26" fill="#172033">More electron shells</text><text x="565" y="201.28" font-size="26" fill="#172033">More shielding</text><text x="565" y="234.56" font-size="26" fill="#172033">Atomic radius increases</text><text x="565" y="267.84" font-size="26" fill="#172033">Increase in nuclear charge is negligible</text><text x="565" y="301.12" font-size="26" fill="#172033">Less attraction to bonding electrons</text></g></svg>
