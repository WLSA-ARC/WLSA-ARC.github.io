<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="637" viewBox="0 0 1100 637"><title>HF electron density and dipoles</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="550" y="45" font-size="32" fill="#172033" text-anchor="middle" font-weight="700">Hydrogen fluoride: unequal electron density</text><defs><linearGradient id="density"><stop stop-color="#bae6fd"/><stop offset="1" stop-color="#fb7185"/></linearGradient></defs><path d="M270 300 C270 225 360 230 430 205 C530 125 770 185 770 300 C770 425 580 425 430 360 C360 335 270 380 270 300" fill="url(#density)" stroke="#172033" stroke-width="2"/><rect x="334.5" y="273.9" width="41.0" height="50.400000000000006" rx="0" fill="white" stroke="none" stroke-width="0"/><text x="355" y="314.4" font-size="45" fill="#172033" text-anchor="middle">H</text><rect x="642.5" y="273.9" width="35.0" height="50.400000000000006" rx="0" fill="white" stroke="none" stroke-width="0"/><text x="660" y="314.4" font-size="45" fill="#172033" text-anchor="middle">F</text><line x1="400" y1="300" x2="610" y2="300" stroke="#172033" stroke-width="2.8"/><text x="350" y="200" font-size="36" fill="#2563eb" text-anchor="middle">δ⁺</text><text x="690" y="155" font-size="36" fill="#dc2626" text-anchor="middle">δ⁻</text><line x1="380" y1="485" x2="730" y2="485" stroke="#2563eb" stroke-width="5"/><path d="M714 477.8 L730 485 L714 492.2" fill="none" stroke="#2563eb" stroke-width="5"/><text x="550" y="522" font-size="27" fill="#172033" text-anchor="middle">Electrons shift toward fluorine</text><rect x="80" y="543" width="425" height="56.6" rx="8" fill="#bae6fd" stroke="#94a3b8" stroke-width="1.6"/><text x="95" y="577" font-size="22" fill="#172033">H: positive dipole; lower electron density.</text><rect x="585" y="543" width="425" height="85.2" rx="8" fill="#fecdd3" stroke="#94a3b8" stroke-width="1.6"/><text x="600" y="577" font-size="22" fill="#172033">F: negative dipole; higher electron</text><text x="600" y="605.16" font-size="22" fill="#172033">density.</text></g></svg>
