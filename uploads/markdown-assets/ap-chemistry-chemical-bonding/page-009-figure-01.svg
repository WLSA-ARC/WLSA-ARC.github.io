<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="498" viewBox="0 0 1100 498"><title>Na ion formation</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="550" y="45" font-size="32" fill="#172033" text-anchor="middle" font-weight="700">Ion formation: electron transfer</text><circle cx="240" cy="234.05999999999997" r="70" fill="#bae6fd" stroke="#172033" stroke-width="2"/><text x="240" y="249.36" font-size="45" fill="#172033" text-anchor="middle">Na</text><line x1="390" y1="234.06" x2="690" y2="234.06" stroke="#059669" stroke-width="5"/><path d="M672 225.96 L690 234.06 L672 242.16" fill="none" stroke="#059669" stroke-width="5"/><text x="835" y="254.06" font-size="54" fill="#2563eb" text-anchor="middle">[Na]⁺</text><circle cx="310" cy="164.05999999999997" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="0"/><text x="550" y="189.06" font-size="30" fill="#172033" text-anchor="middle">loss of 1 e⁻</text><rect x="100" y="368.0" width="900" height="95.60000000000001" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="115" y="406" font-size="26" fill="#172033">Group 1 metal: 1 outer electron. Loss of that electron gives a positively</text><text x="115" y="439.28" font-size="26" fill="#172033">charged sodium cation.</text></g></svg>
