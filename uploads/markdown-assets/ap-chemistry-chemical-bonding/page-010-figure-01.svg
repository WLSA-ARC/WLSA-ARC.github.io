<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="783" viewBox="0 0 1100 783"><title>NaCl ionic bond</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="550" y="45" font-size="33" fill="#172033" text-anchor="middle" font-weight="700">Ionic bonding: sodium chloride</text><rect x="160.5" y="248.1" width="79.0" height="61.60000000000001" rx="0" fill="white" stroke="none" stroke-width="0"/><text x="200" y="297.6" font-size="55" fill="#2563eb" text-anchor="middle">Na</text><circle cx="260" cy="230" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="0"/><rect x="450.0" y="248.1" width="60.0" height="61.60000000000001" rx="0" fill="white" stroke="none" stroke-width="0"/><text x="480" y="297.6" font-size="55" fill="#dc2626" text-anchor="middle">Cl</text><line x1="553" y1="273" x2="567" y2="287" stroke="#dc2626" stroke-width="2.8"/><line x1="553" y1="287" x2="567" y2="273" stroke="#dc2626" stroke-width="2.8"/><line x1="529.569" y1="329.569" x2="543.569" y2="343.569" stroke="#dc2626" stroke-width="2.8"/><line x1="529.569" y1="343.569" x2="543.569" y2="329.569" stroke="#dc2626" stroke-width="2.8"/><line x1="473" y1="353" x2="487" y2="367" stroke="#dc2626" stroke-width="2.8"/><line x1="473" y1="367" x2="487" y2="353" stroke="#dc2626" stroke-width="2.8"/><line x1="416.431" y1="329.569" x2="430.431" y2="343.569" stroke="#dc2626" stroke-width="2.8"/><line x1="416.431" y1="343.569" x2="430.431" y2="329.569" stroke="#dc2626" stroke-width="2.8"/><line x1="393" y1="273" x2="407" y2="287" stroke="#dc2626" stroke-width="2.8"/><line x1="393" y1="287" x2="407" y2="273" stroke="#dc2626" stroke-width="2.8"/><line x1="416.431" y1="216.431" x2="430.431" y2="230.431" stroke="#dc2626" stroke-width="2.8"/><line x1="416.431" y1="230.431" x2="430.431" y2="216.431" stroke="#dc2626" stroke-width="2.8"/><line x1="473" y1="193" x2="487" y2="207" stroke="#dc2626" stroke-width="2.8"/><line x1="473" y1="207" x2="487" y2="193" stroke="#dc2626" stroke-width="2.8"/><line x1="270" y1="210" x2="400" y2="210" stroke="#2563eb" stroke-width="3"/><path d="M388 204.6 L400 210 L388 215.4" fill="none" stroke="#2563eb" stroke-width="3"/><text x="330" y="175" font-size="26" fill="#2563eb" text-anchor="middle">1 e⁻</text><line x1="590" y1="280" x2="665" y2="280" stroke="#059669" stroke-width="4"/><path d="M650 273.25 L665 280 L650 286.75" fill="none" stroke="#059669" stroke-width="4"/><text x="795" y="280" font-size="45" fill="#172033" text-anchor="middle">[Na]⁺  [Cl]⁻</text><text x="875" y="330" font-size="22" fill="#2563eb" text-anchor="middle">Cl⁻: 8 outer electrons</text><line x1="715" y1="375" x2="790" y2="375" stroke="#dc2626" stroke-width="3"/><path d="M777 369.15 L790 375 L777 380.85" fill="none" stroke="#dc2626" stroke-width="3"/><line x1="910" y1="375" x2="835" y2="375" stroke="#dc2626" stroke-width="3"/><path d="M848 380.85 L835 375 L848 369.15" fill="none" stroke="#dc2626" stroke-width="3"/><text x="810" y="420" font-size="23" fill="#dc2626" text-anchor="middle">Electrostatic attraction</text><rect x="90" y="490" width="920" height="137.2" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="105" y="530" font-size="28" fill="#172033">Na (group 1) loses its one outer electron and becomes positive. Cl</text><text x="105" y="565.84" font-size="28" fill="#172033">(group 17) gains that electron and becomes negative. Oppositely</text><text x="105" y="601.68" font-size="28" fill="#172033">charged ions attract.</text></g></svg>
