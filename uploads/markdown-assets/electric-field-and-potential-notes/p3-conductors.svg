<svg xmlns="http://www.w3.org/2000/svg" width="950" height="430" viewBox="0 0 950 430" role="img"><title>Three conductor electrostatics sketches: E=0 inside charged shape,two connected spheres Q/R=q/r,and irregular conductor with more charge near sharp tip.</title><rect width="100%" height="100%" fill="white"/><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve">Conductors in electrostatic equilibrium</text><path d="M40 120 Q5 55 90 65 Q120 25 170 75 Q260 45 260 120 Q290 205 205 205 Q155 240 105 200 Q35 225 40 120Z" stroke="#147fa5" stroke-width="3" fill="#f4f7fb"/><text x="130" y="145" font-family="Arial,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#263445" text-anchor="middle" xml:space="preserve">E = 0</text><text x="45" y="95" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve">−</text><text x="105" y="65" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve">−</text><text x="195" y="75" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve">−</text><text x="245" y="150" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve">−</text><text x="150" y="215" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve">−</text><text x="65" y="195" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve">−</text><circle cx="430" cy="155" r="65" fill="#eff4f7" stroke="#147fa5" stroke-width="2"/><circle cx="650" cy="155" r="35" fill="#eff4f7" stroke="#147fa5" stroke-width="2"/><path d="M495 155L615 155" fill="none" stroke="#147fa5" stroke-width="5"/><text x="430" y="250" font-family="Arial,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#263445" text-anchor="middle" xml:space="preserve">Q, R</text><text x="650" y="250" font-family="Arial,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#263445" text-anchor="middle" xml:space="preserve">q, r</text><text x="540" y="325" font-family="Arial,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#263445" text-anchor="middle" xml:space="preserve">Q/R = q/r</text><text x="485" y="365" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#263445" text-anchor="middle" xml:space="preserve">Connected conducting spheres</text><path d="M770 155 Q750 40 825 65 Q855 85 910 95 Q950 110 910 130 Q865 145 840 205 Q790 240 770 155Z" stroke="#147fa5" stroke-width="3" fill="#f4f7fb"/><text x="906" y="100" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve">−</text><text x="916" y="117" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve">−</text><text x="902" y="136" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve">−</text><text x="785" y="155" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve">−</text><text x="810" y="75" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve">−</text><text x="760" y="290" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">More charge near</text><text x="760" y="321" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">the sharper tip.</text></svg>
