<svg xmlns="http://www.w3.org/2000/svg" width="1058" height="1430" viewBox="0 0 1058 1430" role="img"><title>Anatomy source note 1</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1058" height="1430" fill="#fff"/><g id="heading-0" data-role="heading-0"><text xml:space="preserve" x="37.030" y="60.270" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23.240" font-weight="700" fill="#123b51" text-anchor="start">Unit 2 — Muscle PPT P1–18</text></g><g id="heading-1" data-role="heading-1"><text xml:space="preserve" x="37.030" y="99.512" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23.240" font-weight="700" fill="#123b51" text-anchor="start">9.1 Type of muscles</text></g><g id="bullet-2" data-role="bullet-2"><circle cx="40.69942857142858" cy="128.7657142857144" r="2.6501428571428605" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="57.416" y="135.901" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">Skeletal：负责 locomotion, respiratory movements, facial expressions（由 nervous system</text><text xml:space="preserve" x="57.416" y="161.383" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">控制），voluntary。</text></g><g id="bullet-3" data-role="bullet-3"><circle cx="40.69942857142858" cy="184.82642857142878" r="2.6501428571428605" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="57.416" y="191.961" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">Smooth：walls of hollow organs, blood vessels, eye, skin。功能：propel urine, mix food,</text><text xml:space="preserve" x="57.416" y="217.444" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">regulate blood flow。（involuntary）不能控制。</text></g><g id="bullet-4" data-role="bullet-4"><circle cx="40.69942857142858" cy="240.88714285714315" r="2.6501428571428605" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="57.416" y="248.022" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">Cardiac：main source of movement of blood（involuntary）。</text></g><g id="text-5" data-role="text-5"><text xml:space="preserve" x="37.030" y="278.601" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">Functions：</text></g><g id="text-6" data-role="text-6"><text xml:space="preserve" x="37.030" y="309.179" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">1. Movement of body</text></g><g id="text-7" data-role="text-7"><text xml:space="preserve" x="37.030" y="339.758" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">2. Maintenance of posture</text></g><g id="text-8" data-role="text-8"><text xml:space="preserve" x="37.030" y="370.336" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">3. Respiration</text></g><g id="text-9" data-role="text-9"><text xml:space="preserve" x="37.030" y="400.915" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">4. Production of body heat</text></g><g id="text-10" data-role="text-10"><text xml:space="preserve" x="37.030" y="431.494" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">5. Communication</text></g><g id="text-11" data-role="text-11"><text xml:space="preserve" x="37.030" y="462.072" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">6. Constriction of organs and vessels</text></g><g id="text-12" data-role="text-12"><text xml:space="preserve" x="37.030" y="492.651" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">7. Contraction of Heat</text></g><g id="table-13" data-role="table-13"><rect x="37.03" y="502.844" width="245.985" height="40.771" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="45.184" y="525.676" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.755" font-weight="700" fill="#fff" text-anchor="start"></text><rect x="283.015" y="502.844" width="245.985" height="40.771" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="291.169" y="525.676" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.755" font-weight="700" fill="#fff" text-anchor="start">骨骼</text><rect x="529.0" y="502.844" width="245.985" height="40.771" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="537.154" y="525.676" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.755" font-weight="700" fill="#fff" text-anchor="start">平滑</text><rect x="774.985" y="502.844" width="245.985" height="40.771" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="783.139" y="525.676" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.755" font-weight="700" fill="#fff" text-anchor="start">心</text><rect x="37.03" y="543.615" width="245.985" height="40.771" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="45.184" y="566.447" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.755" font-weight="400" fill="#163142" text-anchor="start">Cell shape</text><rect x="283.015" y="543.615" width="245.985" height="40.771" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="291.169" y="566.447" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.755" font-weight="400" fill="#163142" text-anchor="start">cylindrical + long</text><rect x="529.0" y="543.615" width="245.985" height="40.771" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="537.154" y="566.447" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.755" font-weight="400" fill="#163142" text-anchor="start">spindle-shaped</text><rect x="774.985" y="543.615" width="245.985" height="40.771" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="783.139" y="566.447" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.755" font-weight="400" fill="#163142" text-anchor="start">cylindrical + branched</text><rect x="37.03" y="584.386" width="245.985" height="40.771" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="45.184" y="607.218" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.755" font-weight="400" fill="#163142" text-anchor="start">Nucleus</text><rect x="283.015" y="584.386" width="245.985" height="40.771" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="291.169" y="607.218" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.755" font-weight="400" fill="#163142" text-anchor="start">Multi + peripherally</text><rect x="529.0" y="584.386" width="245.985" height="40.771" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="537.154" y="607.218" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.755" font-weight="400" fill="#163142" text-anchor="start">Sin + central</text><rect x="774.985" y="584.386" width="245.985" height="40.771" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="783.139" y="607.218" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.755" font-weight="400" fill="#163142" text-anchor="start">Sin + central</text><rect x="37.03" y="625.158" width="245.985" height="40.771" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="45.184" y="647.990" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.755" font-weight="400" fill="#163142" text-anchor="start">Special Attachment</text><rect x="283.015" y="625.158" width="245.985" height="40.771" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="291.169" y="647.990" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.755" font-weight="400" fill="#163142" text-anchor="start">×</text><rect x="529.0" y="625.158" width="245.985" height="40.771" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="537.154" y="647.990" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.755" font-weight="400" fill="#163142" text-anchor="start">Gap Junctions</text><rect x="774.985" y="625.158" width="245.985" height="40.771" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="783.139" y="647.990" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.755" font-weight="400" fill="#163142" text-anchor="start">Intercalated disks</text><rect x="37.03" y="665.929" width="245.985" height="40.771" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="45.184" y="688.761" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.755" font-weight="400" fill="#163142" text-anchor="start">Striation</text><rect x="283.015" y="665.929" width="245.985" height="40.771" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="291.169" y="688.761" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.755" font-weight="400" fill="#163142" text-anchor="start">✓</text><rect x="529.0" y="665.929" width="245.985" height="40.771" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="537.154" y="688.761" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.755" font-weight="400" fill="#163142" text-anchor="start">×</text><rect x="774.985" y="665.929" width="245.985" height="40.771" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="783.139" y="688.761" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.755" font-weight="400" fill="#163142" text-anchor="start">✓</text></g><g id="heading-14" data-role="heading-14"><text xml:space="preserve" x="37.030" y="742.172" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23.240" font-weight="700" fill="#123b51" text-anchor="start">9.2 Properties</text></g><g id="text-15" data-role="text-15"><text xml:space="preserve" x="37.030" y="778.560" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">1. Contractility</text></g><g id="text-16" data-role="text-16"><text xml:space="preserve" x="37.030" y="809.139" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">2. Excitability</text></g><g id="text-17" data-role="text-17"><text xml:space="preserve" x="37.030" y="839.718" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">3. Extensibility</text></g><g id="text-18" data-role="text-18"><text xml:space="preserve" x="37.030" y="870.296" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">4. Elasticity</text></g><g id="heading-19" data-role="heading-19"><text xml:space="preserve" x="37.030" y="903.729" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23.240" font-weight="700" fill="#123b51" text-anchor="start">9.3 Connective Tissue</text></g><g id="bullet-20" data-role="bullet-20"><circle cx="40.69942857142858" cy="932.9821428571439" r="2.6501428571428605" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="57.416" y="940.117" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">Epimysium：CT the surrounds the whole muscle (many fascicles) 肌束。</text></g><g id="bullet-21" data-role="bullet-21"><circle cx="40.69942857142858" cy="963.5607142857153" r="2.6501428571428605" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="57.416" y="970.696" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">Perimysium：loose CT that surrounds every fascicles；passage for blood vessels and</text><text xml:space="preserve" x="57.416" y="996.178" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">nerves。</text></g><g id="bullet-22" data-role="bullet-22"><circle cx="40.69942857142858" cy="1019.6214285714296" r="2.6501428571428605" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="57.416" y="1026.756" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">Endomysium：loose CT separate individual muscle fibers within each fascicle。</text></g><g id="bullet-23" data-role="bullet-23"><circle cx="40.69942857142858" cy="1050.2000000000012" r="2.6501428571428605" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="57.416" y="1057.335" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">CT 上的 collagen → tendons / aponeuroses（attach to bone）。</text></g><g id="bullet-24" data-role="bullet-24"><circle cx="40.69942857142858" cy="1080.7785714285726" r="2.6501428571428605" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="57.416" y="1087.914" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">motor neuron 控制 1 对多。</text></g><g id="bullet-25" data-role="bullet-25"><circle cx="40.69942857142858" cy="1111.357142857144" r="2.6501428571428605" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="57.416" y="1118.492" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">一条动脉（artery）+ 一到两条静脉（vein），with capillary beds。</text></g><g id="bullet-26" data-role="bullet-26"><circle cx="40.69942857142858" cy="1141.9357142857154" r="2.6501428571428605" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="57.416" y="1149.071" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">skeletal muscle 由 myoblast 发育而来 → multinucleated。</text></g><g id="bullet-27" data-role="bullet-27"><circle cx="40.69942857142858" cy="1172.5142857142869" r="2.6501428571428605" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="57.416" y="1179.649" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">肌肉变大 → hypertrophy。</text></g><g id="text-28" data-role="text-28"><text xml:space="preserve" x="37.030" y="1210.228" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">电信号传导（都在 muscle fiber 上）：</text></g><g id="bullet-29" data-role="bullet-29"><circle cx="40.69942857142858" cy="1233.6714285714297" r="2.6501428571428605" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="57.416" y="1240.806" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">Sarcolemma：(membrane) 包围 sarcoplasm。</text></g><g id="bullet-30" data-role="bullet-30"><circle cx="40.69942857142858" cy="1264.2500000000011" r="2.6501428571428605" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="57.416" y="1271.385" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">T Tubules：凹陷结构。</text></g><g id="bullet-31" data-role="bullet-31"><circle cx="40.69942857142858" cy="1294.8285714285726" r="2.6501428571428605" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="57.416" y="1301.964" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">Sarcoplasmic reticulum：stores calcium。</text></g><g id="bullet-32" data-role="bullet-32"><circle cx="40.69942857142858" cy="1325.407142857144" r="2.6501428571428605" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="57.416" y="1332.542" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">Terminal cisternae：SR 和 TT 交界处。</text></g><g id="bullet-33" data-role="bullet-33"><circle cx="40.69942857142858" cy="1355.9857142857154" r="2.6501428571428605" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="57.416" y="1363.121" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.386" font-weight="400" fill="#123b51" text-anchor="start">Triad：1 个 TT + 2 TS。</text></g></svg>