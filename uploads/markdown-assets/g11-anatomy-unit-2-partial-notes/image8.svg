<svg xmlns="http://www.w3.org/2000/svg" width="894" height="1216" viewBox="0 0 894 1216" role="img"><title>Anatomy source note 8 with source graph</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="894" height="1216" fill="#fff"/><svg xmlns="http://www.w3.org/2000/svg" width="894" height="876" viewBox="0 0 894 876" role="img"><title>Anatomy source note 8</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="894" height="876" fill="#fff"/><g id="text-0" data-role="text-0"><text xml:space="preserve" x="30.660" y="55.989" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.329" font-weight="400" fill="#123b51" text-anchor="start">Latch state 锁止状态（考）：当 cross-bridge 存在，但 myosin</text><text xml:space="preserve" x="30.660" y="87.649" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.329" font-weight="400" fill="#123b51" text-anchor="start">上的 phosphate 被移除后 → cross bridge release</text><text xml:space="preserve" x="30.660" y="119.310" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.329" font-weight="400" fill="#123b51" text-anchor="start">slowly。所以长时间维持 tension 并少量消耗 ATP。</text></g><g id="heading-1" data-role="heading-1"><text xml:space="preserve" x="30.660" y="160.849" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.875" font-weight="700" fill="#123b51" text-anchor="start">三、Type of Smooth Muscle</text></g><g id="bullet-2" data-role="bullet-2"><circle cx="35.219142857142856" cy="197.19535714285703" r="3.2927142857142835" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="55.989" y="206.060" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.329" font-weight="400" fill="#123b51" text-anchor="start">Visceral：cells in sheet，function as a unit，autorhythmic</text><text xml:space="preserve" x="55.989" y="237.721" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.329" font-weight="400" fill="#123b51" text-anchor="start">自律性。</text></g><g id="bullet-3" data-role="bullet-3"><circle cx="35.219142857142856" cy="266.8489285714284" r="3.2927142857142835" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="55.989" y="275.714" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.329" font-weight="400" fill="#123b51" text-anchor="start">Multiunit：act as independent unit，fewer gap junctions。</text></g><g id="heading-4" data-role="heading-4"><text xml:space="preserve" x="30.660" y="317.253" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.875" font-weight="700" fill="#123b51" text-anchor="start">四、Electrical Properties</text></g><g id="bullet-5" data-role="bullet-5"><circle cx="35.219142857142856" cy="353.59928571428554" r="3.2927142857142835" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="55.989" y="362.464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.329" font-weight="400" fill="#123b51" text-anchor="start">−60 mV 左右的 resting stage。</text></g><g id="bullet-6" data-role="bullet-6"><circle cx="35.219142857142856" cy="391.5921428571427" r="3.2927142857142835" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="55.989" y="400.457" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.329" font-weight="400" fill="#123b51" text-anchor="start">depolarization 由 Na⁺ 和 Ca²⁺ 内流产生。</text></g><g id="bullet-7" data-role="bullet-7"><circle cx="35.219142857142856" cy="429.5849999999998" r="3.2927142857142835" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="55.989" y="438.450" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.329" font-weight="400" fill="#123b51" text-anchor="start">存在 pacemaker cells → 自主产生 action potential。</text></g><g id="bullet-8" data-role="bullet-8"><circle cx="35.219142857142856" cy="467.57785714285694" r="3.2927142857142835" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="55.989" y="476.443" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.329" font-weight="400" fill="#123b51" text-anchor="start">存在平台期 plateau。</text></g><g id="heading-9" data-role="heading-9"><text xml:space="preserve" x="30.660" y="517.982" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.875" font-weight="700" fill="#123b51" text-anchor="start">五、Functional Properties</text></g><g id="text-10" data-role="text-10"><text xml:space="preserve" x="30.660" y="563.193" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.329" font-weight="400" fill="#123b51" text-anchor="start">有 autorhythmic 自动收缩；sudden stretch 会触发</text><text xml:space="preserve" x="30.660" y="594.854" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.329" font-weight="400" fill="#123b51" text-anchor="start">contraction，但缓慢拉长不会。</text></g><g id="text-11" data-role="text-11"><text xml:space="preserve" x="30.660" y="632.847" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.329" font-weight="400" fill="#123b51" text-anchor="start">属于 involuntary，无法自主控制的：</text></g><g id="bullet-12" data-role="bullet-12"><circle cx="35.219142857142856" cy="661.9746428571425" r="3.2927142857142835" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="55.989" y="670.840" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.329" font-weight="400" fill="#123b51" text-anchor="start">Neurotransmitter：Acetylcholine，norepinephrine。</text></g><g id="bullet-13" data-role="bullet-13"><circle cx="35.219142857142856" cy="699.9674999999996" r="3.2927142857142835" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="55.989" y="708.832" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.329" font-weight="400" fill="#123b51" text-anchor="start">Hormone：epinephrine，oxytocin。</text></g><g id="heading-14" data-role="heading-14"><text xml:space="preserve" x="30.660" y="750.371" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.875" font-weight="700" fill="#123b51" text-anchor="start">9.9 Cardiac Muscle — PPT P83–86</text></g><g id="text-15" data-role="text-15"><text xml:space="preserve" x="30.660" y="795.583" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.329" font-weight="400" fill="#123b51" text-anchor="start">Striated and branched，single nucleus，有 intercalated disks</text><text xml:space="preserve" x="30.660" y="827.244" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.329" font-weight="400" fill="#123b51" text-anchor="start">和 gap junctions 联接，有 autorhythmic cells。</text></g></svg><g transform="translate(0 887.68) scale(0.894 1.0538666666666667)"><text xml:space="preserve" x="35.000" y="30.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.000" font-weight="700" fill="#173c52" text-anchor="start">Smooth muscle: plateau phase (source sketch)</text><line x1="150" y1="240" x2="850" y2="240" stroke="#28546c" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="240" x2="150" y2="60" stroke="#28546c" stroke-width="2" marker-end="url(#arrow)"/><path d="M160 220H350L390 90Q430 70 485 90L535 220H820" fill="none" stroke="#3c708b" stroke-width="4"/><text xml:space="preserve" x="390.000" y="55.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.000" font-weight="400" fill="#173c52" text-anchor="start">plateau</text></g></svg>