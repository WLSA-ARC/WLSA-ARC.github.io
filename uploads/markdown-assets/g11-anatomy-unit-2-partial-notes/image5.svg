<svg xmlns="http://www.w3.org/2000/svg" width="898" height="1250" viewBox="0 0 898 1250" role="img"><title>Anatomy source note 5 with source graph</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="898" height="1250" fill="#fff"/><svg xmlns="http://www.w3.org/2000/svg" width="898" height="900" viewBox="0 0 898 900" role="img"><title>Anatomy source note 5</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="898" height="900" fill="#fff"/><g id="heading-0" data-role="heading-0"><text xml:space="preserve" x="31.430" y="45.419" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13.989" font-weight="700" fill="#123b51" text-anchor="start">9.5 Whole skeletal muscle Physiology — PPT P49–62</text></g><g id="heading-1" data-role="heading-1"><text xml:space="preserve" x="31.430" y="69.042" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13.989" font-weight="700" fill="#123b51" text-anchor="start">一、Muscle Twitch 肌肉单收缩</text></g><g id="text-2" data-role="text-2"><text xml:space="preserve" x="31.430" y="90.946" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">肌肉纤维对于一个 single action potential 的反应。</text></g><g id="text-3" data-role="text-3"><text xml:space="preserve" x="31.430" y="109.354" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">3 个不同 phases：</text></g><g id="text-4" data-role="text-4"><text xml:space="preserve" x="31.430" y="127.761" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">1. Lag / Latent：stimulus 至 contraction 的开始，no mechanical contraction。</text></g><g id="text-5" data-role="text-5"><text xml:space="preserve" x="31.430" y="146.168" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">2. Contraction：Ca^2+ released，cross bridge 产生，tension increase。</text></g><g id="text-6" data-role="text-6"><text xml:space="preserve" x="31.430" y="164.575" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">3. Relaxation：Ca^2+ 回收至 SR，纤维长度恢复，tension decrease。</text></g><g id="heading-7" data-role="heading-7"><text xml:space="preserve" x="31.430" y="184.700" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13.989" font-weight="700" fill="#123b51" text-anchor="start">二、Muscle Contraction 类型</text></g><g id="bullet-8" data-role="bullet-8"><circle cx="33.638857142857134" cy="202.3096428571422" r="1.595285714285708" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="43.701" y="206.605" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">Isometric：no change in length，tension increase。</text></g><g id="bullet-9" data-role="bullet-9"><circle cx="33.638857142857134" cy="220.71678571428498" r="1.595285714285708" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="43.701" y="225.012" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">Isotonic：change in length，tension constant。</text></g><g id="heading-10" data-role="heading-10"><text xml:space="preserve" x="31.430" y="245.137" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13.989" font-weight="700" fill="#123b51" text-anchor="start">三、Motor Units</text></g><g id="text-11" data-role="text-11"><text xml:space="preserve" x="31.430" y="267.041" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">一单一的 motor neuron，以及其控制的所有 muscle fibers。</text></g><g id="text-12" data-role="text-12"><text xml:space="preserve" x="31.430" y="285.449" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">一个 action potential → 所有 muscle fiber 产生 contract。</text></g><g id="bullet-13" data-role="bullet-13"><circle cx="33.638857142857134" cy="299.56071428571323" r="1.595285714285708" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="43.701" y="303.856" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">大肌肉：motor units 中含有的 muscle fiber 多。</text></g><g id="bullet-14" data-role="bullet-14"><circle cx="33.638857142857134" cy="317.967857142856" r="1.595285714285708" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="43.701" y="322.263" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">小肌肉：motor units 中含有的 muscle fiber 少 → delicate movements，ex：手指、眼睛。</text></g><g id="heading-15" data-role="heading-15"><text xml:space="preserve" x="31.430" y="342.388" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13.989" font-weight="700" fill="#123b51" text-anchor="start">四、单个 Muscle Fiber 的收缩</text></g><g id="text-16" data-role="text-16"><text xml:space="preserve" x="31.430" y="364.292" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">respond in graded fashion，通过 add more cross-bridge 可以产生更大的力。</text></g><g id="text-17" data-role="text-17"><text xml:space="preserve" x="31.430" y="382.700" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">Factors：</text></g><g id="bullet-18" data-role="bullet-18"><circle cx="33.638857142857134" cy="396.81178571428427" r="1.595285714285708" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="43.701" y="401.107" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">Frequency of stimulation</text></g><g id="bullet-19" data-role="bullet-19"><circle cx="33.638857142857134" cy="415.21892857142706" r="1.595285714285708" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="43.701" y="419.514" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">Muscle Fiber 的直径</text></g><g id="bullet-20" data-role="bullet-20"><circle cx="33.638857142857134" cy="433.62607142856984" r="1.595285714285708" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="43.701" y="437.921" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">收缩时 Muscle Fiber 的长度</text></g><g id="text-21" data-role="text-21"><text xml:space="preserve" x="31.430" y="456.328" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">Frequency of stimulation：</text></g><g id="bullet-22" data-role="bullet-22"><circle cx="33.638857142857134" cy="470.4403571428554" r="1.595285714285708" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="43.701" y="474.735" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">Treppe：随着持续刺激，收缩力量会渐渐增加。</text></g><g id="bullet-23" data-role="bullet-23"><circle cx="33.638857142857134" cy="488.8474999999982" r="1.595285714285708" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="43.701" y="493.142" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">机制：第一次 stimulation 释放的 Ca^2+ 在第二次 stimulation 前，没有被 SR 全部回收 → Ca^2+ 浓度逐渐提升，ex：热身活动。</text></g><g id="bullet-24" data-role="bullet-24"><circle cx="33.638857142857134" cy="507.254642857141" r="1.595285714285708" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="43.701" y="511.550" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">几次收缩后趋于一致（张力）。</text></g><g id="bullet-25" data-role="bullet-25"><circle cx="33.638857142857134" cy="525.6617857142837" r="1.595285714285708" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="43.701" y="529.957" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">当 action potential 频率超过 Treppe 阶段：</text></g><g id="bullet-26" data-role="bullet-26"><circle cx="33.638857142857134" cy="544.0689285714265" r="1.595285714285708" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="43.701" y="548.364" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">Wave summation：张力 ↑。</text></g><g id="bullet-27" data-role="bullet-27"><circle cx="33.638857142857134" cy="562.4760714285692" r="1.595285714285708" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="43.701" y="566.771" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">Incomplete tetanus：两次 contraction 间放松。</text></g><g id="bullet-28" data-role="bullet-28"><circle cx="33.638857142857134" cy="580.8832142857119" r="1.595285714285708" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="43.701" y="585.178" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">Complete tetanus：没有放松，持续收缩。</text></g><g id="bullet-29" data-role="bullet-29"><circle cx="33.638857142857134" cy="599.2903571428546" r="1.595285714285708" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="43.701" y="603.585" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">产生原因：mechanical events of muscle twitches 比 electrical events 持续时间更长 → Ca^2+ 无法被及时回收。</text></g><g id="text-30" data-role="text-30"><text xml:space="preserve" x="31.430" y="621.992" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">直径越大，收缩力越大。</text></g><g id="text-31" data-role="text-31"><text xml:space="preserve" x="31.430" y="640.400" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">Muscle length and tension：</text></g><g id="text-32" data-role="text-32"><text xml:space="preserve" x="31.430" y="658.807" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">3 种张力：</text></g><g id="bullet-33" data-role="bullet-33"><circle cx="33.638857142857134" cy="672.9189285714256" r="1.595285714285708" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="43.701" y="677.214" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">Active tension：主动收缩产生的力。</text></g><g id="bullet-34" data-role="bullet-34"><circle cx="33.638857142857134" cy="691.3260714285683" r="1.595285714285708" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="43.701" y="695.621" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">Passive tension：被拉长时产生的“回弹阻力”。</text></g><g id="bullet-35" data-role="bullet-35"><circle cx="33.638857142857134" cy="709.733214285711" r="1.595285714285708" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="43.701" y="714.028" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">Total tension：两者之和。</text></g><g id="text-36" data-role="text-36"><text xml:space="preserve" x="31.430" y="732.435" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">力量 ↑ 是因为：Muscle Fiber 越大 → 更多 myofibrils → 更多 cross-bridges。</text></g><g id="text-37" data-role="text-37"><text xml:space="preserve" x="31.430" y="750.842" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">Length and tension 图：</text></g><g id="bullet-38" data-role="bullet-38"><circle cx="33.638857142857134" cy="764.9546428571392" r="1.595285714285708" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="43.701" y="769.250" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">纵轴 Tension，刻度 50、100；横轴 Sarcomere length，标示 60、80、100、140。</text></g><g id="bullet-39" data-role="bullet-39"><circle cx="33.638857142857134" cy="783.361785714282" r="1.595285714285708" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="43.701" y="787.657" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">① 完全不拉伸（被动拉伸）小。</text></g><g id="bullet-40" data-role="bullet-40"><circle cx="33.638857142857134" cy="801.7689285714247" r="1.595285714285708" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="43.701" y="806.064" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">② 处于 Optimal Sarcomere length，最大 cross-bridges 接触。</text></g><g id="bullet-41" data-role="bullet-41"><circle cx="33.638857142857134" cy="820.1760714285674" r="1.595285714285708" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="43.701" y="824.471" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">③ 过长：（被动张力 ↑，主动张力 ↓）。</text></g><g id="bullet-42" data-role="bullet-42"><circle cx="33.638857142857134" cy="838.5832142857101" r="1.595285714285708" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="43.701" y="842.878" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.271" font-weight="400" fill="#123b51" text-anchor="start">tension 随 sarcomere 长度的变长而相应的变大或变小。</text></g></svg><g transform="translate(0 912.5) scale(0.898 1.0833333333333333)"><text xml:space="preserve" x="35.000" y="30.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.000" font-weight="700" fill="#173c52" text-anchor="start">Length–tension relationship</text><line x1="95" y1="240" x2="900" y2="240" stroke="#28546c" stroke-width="2" marker-end="url(#arrow)"/><line x1="95" y1="240" x2="95" y2="55" stroke="#28546c" stroke-width="2" marker-end="url(#arrow)"/><text xml:space="preserve" x="15.000" y="60.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.000" font-weight="400" fill="#173c52" text-anchor="start">Tension</text><text xml:space="preserve" x="730.000" y="290.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.000" font-weight="400" fill="#173c52" text-anchor="start">Sarcomere length</text><line x1="160" y1="240" x2="160" y2="248" stroke="#28546c" stroke-width="2"/><text xml:space="preserve" x="160.000" y="275.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.000" font-weight="400" fill="#132e40" text-anchor="middle">60</text><line x1="340" y1="240" x2="340" y2="248" stroke="#28546c" stroke-width="2"/><text xml:space="preserve" x="340.000" y="275.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.000" font-weight="400" fill="#132e40" text-anchor="middle">80</text><line x1="520" y1="240" x2="520" y2="248" stroke="#28546c" stroke-width="2"/><text xml:space="preserve" x="520.000" y="275.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.000" font-weight="400" fill="#132e40" text-anchor="middle">100</text><line x1="810" y1="240" x2="810" y2="248" stroke="#28546c" stroke-width="2"/><text xml:space="preserve" x="810.000" y="275.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.000" font-weight="400" fill="#132e40" text-anchor="middle">140</text><line x1="90" y1="150" x2="810" y2="150" stroke="#ced9df" stroke-width="1"/><text xml:space="preserve" x="80.000" y="156.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.000" font-weight="400" fill="#132e40" text-anchor="end">50</text><line x1="90" y1="65" x2="810" y2="65" stroke="#ced9df" stroke-width="1"/><text xml:space="preserve" x="80.000" y="71.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.000" font-weight="400" fill="#132e40" text-anchor="end">100</text><path d="M120 240Q240 40 430 65Q585 55 810 240" fill="none" stroke="#3c708b" stroke-width="4"/><text xml:space="preserve" x="200.000" y="117.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.000" font-weight="400" fill="#132e40" text-anchor="start">①</text><text xml:space="preserve" x="410.000" y="52.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.000" font-weight="400" fill="#132e40" text-anchor="start">②</text><text xml:space="preserve" x="670.000" y="132.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.000" font-weight="400" fill="#132e40" text-anchor="start">③</text></g></svg>