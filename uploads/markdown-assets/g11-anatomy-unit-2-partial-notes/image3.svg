<svg xmlns="http://www.w3.org/2000/svg" width="1064" height="1458" viewBox="0 0 1064 1458" role="img"><title>Anatomy source note 3</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1064" height="1458" fill="#fff"/><g id="heading-0" data-role="heading-0"><text xml:space="preserve" x="37.240" y="66.538" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.298" font-weight="700" fill="#123b51" text-anchor="start">PPT P19–25</text></g><g id="heading-1" data-role="heading-1"><text xml:space="preserve" x="37.240" y="116.011" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.298" font-weight="700" fill="#123b51" text-anchor="start">① Actin Myofilament</text></g><g id="bullet-2" data-role="bullet-2"><circle cx="41.86600000000001" cy="152.8900000000002" r="3.3410000000000055" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="62.940" y="161.885" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">由两条 F actin → double helix structure，两端 attach to sarcomere。</text></g><g id="bullet-3" data-role="bullet-3"><circle cx="41.86600000000001" cy="191.44000000000028" r="3.3410000000000055" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="62.940" y="200.435" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">由 G actin 构成 → 每一个上都有一个 active site：bind with myosine</text><text xml:space="preserve" x="62.940" y="232.560" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">during contraction。</text></g><g id="bullet-4" data-role="bullet-4"><circle cx="41.86600000000001" cy="262.1150000000004" r="3.3410000000000055" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="62.940" y="271.110" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">tropomyosin：elongated protein winds along the groove of double</text><text xml:space="preserve" x="62.940" y="303.235" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">helix。</text></g><g id="bullet-5" data-role="bullet-5"><circle cx="41.86600000000001" cy="332.79000000000053" r="3.3410000000000055" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="62.940" y="341.785" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">troponin：3 subunits（在 tropomyosin 和 F actin 之间）：1 个 binds to</text><text xml:space="preserve" x="62.940" y="373.910" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">actin；1 个 binds to tropomyosin；1 个 binds to calcium ions。</text></g><g id="bullet-6" data-role="bullet-6"><circle cx="41.86600000000001" cy="403.46500000000066" r="3.3410000000000055" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="62.940" y="412.460" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">tropomyosin / troponin complex 控制 interaction of active site（G</text><text xml:space="preserve" x="62.940" y="444.585" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">actin）and myosine。</text></g><g id="heading-7" data-role="heading-7"><text xml:space="preserve" x="37.240" y="486.733" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.298" font-weight="700" fill="#123b51" text-anchor="start">② Myosin Myofilament</text></g><g id="text-8" data-role="text-8"><text xml:space="preserve" x="37.240" y="532.608" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">组成：myosin molecules → 像 golf clubs 一样。</text></g><g id="text-9" data-role="text-9"><text xml:space="preserve" x="37.240" y="571.158" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">结构：</text></g><g id="text-10" data-role="text-10"><text xml:space="preserve" x="37.240" y="609.708" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">1. myosin heavy chains 组成 rod portion。</text></g><g id="text-11" data-role="text-11"><text xml:space="preserve" x="37.240" y="648.258" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">2. 两个 myosin heads extend laterally。</text></g><g id="text-12" data-role="text-12"><text xml:space="preserve" x="37.240" y="686.808" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">myosin heads 三个作用：</text></g><g id="text-13" data-role="text-13"><text xml:space="preserve" x="37.240" y="725.358" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">1. 与 actin 上的 active site 相 bind，形成 cross-bridges。</text></g><g id="text-14" data-role="text-14"><text xml:space="preserve" x="37.240" y="763.908" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">2. 与 rod portion 通过 hinge region 相连 → bend / straighten during</text><text xml:space="preserve" x="37.240" y="796.033" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">contraction。</text></g><g id="text-15" data-role="text-15"><text xml:space="preserve" x="37.240" y="834.583" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">3. 是 ATPase enzymes，分解 ATP 获得能量 → 用作 hinge region。</text></g><g id="heading-16" data-role="heading-16"><text xml:space="preserve" x="37.240" y="876.731" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.298" font-weight="700" fill="#123b51" text-anchor="start">Neuromuscular Junction</text></g><g id="bullet-17" data-role="bullet-17"><circle cx="41.86600000000001" cy="913.6100000000015" r="3.3410000000000055" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="62.940" y="922.605" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">Motor neuron 携带 action potential → stimulate contraction。</text></g><g id="bullet-18" data-role="bullet-18"><circle cx="41.86600000000001" cy="952.1600000000016" r="3.3410000000000055" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="62.940" y="961.155" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">motor neuron 与 muscle fiber 之间是 neuromuscular junction /</text><text xml:space="preserve" x="62.940" y="993.280" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">synapse（别称）。</text></g><g id="bullet-19" data-role="bullet-19"><circle cx="41.86600000000001" cy="1022.8350000000016" r="3.3410000000000055" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="62.940" y="1031.830" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">P1：axon terminal with synaptic vesicles containing ACh。</text></g><g id="bullet-20" data-role="bullet-20"><circle cx="41.86600000000001" cy="1061.3850000000016" r="3.3410000000000055" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="62.940" y="1070.380" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">结构：Presynaptic Terminal；Synaptic cleft: Space；Postsynaptic</text><text xml:space="preserve" x="62.940" y="1102.505" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">membrane。</text></g><g id="bullet-21" data-role="bullet-21"><circle cx="41.86600000000001" cy="1132.0600000000018" r="3.3410000000000055" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="62.940" y="1141.055" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">Postsynaptic membrane 有 ligand-gated ion channel（接收 ACh 并产生</text><text xml:space="preserve" x="62.940" y="1173.180" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">action potential）。</text></g><g id="heading-22" data-role="heading-22"><text xml:space="preserve" x="37.240" y="1215.328" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.298" font-weight="700" fill="#123b51" text-anchor="start">Sliding Filament Model</text></g><g id="text-23" data-role="text-23"><text xml:space="preserve" x="37.240" y="1261.203" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">本质：Actin Myo 在 Myosin Myo 上滑动 → sarcomeres 缩短 → skeletal</text><text xml:space="preserve" x="37.240" y="1293.328" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">muscle contraction。</text></g><g id="text-24" data-role="text-24"><text xml:space="preserve" x="37.240" y="1331.878" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">actin 和 myosin 长度本身不变（does not change length）。</text></g><g id="text-25" data-role="text-25"><text xml:space="preserve" x="37.240" y="1370.428" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">在 relaxation，sarcomere 变长是因为外部因素 → contraction of</text><text xml:space="preserve" x="37.240" y="1402.553" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.700" font-weight="400" fill="#123b51" text-anchor="start">antagonistic muscles。</text></g></svg>