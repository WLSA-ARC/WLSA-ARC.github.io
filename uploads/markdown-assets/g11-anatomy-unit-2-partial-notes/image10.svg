<svg xmlns="http://www.w3.org/2000/svg" width="1268" height="693" viewBox="0 0 1268 693" role="img"><title>Anatomy source note 10</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1268" height="693" fill="#fff"/><g id="table-0" data-role="table-0"><rect x="24.255" y="24.255" width="304.873" height="41.8" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="32.615" y="47.663" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="700" fill="#fff" text-anchor="start">对比项目</text><rect x="329.127" y="24.255" width="304.873" height="41.8" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="337.488" y="47.663" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="700" fill="#fff" text-anchor="start">骨骼肌 Skeletal Muscle</text><rect x="634.0" y="24.255" width="304.873" height="41.8" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="642.360" y="47.663" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="700" fill="#fff" text-anchor="start">心肌 Cardiac Muscle</text><rect x="938.872" y="24.255" width="304.873" height="41.8" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="947.232" y="47.663" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="700" fill="#fff" text-anchor="start">平滑肌 Smooth Muscle</text><rect x="24.255" y="66.055" width="304.873" height="96.14" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="32.615" y="89.463" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">动作电位特点</text><rect x="329.127" y="66.055" width="304.873" height="96.14" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="337.488" y="89.463" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">Short duration, no plateau</text><text xml:space="preserve" x="337.488" y="116.633" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">phase（平台期）</text><rect x="634.0" y="66.055" width="304.873" height="96.14" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="642.360" y="89.463" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">Long duration, prominent</text><text xml:space="preserve" x="642.360" y="116.633" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">plateau phase, long</text><text xml:space="preserve" x="642.360" y="143.803" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">refractory period（不应期）</text><rect x="938.872" y="66.055" width="304.873" height="96.14" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="947.232" y="89.463" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">Slow wave</text><text xml:space="preserve" x="947.232" y="116.633" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">potentials（慢波电位）,</text><text xml:space="preserve" x="947.232" y="143.803" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">long time course</text><rect x="24.255" y="162.195" width="304.873" height="96.14" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="32.615" y="185.603" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">强直收缩 Tetanic</text><text xml:space="preserve" x="32.615" y="212.773" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">contraction（强直收缩）</text><rect x="329.127" y="162.195" width="304.873" height="96.14" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="337.488" y="185.603" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">Possible</text><rect x="634.0" y="162.195" width="304.873" height="96.14" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="642.360" y="185.603" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">Impossible (long</text><text xml:space="preserve" x="642.360" y="212.773" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">refractory period prevents</text><text xml:space="preserve" x="642.360" y="239.943" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">tetanus)</text><rect x="938.872" y="162.195" width="304.873" height="96.14" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="947.232" y="185.603" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">Maintains sustained</text><text xml:space="preserve" x="947.232" y="212.773" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">tension（持续性张力）(Latch</text><text xml:space="preserve" x="947.232" y="239.943" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">state【锁止状态】)</text><rect x="24.255" y="258.335" width="304.873" height="96.14" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="32.615" y="281.743" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">神经调控</text><rect x="329.127" y="258.335" width="304.873" height="96.14" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="337.488" y="281.743" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">Somatic motor nervous</text><text xml:space="preserve" x="337.488" y="308.913" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">system（躯体运动神经系统）；v</text><text xml:space="preserve" x="337.488" y="336.083" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">oluntary（随意的）</text><rect x="634.0" y="258.335" width="304.873" height="96.14" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="642.360" y="281.743" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">Autonomic nervous</text><text xml:space="preserve" x="642.360" y="308.913" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">system（自主神经系统）；invol</text><text xml:space="preserve" x="642.360" y="336.083" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">untary（不随意的）</text><rect x="938.872" y="258.335" width="304.873" height="96.14" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="947.232" y="281.743" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">Autonomic nervous system;</text><text xml:space="preserve" x="947.232" y="308.913" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">involuntary</text><rect x="24.255" y="354.475" width="304.873" height="177.65" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="32.615" y="377.883" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">钙离子来源</text><rect x="329.127" y="354.475" width="304.873" height="177.65" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="337.488" y="377.883" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">Sarcoplasmic</text><text xml:space="preserve" x="337.488" y="405.053" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">reticulum（肌浆网）only</text><rect x="634.0" y="354.475" width="304.873" height="177.65" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="642.360" y="377.883" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">Extracellular Ca²⁺</text><text xml:space="preserve" x="642.360" y="405.053" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">influx（胞外钙离子内流）+</text><text xml:space="preserve" x="642.360" y="432.223" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">sarcoplasmic reticulum</text><text xml:space="preserve" x="642.360" y="459.393" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">release (Ca²⁺-induced</text><text xml:space="preserve" x="642.360" y="486.563" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">Ca²⁺</text><text xml:space="preserve" x="642.360" y="513.733" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">release【钙触发钙释放】)</text><rect x="938.872" y="354.475" width="304.873" height="177.65" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="947.232" y="377.883" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">Extracellular Ca²⁺ influx</text><text xml:space="preserve" x="947.232" y="405.053" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">+ minor release from</text><text xml:space="preserve" x="947.232" y="432.223" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">sarcoplasmic reticulum</text><rect x="24.255" y="532.125" width="304.873" height="123.31" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="32.615" y="555.533" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">主要功能</text><rect x="329.127" y="532.125" width="304.873" height="123.31" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="337.488" y="555.533" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">Body movement, posture</text><text xml:space="preserve" x="337.488" y="582.703" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">maintenance（维持姿势）</text><rect x="634.0" y="532.125" width="304.873" height="123.31" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="642.360" y="555.533" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">Pump blood for</text><text xml:space="preserve" x="642.360" y="582.703" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">circulation（血液循环）</text><rect x="938.872" y="532.125" width="304.873" height="123.31" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="947.232" y="555.533" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">Visceral</text><text xml:space="preserve" x="947.232" y="582.703" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">peristalsis（内脏蠕动）,</text><text xml:space="preserve" x="947.232" y="609.873" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">regulation of vascular</text><text xml:space="preserve" x="947.232" y="637.043" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.228" font-weight="400" fill="#163142" text-anchor="start">tone（血管张力调节）</text></g></svg>