<svg xmlns="http://www.w3.org/2000/svg" width="1072" height="1450" viewBox="0 0 1072 1450" role="img"><title>Anatomy source note 6</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1072" height="1450" fill="#fff"/><g id="heading-0" data-role="heading-0"><text xml:space="preserve" x="37.520" y="66.134" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.614" font-weight="700" fill="#123b51" text-anchor="start">五、Whole Muscle 的收缩</text></g><g id="text-1" data-role="text-1"><text xml:space="preserve" x="37.520" y="110.938" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">是 graded（分级的）。</text></g><g id="text-2" data-role="text-2"><text xml:space="preserve" x="37.520" y="148.588" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">Multiple motor-unit recruitment：收缩强度由聚集而来的（招聘）motor units</text><text xml:space="preserve" x="37.520" y="179.963" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">决定。</text></g><g id="bullet-3" data-role="bullet-3"><circle cx="42.03800000000001" cy="208.82750000000027" r="3.2630000000000052" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="62.620" y="217.613" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">Sub-threshold stimulus：action potential ×，contraction ×。</text></g><g id="bullet-4" data-role="bullet-4"><circle cx="42.03800000000001" cy="246.47750000000033" r="3.2630000000000052" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="62.620" y="255.263" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">Threshold stimulus：action potential ✓，contraction ✓（只有一个单位）。</text></g><g id="bullet-5" data-role="bullet-5"><circle cx="42.03800000000001" cy="284.1275000000004" r="3.2630000000000052" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="62.620" y="292.913" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">Submaximal stimuli：较强的刺激，更多 motor-unit 加入。</text></g><g id="bullet-6" data-role="bullet-6"><circle cx="42.03800000000001" cy="321.7775000000005" r="3.2630000000000052" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="62.620" y="330.563" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">Maximal stimuli：所有 motor-unit 都加入，contraction max。</text></g><g id="text-7" data-role="text-7"><text xml:space="preserve" x="37.520" y="368.213" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">Size principle：小的 motor unit 先被 recruit，其次才是大的 motor unit。</text></g><g id="text-8" data-role="text-8"><text xml:space="preserve" x="37.520" y="405.863" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">小的 → 精细运动。</text></g><g id="text-9" data-role="text-9"><text xml:space="preserve" x="37.520" y="443.513" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">Muscle tone：由一小部分 motor unit（不同步地，out of</text><text xml:space="preserve" x="37.520" y="474.888" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">phase）交替收缩，维持长时间的恒定张力。</text></g><g id="heading-10" data-role="heading-10"><text xml:space="preserve" x="37.520" y="516.052" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.614" font-weight="700" fill="#123b51" text-anchor="start">六、Types of Isotonic Contraction（见二）</text></g><g id="bullet-11" data-role="bullet-11"><circle cx="42.03800000000001" cy="552.070000000001" r="3.2630000000000052" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="62.620" y="560.855" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">Concentric，向心：克服 resistance → 缩短。ex：举哑铃。</text></g><g id="bullet-12" data-role="bullet-12"><circle cx="42.03800000000001" cy="589.720000000001" r="3.2630000000000052" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="62.620" y="598.505" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">Eccentric，离心：阻力太大 → 拉长。ex：放下哑铃。</text></g><g id="heading-13" data-role="heading-13"><text xml:space="preserve" x="37.520" y="639.669" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.614" font-weight="700" fill="#123b51" text-anchor="start">9.6 Muscle Fiber Type — PPT P63–65</text></g><g id="heading-14" data-role="heading-14"><text xml:space="preserve" x="37.520" y="687.987" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.614" font-weight="700" fill="#123b51" text-anchor="start">一、肌纤维类型</text></g><g id="bullet-15" data-role="bullet-15"><circle cx="42.03800000000001" cy="724.0050000000014" r="3.2630000000000052" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="62.620" y="732.790" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">Slow-twitch（type I）：收缩速度慢；直径小；血液供应好；mitochondria</text><text xml:space="preserve" x="62.620" y="764.165" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">多；更抗疲劳；大量 Myoglobin（肌红蛋白）。下肢：维持姿势 →</text><text xml:space="preserve" x="62.620" y="795.540" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">持续发力，ex：dark meat，常见于 postural muscles。aerobic respiration。</text></g><g id="bullet-16" data-role="bullet-16"><circle cx="42.03800000000001" cy="824.4050000000016" r="3.2630000000000052" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="62.620" y="833.190" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">Fast-twitch（type II）：反应迅速；能快速分解</text><text xml:space="preserve" x="62.620" y="864.565" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">ATP；血液供应少；mitochondria 少；aerobic respiration</text><text xml:space="preserve" x="62.620" y="895.940" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">能力弱。上肢，ex：white meat。下分 Oxidative、Glycolytic。</text></g><g id="bullet-17" data-role="bullet-17"><circle cx="42.03800000000001" cy="924.8050000000018" r="3.2630000000000052" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="62.620" y="933.590" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">大多数肌肉这两种纤维都有（比例不同）。</text></g><g id="bullet-18" data-role="bullet-18"><circle cx="42.03800000000001" cy="962.4550000000019" r="3.2630000000000052" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="62.620" y="971.240" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">两种并不容易转换（gene decided）。</text></g><g id="heading-19" data-role="heading-19"><text xml:space="preserve" x="37.520" y="1012.404" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.614" font-weight="700" fill="#123b51" text-anchor="start">二、Effect of exercise</text></g><g id="text-20" data-role="text-20"><text xml:space="preserve" x="37.520" y="1057.208" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">改变 Muscle fiber 大小，而不是数量。</text></g><g id="bullet-21" data-role="bullet-21"><circle cx="42.03800000000001" cy="1086.072500000002" r="3.2630000000000052" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="62.620" y="1094.858" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">Hypertrophy 肥大：Myofibrils 数量增加，细胞核增加。</text></g><g id="bullet-22" data-role="bullet-22"><circle cx="42.03800000000001" cy="1123.7225000000021" r="3.2630000000000052" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="62.620" y="1132.508" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">Atotrophy 萎缩：通常可以 reverse，除非 cell die。</text></g><g id="text-23" data-role="text-23"><text xml:space="preserve" x="37.520" y="1170.158" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">力量 ↑ 是因为：better blood circulation；less restriction by</text><text xml:space="preserve" x="37.520" y="1201.533" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">fat；increase production of enzymes。</text></g><g id="heading-24" data-role="heading-24"><text xml:space="preserve" x="37.520" y="1242.697" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.614" font-weight="700" fill="#123b51" text-anchor="start">三、Heat Production</text></g><g id="text-25" data-role="text-25"><text xml:space="preserve" x="37.520" y="1287.500" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">skeletal muscle 是身体重要的产热器官，通过 vasodilation 血管舒张和</text><text xml:space="preserve" x="37.520" y="1318.875" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">sweating。</text></g><g id="text-26" data-role="text-26"><text xml:space="preserve" x="37.520" y="1356.525" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.100" font-weight="400" fill="#123b51" text-anchor="start">Shivering 是因为：uncoordinated contraction → 产生热量。</text></g></svg>