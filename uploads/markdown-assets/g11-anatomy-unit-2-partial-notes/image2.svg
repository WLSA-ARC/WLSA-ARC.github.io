<svg xmlns="http://www.w3.org/2000/svg" width="908" height="1234" viewBox="0 0 908 1234" role="img"><title>Anatomy source note 2</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="908" height="1234" fill="#fff"/><g id="heading-0" data-role="heading-0"><text xml:space="preserve" x="31.780" y="68.749" font-family="Arial, Microsoft YaHei, sans-serif" font-size="36.969" font-weight="700" fill="#123b51" text-anchor="start">Component that allow muscles to contract</text></g><g id="bullet-1" data-role="bullet-1"><circle cx="37.61714285714286" cy="115.28357142857143" r="4.215714285714286" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="64.209" y="126.634" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32.429" font-weight="400" fill="#123b51" text-anchor="start">Myofibrils：bundles of protein</text><text xml:space="preserve" x="64.209" y="167.169" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32.429" font-weight="400" fill="#123b51" text-anchor="start">filaments（包含 Myofilaments）。</text></g><g id="bullet-2" data-role="bullet-2"><circle cx="37.61714285714286" cy="204.46214285714288" r="4.215714285714286" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="64.209" y="215.812" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32.429" font-weight="400" fill="#123b51" text-anchor="start">Myofilaments：Actin (thin)；Myosin (thick)。</text></g><g id="bullet-3" data-role="bullet-3"><circle cx="37.61714285714286" cy="253.10500000000002" r="4.215714285714286" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="64.209" y="264.455" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32.429" font-weight="400" fill="#123b51" text-anchor="start">arranged orderly → sarcomeres。</text></g><g id="bullet-4" data-role="bullet-4"><circle cx="37.61714285714286" cy="301.7478571428572" r="4.215714285714286" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="64.209" y="313.098" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32.429" font-weight="400" fill="#123b51" text-anchor="start">Z disk：network of protein，attachment for</text><text xml:space="preserve" x="64.209" y="353.634" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32.429" font-weight="400" fill="#123b51" text-anchor="start">actin myofilaments。</text></g><g id="bullet-5" data-role="bullet-5"><circle cx="37.61714285714286" cy="390.92642857142863" r="4.215714285714286" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="64.209" y="402.276" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32.429" font-weight="400" fill="#123b51" text-anchor="start">sarcomere 不同部分；parallel → striated</text><text xml:space="preserve" x="64.209" y="442.812" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32.429" font-weight="400" fill="#123b51" text-anchor="start">appearance。</text></g><g id="bullet-6" data-role="bullet-6"><circle cx="37.61714285714286" cy="480.1050000000001" r="4.215714285714286" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="64.209" y="491.455" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32.429" font-weight="400" fill="#123b51" text-anchor="start">I bands：lighter region，每一个 I band</text><text xml:space="preserve" x="64.209" y="531.991" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32.429" font-weight="400" fill="#123b51" text-anchor="start">都有一个 Z disk，并延伸到 myosin myofilaments</text><text xml:space="preserve" x="64.209" y="572.526" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32.429" font-weight="400" fill="#123b51" text-anchor="start">末端。</text></g><g id="bullet-7" data-role="bullet-7"><circle cx="37.61714285714286" cy="609.8192857142858" r="4.215714285714286" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="64.209" y="621.169" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32.429" font-weight="400" fill="#123b51" text-anchor="start">A bands：darker region，overlapping actin +</text><text xml:space="preserve" x="64.209" y="661.705" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32.429" font-weight="400" fill="#123b51" text-anchor="start">myosin myofilaments。</text></g><g id="bullet-8" data-role="bullet-8"><circle cx="37.61714285714286" cy="698.9978571428572" r="4.215714285714286" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="64.209" y="710.348" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32.429" font-weight="400" fill="#123b51" text-anchor="start">H zone：A band 中不 overlap 的部分。</text></g><g id="bullet-9" data-role="bullet-9"><circle cx="37.61714285714286" cy="747.6407142857144" r="4.215714285714286" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="64.209" y="758.991" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32.429" font-weight="400" fill="#123b51" text-anchor="start">M line：middle of H zone，delicate filaments</text><text xml:space="preserve" x="64.209" y="799.526" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32.429" font-weight="400" fill="#123b51" text-anchor="start">holding myosin in place。</text></g><g id="bullet-10" data-role="bullet-10"><circle cx="37.61714285714286" cy="836.8192857142858" r="4.215714285714286" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="64.209" y="848.169" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32.429" font-weight="400" fill="#123b51" text-anchor="start">Titin filaments：elastic chains of amino</text><text xml:space="preserve" x="64.209" y="888.705" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32.429" font-weight="400" fill="#123b51" text-anchor="start">acids → muscle extensible + elastic。</text></g></svg>