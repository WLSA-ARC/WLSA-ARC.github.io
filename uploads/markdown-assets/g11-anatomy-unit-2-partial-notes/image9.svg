<svg xmlns="http://www.w3.org/2000/svg" width="1268" height="941" viewBox="0 0 1268 941" role="img"><title>Anatomy source note 9</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1268" height="941" fill="#fff"/><g id="text-0" data-role="text-0"><text xml:space="preserve" x="32.935" y="54.735" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.800" font-weight="400" fill="#123b51" text-anchor="start">这一部分有点杂而且讲的比较快，可以搭配这张表格参考一下。</text></g><g id="table-1" data-role="table-1"><rect x="32.935" y="65.635" width="300.533" height="43.6" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="41.655" y="90.051" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="700" fill="#fff" text-anchor="start">对比项目</text><rect x="333.468" y="65.635" width="300.533" height="43.6" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="342.188" y="90.051" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="700" fill="#fff" text-anchor="start">骨骼肌 Skeletal Muscle</text><rect x="634.0" y="65.635" width="300.533" height="43.6" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="642.720" y="90.051" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="700" fill="#fff" text-anchor="start">心肌 Cardiac Muscle</text><rect x="934.533" y="65.635" width="300.533" height="43.6" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="943.253" y="90.051" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="700" fill="#fff" text-anchor="start">平滑肌 Smooth Muscle</text><rect x="32.935" y="109.235" width="300.533" height="100.28" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="41.655" y="133.651" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">分布位置</text><rect x="333.468" y="109.235" width="300.533" height="100.28" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="342.188" y="133.651" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">Attached to bones</text><rect x="634.0" y="109.235" width="300.533" height="100.28" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="642.720" y="133.651" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">Only in the heart wall</text><rect x="934.533" y="109.235" width="300.533" height="100.28" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="943.253" y="133.651" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">Walls of visceral</text><text xml:space="preserve" x="943.253" y="161.991" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">organs（内脏器官）, blood</text><text xml:space="preserve" x="943.253" y="190.331" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">vessels, glands（腺体）</text><rect x="32.935" y="209.515" width="300.533" height="43.6" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="41.655" y="233.931" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">横纹</text><rect x="333.468" y="209.515" width="300.533" height="43.6" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="342.188" y="233.931" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">Present</text><rect x="634.0" y="209.515" width="300.533" height="43.6" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="642.720" y="233.931" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">Present</text><rect x="934.533" y="209.515" width="300.533" height="43.6" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="943.253" y="233.931" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">Absent</text><rect x="32.935" y="253.115" width="300.533" height="100.28" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="41.655" y="277.531" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">细胞形态</text><rect x="333.468" y="253.115" width="300.533" height="100.28" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="342.188" y="277.531" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">Long,</text><text xml:space="preserve" x="342.188" y="305.871" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">cylindrical（圆柱形的）,</text><text xml:space="preserve" x="342.188" y="334.211" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">unbranched</text><rect x="634.0" y="253.115" width="300.533" height="100.28" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="642.720" y="277.531" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">Short, branched</text><rect x="934.533" y="253.115" width="300.533" height="100.28" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="943.253" y="277.531" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">Spindle-shaped（纺锤形的）,</text><text xml:space="preserve" x="943.253" y="305.871" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start"> unbranched</text><rect x="32.935" y="353.395" width="300.533" height="100.28" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="41.655" y="377.811" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">细胞核</text><rect x="333.468" y="353.395" width="300.533" height="100.28" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="342.188" y="377.811" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">Multiple nuclei,</text><text xml:space="preserve" x="342.188" y="406.151" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">peripheral（周边的）locati</text><text xml:space="preserve" x="342.188" y="434.491" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">on</text><rect x="634.0" y="353.395" width="300.533" height="100.28" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="642.720" y="377.811" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">Usually one nucleus</text><text xml:space="preserve" x="642.720" y="406.151" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">(rarely two), central</text><text xml:space="preserve" x="642.720" y="434.491" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">location</text><rect x="934.533" y="353.395" width="300.533" height="100.28" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="943.253" y="377.811" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">Single nucleus, central</text><text xml:space="preserve" x="943.253" y="406.151" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">location</text><rect x="32.935" y="453.675" width="300.533" height="100.28" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="41.655" y="478.091" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">特殊结构</text><rect x="333.468" y="453.675" width="300.533" height="100.28" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="342.188" y="478.091" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">Well-developed</text><text xml:space="preserve" x="342.188" y="506.431" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">T-tubules（横小管）,</text><text xml:space="preserve" x="342.188" y="534.771" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">myofibrils（肌原纤维）</text><rect x="634.0" y="453.675" width="300.533" height="100.28" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="642.720" y="478.091" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">Intercalated</text><text xml:space="preserve" x="642.720" y="506.431" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">disks（闰盘）, gap</text><text xml:space="preserve" x="642.720" y="534.771" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">junctions（缝隙连接）</text><rect x="934.533" y="453.675" width="300.533" height="100.28" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="943.253" y="478.091" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">Caveolae（胞膜小凹）,</text><text xml:space="preserve" x="943.253" y="506.431" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">dense bodies（密体）；no</text><text xml:space="preserve" x="943.253" y="534.771" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">T-tubules</text><rect x="32.935" y="553.955" width="300.533" height="128.62" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="41.655" y="578.371" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">细胞间电连接</text><rect x="333.468" y="553.955" width="300.533" height="128.62" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="342.188" y="578.371" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">No gap junctions</text><rect x="634.0" y="553.955" width="300.533" height="128.62" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="642.720" y="578.371" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">Gap junctions within</text><text xml:space="preserve" x="642.720" y="606.711" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">intercalated disks for</text><text xml:space="preserve" x="642.720" y="635.051" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">fast electrical</text><text xml:space="preserve" x="642.720" y="663.391" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">conduction（电传导）</text><rect x="934.533" y="553.955" width="300.533" height="128.62" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="943.253" y="578.371" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">Gap junctions in visceral</text><text xml:space="preserve" x="943.253" y="606.711" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">smooth muscle; absent in</text><text xml:space="preserve" x="943.253" y="635.051" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">multi-unit smooth</text><text xml:space="preserve" x="943.253" y="663.391" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">muscle（多单位平滑肌）</text><rect x="32.935" y="682.575" width="300.533" height="43.6" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="41.655" y="706.991" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">收缩相关钙结合蛋白</text><rect x="333.468" y="682.575" width="300.533" height="43.6" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="342.188" y="706.991" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">Troponin（肌钙蛋白）</text><rect x="634.0" y="682.575" width="300.533" height="43.6" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="642.720" y="706.991" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">Troponin（肌钙蛋白）</text><rect x="934.533" y="682.575" width="300.533" height="43.6" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="943.253" y="706.991" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">Calmodulin（钙调蛋白）</text><rect x="32.935" y="726.175" width="300.533" height="156.96" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="41.655" y="750.591" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">自律性</text><text xml:space="preserve" x="41.655" y="778.931" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">Autorhythmicity（自律性）</text><rect x="333.468" y="726.175" width="300.533" height="156.96" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="342.188" y="750.591" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">None; requires neural</text><text xml:space="preserve" x="342.188" y="778.931" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">stimulation（神经刺激）</text><rect x="634.0" y="726.175" width="300.533" height="156.96" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="642.720" y="750.591" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">Autorhythmic</text><text xml:space="preserve" x="642.720" y="778.931" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">cells（自律细胞）exist;</text><text xml:space="preserve" x="642.720" y="807.271" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">can spontaneously</text><text xml:space="preserve" x="642.720" y="835.611" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">generate action</text><text xml:space="preserve" x="642.720" y="863.951" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">potentials（动作电位）</text><rect x="934.533" y="726.175" width="300.533" height="156.96" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="943.253" y="750.591" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">Some visceral smooth</text><text xml:space="preserve" x="943.253" y="778.931" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">muscle shows</text><text xml:space="preserve" x="943.253" y="807.271" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.056" font-weight="400" fill="#163142" text-anchor="start">autorhythmicity</text></g></svg>