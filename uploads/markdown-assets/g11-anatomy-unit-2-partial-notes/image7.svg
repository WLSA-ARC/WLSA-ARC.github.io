<svg xmlns="http://www.w3.org/2000/svg" width="906" height="1254" viewBox="0 0 906 1254" role="img"><title>Anatomy source note 7</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="906" height="1254" fill="#fff"/><g id="heading-0" data-role="heading-0"><text xml:space="preserve" x="31.710" y="56.285" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.575" font-weight="700" fill="#123b51" text-anchor="start">9.7 Muscle Contraction 的能量来源 — PPT P66–71</text></g><g id="heading-1" data-role="heading-1"><text xml:space="preserve" x="31.710" y="97.783" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.575" font-weight="700" fill="#123b51" text-anchor="start">一、3 ATP dependent enzymes</text></g><g id="bullet-2" data-role="bullet-2"><circle cx="35.59028571428571" cy="128.71714285714273" r="2.8024285714285684" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="53.267" y="136.262" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">Myosin head：hydrolysis ATP，为 cross-bridge 提供能量。</text></g><g id="bullet-3" data-role="bullet-3"><circle cx="35.59028571428571" cy="161.052857142857" r="2.8024285714285684" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="53.267" y="168.598" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">Na⁺–K⁺ Pump：维持 resting membrane potential。</text></g><g id="bullet-4" data-role="bullet-4"><circle cx="35.59028571428571" cy="193.38857142857123" r="2.8024285714285684" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="53.267" y="200.934" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">Ca²⁺ reuptake pump：将 Ca^2+ 泵回 SR。</text></g><g id="bullet-5" data-role="bullet-5"><circle cx="35.59028571428571" cy="225.72428571428546" r="2.8024285714285684" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="53.267" y="233.269" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">Muscle fiber 中的 ATP 只能存在 5–6 s，所以要不断生成。</text></g><g id="heading-6" data-role="heading-6"><text xml:space="preserve" x="31.710" y="268.623" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.575" font-weight="700" fill="#123b51" text-anchor="start">二、4 种 ATP 生成途径</text></g><g id="text-7" data-role="text-7"><text xml:space="preserve" x="31.710" y="307.102" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">1. 2ADP→ ATP+AMP：最快即时供能，2–3 s。</text></g><g id="text-8" data-role="text-8"><text xml:space="preserve" x="31.710" y="339.438" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">2. CP+ADP→ Creatine+ATP：把 CP 中的 phosphate 转到 ADP 上，5–6 s。</text></g><g id="text-9" data-role="text-9"><text xml:space="preserve" x="31.710" y="371.774" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">3. Aerobic Respiration：分解 Glucose，产生 ATP、CO₂ 和</text><text xml:space="preserve" x="31.710" y="398.720" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">H₂O；持续数小时，长时间供能。</text></g><g id="text-10" data-role="text-10"><text xml:space="preserve" x="31.710" y="431.056" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">4. Anaerobic Respiration：分解 Glucose，产生 ATP 和 lactic acid；30–40</text><text xml:space="preserve" x="31.710" y="458.002" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">s → lactic acid 乳酸堆积。</text></g><g id="heading-11" data-role="heading-11"><text xml:space="preserve" x="31.710" y="493.356" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.575" font-weight="700" fill="#123b51" text-anchor="start">三、3 种问题</text></g><g id="text-12" data-role="text-12"><text xml:space="preserve" x="31.710" y="531.836" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">1. Muscle Fatigue：</text></g><g id="bullet-13" data-role="bullet-13"><circle cx="35.59028571428571" cy="556.6264285714279" r="2.8024285714285684" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="53.267" y="564.171" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">产生原因：Acidosis + ATP depletion，酸中毒 + ATP 耗尽。由于 ATP 消耗 ↑</text><text xml:space="preserve" x="53.267" y="591.118" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">/ 合成 ↓。</text></g><g id="bullet-14" data-role="bullet-14"><circle cx="35.59028571428571" cy="615.9085714285707" r="2.8024285714285684" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="53.267" y="623.454" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">Oxidative Stress：太多 ROS 堆积。</text></g><g id="bullet-15" data-role="bullet-15"><circle cx="35.59028571428571" cy="648.244285714285" r="2.8024285714285684" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="53.267" y="655.789" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">Local inflammatory，局部炎症。</text></g><g id="bullet-16" data-role="bullet-16"><circle cx="35.59028571428571" cy="680.5799999999992" r="2.8024285714285684" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="53.267" y="688.125" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">痉挛性 contracture：lack of ATP → 动不了。</text></g><g id="bullet-17" data-role="bullet-17"><circle cx="35.59028571428571" cy="712.9157142857135" r="2.8024285714285684" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="53.267" y="720.461" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">心理性 fatigue：nerve system，不是肌肉问题。</text></g><g id="text-18" data-role="text-18"><text xml:space="preserve" x="31.710" y="752.796" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">2. Rigor Mortis 尸僵：死后数小时，Ca^2+ leak into sarcoplasm，形成 cross</text><text xml:space="preserve" x="31.710" y="779.743" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">bridge；因为没有 ATP，cross bridge 分不开。</text></g><g id="bullet-19" data-role="bullet-19"><circle cx="35.59028571428571" cy="804.5335714285707" r="2.8024285714285684" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="53.267" y="812.079" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">Soreness 酸痛：Muscle Fiber 受损。</text></g><g id="text-20" data-role="text-20"><text xml:space="preserve" x="31.710" y="844.414" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">3. Oxygen deficit 氧亏：运动后氧气供应不上。</text></g><g id="bullet-21" data-role="bullet-21"><circle cx="35.59028571428571" cy="869.2049999999992" r="2.8024285714285684" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="53.267" y="876.750" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">EPOC：人话：把氧气补回来。</text></g><g id="heading-22" data-role="heading-22"><text xml:space="preserve" x="31.710" y="912.104" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.575" font-weight="700" fill="#123b51" text-anchor="start">9.8 Smooth Muscle — PPT P71–82</text></g><g id="heading-23" data-role="heading-23"><text xml:space="preserve" x="31.710" y="953.601" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.575" font-weight="700" fill="#123b51" text-anchor="start">一、Structure</text></g><g id="text-24" data-role="text-24"><text xml:space="preserve" x="31.710" y="992.081" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">无 striated（横纹）；fiber 比 skeletal muscle 的小；spindle</text><text xml:space="preserve" x="31.710" y="1019.027" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">shaped；single, central nucleus；actin 比 myosin 更多。</text></g><g id="text-25" data-role="text-25"><text xml:space="preserve" x="31.710" y="1051.363" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">caveolae（类似于 T tubules）；Dense bodies（代替 Z disks）。</text></g><g id="heading-26" data-role="heading-26"><text xml:space="preserve" x="31.710" y="1086.717" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.575" font-weight="700" fill="#123b51" text-anchor="start">二、Smooth Muscle Contraction</text></g><g id="text-27" data-role="text-27"><text xml:space="preserve" x="31.710" y="1125.196" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">（很重要）neurally 刺激或者 hormonally 刺激都可以 → G protein 打开 Ca^2+</text><text xml:space="preserve" x="31.710" y="1152.142" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">channel → Ca^2+ combine with calmodulin → combine 后的 Ca^2+ bind +</text><text xml:space="preserve" x="31.710" y="1179.089" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">activate myosin kinase → Myosin kinase 把 Pi 从 ATP 转到 myosin head →</text><text xml:space="preserve" x="31.710" y="1206.035" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.557" font-weight="400" fill="#123b51" text-anchor="start">cross-bridge formation → 当 myosin phosphatase remove Pi 时解锁。</text></g></svg>