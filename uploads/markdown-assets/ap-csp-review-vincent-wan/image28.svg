<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="438" viewBox="0 0 1120 438" role="img"><title>Symmetric key encryption</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1120" height="438" fill="#fff"/><g transform="scale(1.12 0.8423076923076923)"><text xml:space="preserve" x="28.000" y="38.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.000" font-weight="700" fill="#173c52" text-anchor="start">Symmetric key encryption</text><rect x="30" y="170" width="235" height="98" rx="10" fill="#edf5fa" stroke="#7396ab"/><text xml:space="preserve" x="42.000" y="207.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27.000" font-weight="400" fill="#132e40" text-anchor="start">Plain data</text><rect x="380" y="170" width="235" height="98" rx="10" fill="#edf5fa" stroke="#7396ab"/><text xml:space="preserve" x="392.000" y="207.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27.000" font-weight="400" fill="#132e40" text-anchor="start">Encrypted data</text><rect x="730" y="170" width="235" height="98" rx="10" fill="#edf5fa" stroke="#7396ab"/><text xml:space="preserve" x="742.000" y="207.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27.000" font-weight="400" fill="#132e40" text-anchor="start">Plain data</text><line x1="270" y1="218" x2="370" y2="218" stroke="#28546c" stroke-width="4" marker-end="url(#arrow)"/><line x1="625" y1="218" x2="725" y2="218" stroke="#28546c" stroke-width="4" marker-end="url(#arrow)"/><circle cx="290" cy="115" r="15" fill="#ead27e" stroke="#a1873c" stroke-width="3"/><line x1="304" y1="115" x2="355" y2="115" stroke="#a1873c" stroke-width="8"/><line x1="340" y1="115" x2="340" y2="128" stroke="#a1873c" stroke-width="5"/><text xml:space="preserve" x="220.000" y="75.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.000" font-weight="400" fill="#173c52" text-anchor="start">Shared secret key</text><line x1="320" y1="143" x2="320" y2="185" stroke="#28546c" stroke-width="2" marker-end="url(#arrow)"/><circle cx="645" cy="115" r="15" fill="#ead27e" stroke="#a1873c" stroke-width="3"/><line x1="659" y1="115" x2="710" y2="115" stroke="#a1873c" stroke-width="8"/><line x1="695" y1="115" x2="695" y2="128" stroke="#a1873c" stroke-width="5"/><text xml:space="preserve" x="575.000" y="75.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.000" font-weight="400" fill="#173c52" text-anchor="start">Same shared key</text><line x1="675" y1="143" x2="675" y2="185" stroke="#28546c" stroke-width="2" marker-end="url(#arrow)"/><text xml:space="preserve" x="277.000" y="310.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23.000" font-weight="400" fill="#173c52" text-anchor="start">Encrypt</text><text xml:space="preserve" x="627.000" y="310.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23.000" font-weight="400" fill="#173c52" text-anchor="start">Decrypt</text><text xml:space="preserve" x="35.000" y="390.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27.000" font-weight="400" fill="#173c52" text-anchor="start">One shared secret key encrypts and decrypts data. Both sides</text><text xml:space="preserve" x="35.000" y="423.750" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27.000" font-weight="400" fill="#173c52" text-anchor="start">must keep it secret.</text></g></svg>