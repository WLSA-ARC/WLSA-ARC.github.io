<svg xmlns="http://www.w3.org/2000/svg" width="973" height="390" viewBox="0 0 973 390" role="img"><title>Input: A list of numbers called myList and a number called val.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="973" height="390" fill="#fff"/><g id="text-0" data-role="text-0"><text xml:space="preserve" x="13.650" y="34.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.350" font-weight="400" fill="#123b51" text-anchor="start">Input: A list of numbers called myList and a number called val.</text></g><g id="code-1" data-role="code-1"><rect x="13.650000000000002" y="44.175" width="945.7" height="284.9" rx="3" fill="#102a3c" stroke="#102a3c"/><text xml:space="preserve" x="23.825" y="68.595" font-family="Consolas, Microsoft YaHei, monospace" font-size="19.129" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 1: Procedure countEven(myList, val)</text><text xml:space="preserve" x="23.825" y="95.050" font-family="Consolas, Microsoft YaHei, monospace" font-size="19.129" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 2: {</text><text xml:space="preserve" x="23.825" y="121.505" font-family="Consolas, Microsoft YaHei, monospace" font-size="19.129" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 3:   count ← 0</text><text xml:space="preserve" x="23.825" y="147.960" font-family="Consolas, Microsoft YaHei, monospace" font-size="19.129" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 3:   FOR EACH item IN myList</text><text xml:space="preserve" x="23.825" y="174.415" font-family="Consolas, Microsoft YaHei, monospace" font-size="19.129" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 4:   {</text><text xml:space="preserve" x="23.825" y="200.870" font-family="Consolas, Microsoft YaHei, monospace" font-size="19.129" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 5:     IF(item = val)</text><text xml:space="preserve" x="23.825" y="227.325" font-family="Consolas, Microsoft YaHei, monospace" font-size="19.129" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 6:       count ← count + 1</text><text xml:space="preserve" x="23.825" y="253.780" font-family="Consolas, Microsoft YaHei, monospace" font-size="19.129" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 7:   }</text><text xml:space="preserve" x="23.825" y="280.235" font-family="Consolas, Microsoft YaHei, monospace" font-size="19.129" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 8:   RETURN(count)</text><text xml:space="preserve" x="23.825" y="306.690" font-family="Consolas, Microsoft YaHei, monospace" font-size="19.129" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 9: }</text></g><g id="text-2" data-role="text-2"><text xml:space="preserve" x="13.650" y="361.635" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.350" font-weight="400" fill="#123b51" text-anchor="start">Output: A number that indicates how many times val is in the list called myList.</text></g></svg>