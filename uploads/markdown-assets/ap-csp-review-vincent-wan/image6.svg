<svg xmlns="http://www.w3.org/2000/svg" width="1364" height="780" viewBox="0 0 1364 780" role="img"><title>Iterative development process</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1364" height="780" fill="#fff"/><g transform="scale(1.364 1.1142857142857143)"><text xml:space="preserve" x="28.000" y="38.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.000" font-weight="700" fill="#173c52" text-anchor="start">Development process</text><rect x="30.0" y="95" width="211.0" height="92" rx="10" fill="#edf5fa" stroke="#7396ab"/><text xml:space="preserve" x="42.000" y="128.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23.000" font-weight="400" fill="#132e40" text-anchor="start">Investigating</text><text xml:space="preserve" x="42.000" y="155.600" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23.000" font-weight="400" fill="#132e40" text-anchor="start">and reflecting</text><line x1="243.0" y1="140" x2="252.0" y2="140" stroke="#28546c" stroke-width="3" marker-end="url(#arrow)"/><rect x="255.0" y="95" width="211.0" height="92" rx="10" fill="#edf5fa" stroke="#7396ab"/><text xml:space="preserve" x="267.000" y="128.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23.000" font-weight="400" fill="#132e40" text-anchor="start">Designing</text><line x1="468.0" y1="140" x2="477.0" y2="140" stroke="#28546c" stroke-width="3" marker-end="url(#arrow)"/><rect x="480.0" y="95" width="211.0" height="92" rx="10" fill="#edf5fa" stroke="#7396ab"/><text xml:space="preserve" x="492.000" y="128.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23.000" font-weight="400" fill="#132e40" text-anchor="start">Prototyping</text><line x1="693.0" y1="140" x2="702.0" y2="140" stroke="#28546c" stroke-width="3" marker-end="url(#arrow)"/><rect x="705.0" y="95" width="211.0" height="92" rx="10" fill="#edf5fa" stroke="#7396ab"/><text xml:space="preserve" x="717.000" y="128.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23.000" font-weight="400" fill="#132e40" text-anchor="start">Testing</text><path d="M810.5 190V225H135.5V193" fill="none" stroke="#28546c" stroke-width="3" marker-end="url(#arrow)"/><text xml:space="preserve" x="35.000" y="295.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22.000" font-weight="400" fill="#173c52" text-anchor="start">Investigating: meet users’ needs; plan investigation.</text><text xml:space="preserve" x="35.000" y="380.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22.000" font-weight="400" fill="#173c52" text-anchor="start">Designing: collaborate; plan; organize modules and functional components.</text><text xml:space="preserve" x="35.000" y="465.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22.000" font-weight="400" fill="#173c52" text-anchor="start">Prototyping: program from planning; small steps reduce complexity; make each</text><text xml:space="preserve" x="35.000" y="492.500" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22.000" font-weight="400" fill="#173c52" text-anchor="start">piece work.</text><text xml:space="preserve" x="35.000" y="550.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22.000" font-weight="400" fill="#173c52" text-anchor="start">Testing: user testing; direct observations; no project is perfect at first.</text></g></svg>