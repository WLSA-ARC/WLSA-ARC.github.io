<svg xmlns="http://www.w3.org/2000/svg" width="1114" height="420" viewBox="0 0 1114 420" role="img"><title>| Text / Block | Explanation |</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1114" height="420" fill="#fff"/><g id="table-0" data-role="table-0"><rect x="14.7" y="14.7" width="412.148" height="61.6" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="27.020" y="49.196" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.336" font-weight="700" fill="#fff" text-anchor="start">Text / Block</text><rect x="426.848" y="14.7" width="672.452" height="61.6" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="439.168" y="49.196" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.336" font-weight="700" fill="#fff" text-anchor="start">Explanation</text><rect x="14.7" y="76.3" width="412.148" height="181.72" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="27.020" y="110.796" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.336" font-weight="400" fill="#163142" text-anchor="start">INSERT(list, i, value)</text><rect x="426.848" y="76.3" width="672.452" height="181.72" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="439.168" y="110.796" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.336" font-weight="400" fill="#163142" text-anchor="start">Any values in list at indexes greater</text><text xml:space="preserve" x="439.168" y="150.836" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.336" font-weight="400" fill="#163142" text-anchor="start">than or equal to i are shifted to the</text><text xml:space="preserve" x="439.168" y="190.876" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.336" font-weight="400" fill="#163142" text-anchor="start">right. The length of list is increased by</text><text xml:space="preserve" x="439.168" y="230.916" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.336" font-weight="400" fill="#163142" text-anchor="start">1, and value is placed at index i in list.</text><rect x="14.7" y="258.02" width="412.148" height="101.64" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="27.020" y="292.516" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.336" font-weight="400" fill="#163142" text-anchor="start">APPEND(list, value)</text><rect x="426.848" y="258.02" width="672.452" height="101.64" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="439.168" y="292.516" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.336" font-weight="400" fill="#163142" text-anchor="start">The length of list is increased by 1, and</text><text xml:space="preserve" x="439.168" y="332.556" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.336" font-weight="400" fill="#163142" text-anchor="start">value is placed at the end of list.</text></g></svg>