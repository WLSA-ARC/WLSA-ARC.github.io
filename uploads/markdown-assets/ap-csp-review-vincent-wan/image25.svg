<svg xmlns="http://www.w3.org/2000/svg" width="1108" height="638" viewBox="0 0 1108 638" role="img"><title>Human Bias</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1108" height="638" fill="#fff"/><g id="heading-0" data-role="heading-0"><text xml:space="preserve" x="22.330" y="58.468" font-family="Arial, Microsoft YaHei, sans-serif" font-size="36.138" font-weight="700" fill="#123b51" text-anchor="start">Human Bias</text></g><g id="text-1" data-role="text-1"><text xml:space="preserve" x="22.330" y="115.053" font-family="Arial, Microsoft YaHei, sans-serif" font-size="31.700" font-weight="400" fill="#123b51" text-anchor="start">Computing innovations can reflect existing human bias.</text><text xml:space="preserve" x="22.330" y="154.678" font-family="Arial, Microsoft YaHei, sans-serif" font-size="31.700" font-weight="400" fill="#123b51" text-anchor="start">Algorithms are helping people make decisions that can have</text><text xml:space="preserve" x="22.330" y="194.303" font-family="Arial, Microsoft YaHei, sans-serif" font-size="31.700" font-weight="400" fill="#123b51" text-anchor="start">extreme ramifications.</text></g><g id="bullet-2" data-role="bullet-2"><circle cx="28.036000000000012" cy="230.75750000000036" r="4.1210000000000075" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="54.030" y="241.853" font-family="Arial, Microsoft YaHei, sans-serif" font-size="31.700" font-weight="400" fill="#123b51" text-anchor="start">An algorithm can determine where to place police resources;</text></g><g id="bullet-3" data-role="bullet-3"><circle cx="28.036000000000012" cy="278.3075000000004" r="4.1210000000000075" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="54.030" y="289.403" font-family="Arial, Microsoft YaHei, sans-serif" font-size="31.700" font-weight="400" fill="#123b51" text-anchor="start">it may decide who gets into a college or who will get a job.</text></g><g id="text-4" data-role="text-4"><text xml:space="preserve" x="22.330" y="336.953" font-family="Arial, Microsoft YaHei, sans-serif" font-size="31.700" font-weight="400" fill="#123b51" text-anchor="start">Since computing innovations are created by people, the</text><text xml:space="preserve" x="22.330" y="376.578" font-family="Arial, Microsoft YaHei, sans-serif" font-size="31.700" font-weight="400" fill="#123b51" text-anchor="start">innovations created can reflect bias that the programmers</text><text xml:space="preserve" x="22.330" y="416.203" font-family="Arial, Microsoft YaHei, sans-serif" font-size="31.700" font-weight="400" fill="#123b51" text-anchor="start">bring with them.</text></g><g id="bullet-5" data-role="bullet-5"><circle cx="28.036000000000012" cy="452.6575000000007" r="4.1210000000000075" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="54.030" y="463.753" font-family="Arial, Microsoft YaHei, sans-serif" font-size="31.700" font-weight="400" fill="#123b51" text-anchor="start">Variables such as age are appropriate in some calculations,</text><text xml:space="preserve" x="54.030" y="503.378" font-family="Arial, Microsoft YaHei, sans-serif" font-size="31.700" font-weight="400" fill="#123b51" text-anchor="start">such life insurance and auto insurance,</text></g><g id="bullet-6" data-role="bullet-6"><circle cx="28.036000000000012" cy="539.8325000000009" r="4.1210000000000075" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="54.030" y="550.928" font-family="Arial, Microsoft YaHei, sans-serif" font-size="31.700" font-weight="400" fill="#123b51" text-anchor="start">but inappropriate in other calculations, such as hiring and</text><text xml:space="preserve" x="54.030" y="590.553" font-family="Arial, Microsoft YaHei, sans-serif" font-size="31.700" font-weight="400" fill="#123b51" text-anchor="start">mortgage lending.</text></g></svg>