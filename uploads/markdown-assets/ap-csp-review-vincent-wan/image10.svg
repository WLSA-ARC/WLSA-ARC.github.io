<svg xmlns="http://www.w3.org/2000/svg" width="708" height="400" viewBox="0 0 708 400" role="img"><title>Predicting Algorithms</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="708" height="400" fill="#fff"/><g id="heading-0" data-role="heading-0"><text xml:space="preserve" x="14.000" y="36.328" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22.328" font-weight="700" fill="#123b51" text-anchor="start">Predicting Algorithms</text></g><g id="bullet-1" data-role="bullet-1"><circle cx="17.52542857142857" cy="64.43321428571424" r="2.5461428571428555" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="33.586" y="71.288" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.586" font-weight="400" fill="#123b51" text-anchor="start">A credit card company can use purchasing patterns to identify</text><text xml:space="preserve" x="33.586" y="95.770" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.586" font-weight="400" fill="#123b51" text-anchor="start">when to extend credit or flag a purchase for possible fraud.</text></g><g id="bullet-2" data-role="bullet-2"><circle cx="17.52542857142857" cy="118.2939285714285" r="2.5461428571428555" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="33.586" y="125.149" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.586" font-weight="400" fill="#123b51" text-anchor="start">Social media sites can use patterns to target advertising</text><text xml:space="preserve" x="33.586" y="149.631" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.586" font-weight="400" fill="#123b51" text-anchor="start">based on viewing habits.</text></g><g id="bullet-3" data-role="bullet-3"><circle cx="17.52542857142857" cy="172.15464285714273" r="2.5461428571428555" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="33.586" y="179.010" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.586" font-weight="400" fill="#123b51" text-anchor="start">An online store analyzing customers’ past purchases can</text><text xml:space="preserve" x="33.586" y="203.492" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.586" font-weight="400" fill="#123b51" text-anchor="start">suggest new products the customer may be interested in buying.</text></g><g id="bullet-4" data-role="bullet-4"><circle cx="17.52542857142857" cy="226.01535714285697" r="2.5461428571428555" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="33.586" y="232.870" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.586" font-weight="400" fill="#123b51" text-anchor="start">An entertainment application may recommend an additional</text><text xml:space="preserve" x="33.586" y="257.352" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.586" font-weight="400" fill="#123b51" text-anchor="start">movie to watch based on the viewer’s interests.</text></g><g id="bullet-5" data-role="bullet-5"><circle cx="17.52542857142857" cy="279.8760714285712" r="2.5461428571428555" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="33.586" y="286.731" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.586" font-weight="400" fill="#123b51" text-anchor="start">Algorithms can be used to prevent crimes by identifying crime</text><text xml:space="preserve" x="33.586" y="311.213" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.586" font-weight="400" fill="#123b51" text-anchor="start">“hot spots.” The police can then step up patrols in those</text><text xml:space="preserve" x="33.586" y="335.695" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19.586" font-weight="400" fill="#123b51" text-anchor="start">areas.</text></g></svg>