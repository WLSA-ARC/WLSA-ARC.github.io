<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img"><title>Text-Based Code</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="800" height="440" fill="#fff"/><g id="heading-0" data-role="heading-0"><text xml:space="preserve" x="15.400" y="36.001" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.601" font-weight="700" fill="#123b51" text-anchor="start">Text-Based Code</text></g><g id="text-1" data-role="text-1"><text xml:space="preserve" x="15.400" y="68.259" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.071" font-weight="400" fill="#123b51" text-anchor="start">Input: A list of numbers called myList.</text></g><g id="code-2" data-role="code-2"><rect x="15.400000000000002" y="77.29464285714278" width="769.2" height="252.99999999999972" rx="3" fill="#102a3c" stroke="#102a3c"/><text xml:space="preserve" x="24.436" y="98.980" font-family="Consolas, Microsoft YaHei, monospace" font-size="16.987" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 1: Procedure countEven(myList)</text><text xml:space="preserve" x="24.436" y="122.473" font-family="Consolas, Microsoft YaHei, monospace" font-size="16.987" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 2: {</text><text xml:space="preserve" x="24.436" y="145.966" font-family="Consolas, Microsoft YaHei, monospace" font-size="16.987" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 3:   count ← 0</text><text xml:space="preserve" x="24.436" y="169.459" font-family="Consolas, Microsoft YaHei, monospace" font-size="16.987" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 3:   FOR EACH item IN myList</text><text xml:space="preserve" x="24.436" y="192.952" font-family="Consolas, Microsoft YaHei, monospace" font-size="16.987" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 4:   {</text><text xml:space="preserve" x="24.436" y="216.445" font-family="Consolas, Microsoft YaHei, monospace" font-size="16.987" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 5:     IF(item MOD 2 = 0)</text><text xml:space="preserve" x="24.436" y="239.937" font-family="Consolas, Microsoft YaHei, monospace" font-size="16.987" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 6:       count ← count + 1</text><text xml:space="preserve" x="24.436" y="263.430" font-family="Consolas, Microsoft YaHei, monospace" font-size="16.987" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 7:   }</text><text xml:space="preserve" x="24.436" y="286.923" font-family="Consolas, Microsoft YaHei, monospace" font-size="16.987" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 8:   RETURN(count)</text><text xml:space="preserve" x="24.436" y="310.416" font-family="Consolas, Microsoft YaHei, monospace" font-size="16.987" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 9: }</text></g><g id="text-3" data-role="text-3"><text xml:space="preserve" x="15.400" y="359.209" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.071" font-weight="400" fill="#123b51" text-anchor="start">Output: A number that indicates how many even numbers are in the list called</text><text xml:space="preserve" x="15.400" y="381.798" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.071" font-weight="400" fill="#123b51" text-anchor="start">myList.</text></g><g id="text-4" data-role="text-4"><text xml:space="preserve" x="15.400" y="408.905" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.071" font-weight="400" fill="#123b51" text-anchor="start">Same Code Written in Graphical-Based Form:</text></g></svg>