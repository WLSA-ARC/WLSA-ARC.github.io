<svg xmlns="http://www.w3.org/2000/svg" width="1208" height="666" viewBox="0 0 1208 666" role="img"><title>Repeat-until robot example</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1208" height="666" fill="#fff"/><g transform="scale(1.208 0.9514285714285714)"><text xml:space="preserve" x="28.000" y="38.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.000" font-weight="700" fill="#173c52" text-anchor="start">REPEAT_UNTIL LOOP</text><text xml:space="preserve" x="35.000" y="95.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.000" font-weight="400" fill="#173c52" text-anchor="start">Repeat code until the condition becomes true.</text><text xml:space="preserve" x="35.000" y="170.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.000" font-weight="400" fill="#173c52" text-anchor="start">REPEAT_UNTIL(CAN_MOVE(forward) = false)</text><text xml:space="preserve" x="35.000" y="245.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.000" font-weight="400" fill="#173c52" text-anchor="start">{  MOVE_FORWARD()  }</text><text xml:space="preserve" x="35.000" y="320.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.000" font-weight="400" fill="#173c52" text-anchor="start">The robot starts able to move; the loop ends when forward movement</text><text xml:space="preserve" x="35.000" y="351.250" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.000" font-weight="400" fill="#173c52" text-anchor="start">is false.</text><rect x="100" y="440" width="140" height="120" rx="4" fill="#e6f3fa" stroke="#779fb6"/><line x1="165" y1="598" x2="315" y2="598" stroke="#28546c" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="440" width="140" height="120" rx="4" fill="#e6f3fa" stroke="#779fb6"/><line x1="325" y1="598" x2="475" y2="598" stroke="#28546c" stroke-width="3" marker-end="url(#arrow)"/><rect x="420" y="440" width="140" height="120" rx="4" fill="#e6f3fa" stroke="#779fb6"/><line x1="485" y1="598" x2="635" y2="598" stroke="#28546c" stroke-width="3" marker-end="url(#arrow)"/><rect x="580" y="440" width="140" height="120" rx="4" fill="#e6f3fa" stroke="#779fb6"/><line x1="645" y1="598" x2="795" y2="598" stroke="#28546c" stroke-width="3" marker-end="url(#arrow)"/><rect x="740" y="440" width="140" height="120" rx="4" fill="#e6f3fa" stroke="#779fb6"/><path d="M785 473L838 500L785 527Z" fill="#3082a4" stroke="#28546c" stroke-width="2"/><text xml:space="preserve" x="95.000" y="650.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="26.000" font-weight="400" fill="#173c52" text-anchor="start">Move forward → → → → stop at the rightmost cell</text></g></svg>