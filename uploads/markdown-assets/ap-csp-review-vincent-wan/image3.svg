<svg xmlns="http://www.w3.org/2000/svg" width="799" height="377" viewBox="0 0 799 377" role="img"><title>Example of a program written in graphical form</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="799" height="377" fill="#fff"/><g id="heading-0" data-role="heading-0"><text xml:space="preserve" x="13.195" y="31.020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17.825" font-weight="700" fill="#123b51" text-anchor="start">Example of a program written in graphical form</text></g><g id="text-1" data-role="text-1"><text xml:space="preserve" x="13.195" y="58.929" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15.636" font-weight="400" fill="#123b51" text-anchor="start">Input: A list of numbers called myList.</text></g><g id="code-2" data-role="code-2"><rect x="13.195000000000002" y="66.74732142857133" width="772.61" height="259.5528571428566" rx="3" fill="#102a3c" stroke="#102a3c"/><text xml:space="preserve" x="21.013" y="85.510" font-family="Consolas, Microsoft YaHei, monospace" font-size="14.698" font-weight="400" fill="#f0f6fa" text-anchor="start">PROCEDURE countEven(mylist)</text><text xml:space="preserve" x="21.013" y="105.837" font-family="Consolas, Microsoft YaHei, monospace" font-size="14.698" font-weight="400" fill="#f0f6fa" text-anchor="start">{</text><text xml:space="preserve" x="21.013" y="126.163" font-family="Consolas, Microsoft YaHei, monospace" font-size="14.698" font-weight="400" fill="#f0f6fa" text-anchor="start">  count ← 0</text><text xml:space="preserve" x="21.013" y="146.489" font-family="Consolas, Microsoft YaHei, monospace" font-size="14.698" font-weight="400" fill="#f0f6fa" text-anchor="start">  FOR EACH item IN mylist</text><text xml:space="preserve" x="21.013" y="166.816" font-family="Consolas, Microsoft YaHei, monospace" font-size="14.698" font-weight="400" fill="#f0f6fa" text-anchor="start">  {</text><text xml:space="preserve" x="21.013" y="187.142" font-family="Consolas, Microsoft YaHei, monospace" font-size="14.698" font-weight="400" fill="#f0f6fa" text-anchor="start">    IF (item MOD 2 = 0)</text><text xml:space="preserve" x="21.013" y="207.469" font-family="Consolas, Microsoft YaHei, monospace" font-size="14.698" font-weight="400" fill="#f0f6fa" text-anchor="start">    {</text><text xml:space="preserve" x="21.013" y="227.795" font-family="Consolas, Microsoft YaHei, monospace" font-size="14.698" font-weight="400" fill="#f0f6fa" text-anchor="start">      count ← count + 1</text><text xml:space="preserve" x="21.013" y="248.122" font-family="Consolas, Microsoft YaHei, monospace" font-size="14.698" font-weight="400" fill="#f0f6fa" text-anchor="start">    }</text><text xml:space="preserve" x="21.013" y="268.448" font-family="Consolas, Microsoft YaHei, monospace" font-size="14.698" font-weight="400" fill="#f0f6fa" text-anchor="start">  }</text><text xml:space="preserve" x="21.013" y="288.774" font-family="Consolas, Microsoft YaHei, monospace" font-size="14.698" font-weight="400" fill="#f0f6fa" text-anchor="start">  RETURN count</text><text xml:space="preserve" x="21.013" y="309.101" font-family="Consolas, Microsoft YaHei, monospace" font-size="14.698" font-weight="400" fill="#f0f6fa" text-anchor="start">}</text></g><g id="text-3" data-role="text-3"><text xml:space="preserve" x="13.195" y="351.317" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15.636" font-weight="400" fill="#123b51" text-anchor="start">Output: A number that indicates how many even numbers are in the list called myList.</text></g></svg>