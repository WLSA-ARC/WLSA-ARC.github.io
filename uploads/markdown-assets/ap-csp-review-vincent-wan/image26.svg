<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img"><title>Citizen Science</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1100" height="620" fill="#fff"/><g id="heading-0" data-role="heading-0"><text xml:space="preserve" x="21.700" y="55.444" font-family="Arial, Microsoft YaHei, sans-serif" font-size="33.744" font-weight="700" fill="#123b51" text-anchor="start">Citizen Science</text></g><g id="bullet-1" data-role="bullet-1"><circle cx="27.028000000000013" cy="97.92000000000013" r="3.848000000000007" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="51.300" y="108.280" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.600" font-weight="400" fill="#123b51" text-anchor="start">Citizen science is scientific research using public</text><text xml:space="preserve" x="51.300" y="145.280" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.600" font-weight="400" fill="#123b51" text-anchor="start">participation in scientific research.</text></g><g id="bullet-2" data-role="bullet-2"><circle cx="27.028000000000013" cy="179.32000000000028" r="3.848000000000007" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="51.300" y="189.680" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.600" font-weight="400" fill="#123b51" text-anchor="start">The research is conducted in whole or part by distributed</text><text xml:space="preserve" x="51.300" y="226.680" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.600" font-weight="400" fill="#123b51" text-anchor="start">individuals, many of whom may or may not be scientists.</text></g><g id="bullet-3" data-role="bullet-3"><circle cx="27.028000000000013" cy="260.7200000000004" r="3.848000000000007" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="51.300" y="271.080" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.600" font-weight="400" fill="#123b51" text-anchor="start">They contribute relevant data to research using their own</text><text xml:space="preserve" x="51.300" y="308.080" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.600" font-weight="400" fill="#123b51" text-anchor="start">computing devices.</text></g><g id="bullet-4" data-role="bullet-4"><circle cx="27.028000000000013" cy="342.1200000000006" r="3.848000000000007" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="51.300" y="352.480" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.600" font-weight="400" fill="#123b51" text-anchor="start">For example, citizen science could be used to calculate the</text><text xml:space="preserve" x="51.300" y="389.480" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.600" font-weight="400" fill="#123b51" text-anchor="start">firefly population on the east coast of the United States.</text><text xml:space="preserve" x="51.300" y="426.480" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.600" font-weight="400" fill="#123b51" text-anchor="start">Firefly counting needs lots of people but not a lot of</text><text xml:space="preserve" x="51.300" y="463.480" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.600" font-weight="400" fill="#123b51" text-anchor="start">technical skills or expensive equipment.</text></g><g id="bullet-5" data-role="bullet-5"><circle cx="27.028000000000013" cy="497.52000000000083" r="3.848000000000007" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="51.300" y="507.880" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.600" font-weight="400" fill="#123b51" text-anchor="start">An example of an experiment not suited for citizen science is</text><text xml:space="preserve" x="51.300" y="544.880" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.600" font-weight="400" fill="#123b51" text-anchor="start">testing a vaccine on human volunteers. When testing on humans,</text><text xml:space="preserve" x="51.300" y="581.880" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.600" font-weight="400" fill="#123b51" text-anchor="start">a trained professional scientist is needed.</text></g></svg>