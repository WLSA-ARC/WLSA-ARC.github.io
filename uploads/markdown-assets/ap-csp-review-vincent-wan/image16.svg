<svg xmlns="http://www.w3.org/2000/svg" width="816" height="440" viewBox="0 0 816 440" role="img"><title>Binary Search</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="816" height="440" fill="#fff"/><g id="heading-0" data-role="heading-0"><text xml:space="preserve" x="15.400" y="40.757" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25.357" font-weight="700" fill="#123b51" text-anchor="start">Binary Search</text></g><g id="bullet-1" data-role="bullet-1"><circle cx="19.403714285714287" cy="72.67535714285711" r="2.8915714285714267" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="37.643" y="80.460" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22.243" font-weight="400" fill="#123b51" text-anchor="start">A binary search is a search algorithm that halves the number</text><text xml:space="preserve" x="37.643" y="108.264" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22.243" font-weight="400" fill="#123b51" text-anchor="start">of elements that need to be searched after every comparison.</text></g><g id="bullet-2" data-role="bullet-2"><circle cx="19.403714285714287" cy="133.8432142857142" r="2.8915714285714267" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="37.643" y="141.628" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22.243" font-weight="400" fill="#123b51" text-anchor="start">To use a binary search, the list must be sorted.</text></g><g id="code-3" data-role="code-3"><rect x="15.400000000000002" y="152.74964285714276" width="785.2" height="51.15857142857139" rx="3" fill="#102a3c" stroke="#102a3c"/><text xml:space="preserve" x="26.521" y="179.441" font-family="Consolas, Microsoft YaHei, monospace" font-size="20.908" font-weight="400" fill="#f0f6fa" text-anchor="start">numList ← [1, 3, 5, 8, 56, 76, 300, 330, 900, 1870, 5444]</text></g><g id="text-4" data-role="text-4"><text xml:space="preserve" x="15.400" y="239.497" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22.243" font-weight="400" fill="#123b51" text-anchor="start">What steps are needed for a binary search to find the number 300?</text></g><g id="code-5" data-role="code-5"><rect x="15.400000000000002" y="250.61821428571415" width="785.2" height="137.9057142857142" rx="3" fill="#102a3c" stroke="#102a3c"/><text xml:space="preserve" x="26.521" y="277.310" font-family="Consolas, Microsoft YaHei, monospace" font-size="20.908" font-weight="400" fill="#f0f6fa" text-anchor="start">[1, 3, 5, 8, 56, 76, 300, 330, 900, 1870, 5444]</text><text xml:space="preserve" x="26.521" y="306.225" font-family="Consolas, Microsoft YaHei, monospace" font-size="20.908" font-weight="400" fill="#f0f6fa" text-anchor="start">→ [300, 330, 900, 1870, 5444]</text><text xml:space="preserve" x="26.521" y="335.141" font-family="Consolas, Microsoft YaHei, monospace" font-size="20.908" font-weight="400" fill="#f0f6fa" text-anchor="start">→ [300, 330]</text><text xml:space="preserve" x="26.521" y="364.057" font-family="Consolas, Microsoft YaHei, monospace" font-size="20.908" font-weight="400" fill="#f0f6fa" text-anchor="start">→ 300 = target</text></g></svg>