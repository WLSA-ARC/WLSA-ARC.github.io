<svg xmlns="http://www.w3.org/2000/svg" width="648" height="389" viewBox="0 0 648 389" role="img"><title>Consequences of Using Bits to Represent Data</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="648" height="389" fill="#fff"/><g id="heading-0" data-role="heading-0"><text xml:space="preserve" x="13.615" y="28.712" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15.097" font-weight="700" fill="#123b51" text-anchor="start">Consequences of Using Bits to Represent Data</text></g><g id="text-1" data-role="text-1"><text xml:space="preserve" x="13.615" y="52.350" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13.243" font-weight="400" fill="#123b51" text-anchor="start">Examples:</text></g><g id="table-2" data-role="table-2"><rect x="13.615" y="58.972" width="235.893" height="26.486" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="18.912" y="73.804" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.183" font-weight="700" fill="#fff" text-anchor="start">Type</text><rect x="249.508" y="58.972" width="384.877" height="26.486" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="254.805" y="73.804" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.183" font-weight="700" fill="#fff" text-anchor="start">Example</text><rect x="13.615" y="85.457" width="235.893" height="26.486" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="18.912" y="100.289" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.183" font-weight="400" fill="#163142" text-anchor="start">Integer</text><rect x="249.508" y="85.457" width="384.877" height="26.486" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="254.805" y="100.289" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.183" font-weight="400" fill="#163142" text-anchor="start">4</text><rect x="13.615" y="111.943" width="235.893" height="26.486" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="18.912" y="126.775" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.183" font-weight="400" fill="#163142" text-anchor="start">Real Number</text><rect x="249.508" y="111.943" width="384.877" height="26.486" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="254.805" y="126.775" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.183" font-weight="400" fill="#163142" text-anchor="start">4.00</text><rect x="13.615" y="138.429" width="235.893" height="26.486" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="18.912" y="153.261" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.183" font-weight="400" fill="#163142" text-anchor="start">Boolean</text><rect x="249.508" y="138.429" width="384.877" height="26.486" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="254.805" y="153.261" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.183" font-weight="400" fill="#163142" text-anchor="start">True or False</text><rect x="13.615" y="164.915" width="235.893" height="26.486" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="18.912" y="179.747" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.183" font-weight="400" fill="#163142" text-anchor="start">String</text><rect x="249.508" y="164.915" width="384.877" height="26.486" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="254.805" y="179.747" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.183" font-weight="400" fill="#163142" text-anchor="start">“Novack the third”</text><rect x="13.615" y="191.4" width="235.893" height="26.486" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="18.912" y="206.232" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.183" font-weight="400" fill="#163142" text-anchor="start">List</text><rect x="249.508" y="191.4" width="384.877" height="26.486" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="254.805" y="206.232" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12.183" font-weight="400" fill="#163142" text-anchor="start">[1, 1, 35, 6]</text></g><g id="text-3" data-role="text-3"><text xml:space="preserve" x="13.615" y="239.075" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13.243" font-weight="400" fill="#123b51" text-anchor="start">In JAVA, the range of the value of an integer is from −2,147,483,648 to</text><text xml:space="preserve" x="13.615" y="255.628" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13.243" font-weight="400" fill="#123b51" text-anchor="start">+2,147,483,647. Trying to store a number bigger than the limits will result in an</text><text xml:space="preserve" x="13.615" y="272.182" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13.243" font-weight="400" fill="#123b51" text-anchor="start">overflow error.</text></g><g id="text-4" data-role="text-4"><text xml:space="preserve" x="13.615" y="292.046" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13.243" font-weight="400" fill="#123b51" text-anchor="start">Some languages like Python do not have limits on number size but, instead, expand to</text><text xml:space="preserve" x="13.615" y="308.600" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13.243" font-weight="400" fill="#123b51" text-anchor="start">the limit of the available memory.</text></g><g id="text-5" data-role="text-5"><text xml:space="preserve" x="13.615" y="328.464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13.243" font-weight="400" fill="#123b51" text-anchor="start">The language used on the AP exam, similar to the language Python, does not have a</text><text xml:space="preserve" x="13.615" y="345.017" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13.243" font-weight="400" fill="#123b51" text-anchor="start">limit on the size of numbers. On the exam, the size of representable integers is</text><text xml:space="preserve" x="13.615" y="361.571" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13.243" font-weight="400" fill="#123b51" text-anchor="start">limited only by the size of the computer’s memory.</text></g></svg>