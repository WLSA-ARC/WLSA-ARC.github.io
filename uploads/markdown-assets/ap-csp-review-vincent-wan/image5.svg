<svg xmlns="http://www.w3.org/2000/svg" width="1114" height="490" viewBox="0 0 1114 490" role="img"><title>Text-Based Code</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1114" height="490" fill="#fff"/><g id="heading-0" data-role="heading-0"><text xml:space="preserve" x="17.150" y="45.422" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.272" font-weight="700" fill="#123b51" text-anchor="start">Text-Based Code</text></g><g id="text-1" data-role="text-1"><text xml:space="preserve" x="17.150" y="89.690" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.800" font-weight="400" fill="#123b51" text-anchor="start">Input: A list of numbers called myList.</text></g><g id="code-2" data-role="code-2"><rect x="17.150000000000002" y="102.09000000000013" width="1079.7" height="314.9600000000005" rx="3" fill="#102a3c" stroke="#102a3c"/><text xml:space="preserve" x="29.550" y="131.850" font-family="Consolas, Microsoft YaHei, monospace" font-size="23.312" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 1: Procedure getTotal(myList)</text><text xml:space="preserve" x="29.550" y="164.090" font-family="Consolas, Microsoft YaHei, monospace" font-size="23.312" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 2: {</text><text xml:space="preserve" x="29.550" y="196.330" font-family="Consolas, Microsoft YaHei, monospace" font-size="23.312" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 3:   total ← myList[1]</text><text xml:space="preserve" x="29.550" y="228.570" font-family="Consolas, Microsoft YaHei, monospace" font-size="23.312" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 3:   FOR EACH item IN myList</text><text xml:space="preserve" x="29.550" y="260.810" font-family="Consolas, Microsoft YaHei, monospace" font-size="23.312" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 4:   {</text><text xml:space="preserve" x="29.550" y="293.050" font-family="Consolas, Microsoft YaHei, monospace" font-size="23.312" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 5:     total ← total + item</text><text xml:space="preserve" x="29.550" y="325.290" font-family="Consolas, Microsoft YaHei, monospace" font-size="23.312" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 6:   }</text><text xml:space="preserve" x="29.550" y="357.530" font-family="Consolas, Microsoft YaHei, monospace" font-size="23.312" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 7:   RETURN(total)</text><text xml:space="preserve" x="29.550" y="389.770" font-family="Consolas, Microsoft YaHei, monospace" font-size="23.312" font-weight="400" fill="#f0f6fa" text-anchor="start">Line 8: }</text></g><g id="text-3" data-role="text-3"><text xml:space="preserve" x="17.150" y="456.730" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.800" font-weight="400" fill="#123b51" text-anchor="start">Output: The total of all numbers in the list added together.</text></g></svg>