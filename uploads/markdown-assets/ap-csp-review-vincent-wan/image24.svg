<svg xmlns="http://www.w3.org/2000/svg" width="800" height="436" viewBox="0 0 800 436" role="img"><title>Digital Divide</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="800" height="436" fill="#fff"/><g id="heading-0" data-role="heading-0"><text xml:space="preserve" x="15.260" y="36.203" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20.943" font-weight="700" fill="#123b51" text-anchor="start">Digital Divide</text></g><g id="text-1" data-role="text-1"><text xml:space="preserve" x="15.260" y="68.996" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.371" font-weight="400" fill="#123b51" text-anchor="start">The digital divide is the difference in access to technology including</text><text xml:space="preserve" x="15.260" y="91.961" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.371" font-weight="400" fill="#123b51" text-anchor="start">access to computers and the internet. Several variables affect the digital</text><text xml:space="preserve" x="15.260" y="114.925" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.371" font-weight="400" fill="#123b51" text-anchor="start">divide:</text></g><g id="bullet-2" data-role="bullet-2"><circle cx="18.56685714285714" cy="136.0521428571427" r="2.3882857142857112" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="33.631" y="142.482" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.371" font-weight="400" fill="#123b51" text-anchor="start">Infrastructure—Some parts of the world do not have access to the internet.</text></g><g id="bullet-3" data-role="bullet-3"><circle cx="18.56685714285714" cy="163.60928571428553" r="2.3882857142857112" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="33.631" y="170.039" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.371" font-weight="400" fill="#123b51" text-anchor="start">Education—A person could have access to the internet but not have the</text><text xml:space="preserve" x="33.631" y="193.004" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.371" font-weight="400" fill="#123b51" text-anchor="start">education to use it.</text></g><g id="bullet-4" data-role="bullet-4"><circle cx="18.56685714285714" cy="214.13071428571405" r="2.3882857142857112" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="33.631" y="220.561" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.371" font-weight="400" fill="#123b51" text-anchor="start">Indifference—A person could have access to the internet but choose not to</text><text xml:space="preserve" x="33.631" y="243.525" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.371" font-weight="400" fill="#123b51" text-anchor="start">use it.</text></g><g id="bullet-5" data-role="bullet-5"><circle cx="18.56685714285714" cy="264.65214285714256" r="2.3882857142857112" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="33.631" y="271.082" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.371" font-weight="400" fill="#123b51" text-anchor="start">Cost—The cost of accessing the internet could make using it unaffordable.</text></g><g id="text-6" data-role="text-6"><text xml:space="preserve" x="15.260" y="298.639" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.371" font-weight="400" fill="#123b51" text-anchor="start">For example, Google X’s Project Loon was using balloons traveling at the</text><text xml:space="preserve" x="15.260" y="321.604" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.371" font-weight="400" fill="#123b51" text-anchor="start">edge of space to provide internet infrastructure to people living in</text><text xml:space="preserve" x="15.260" y="344.568" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.371" font-weight="400" fill="#123b51" text-anchor="start">unserved communities around the world.</text></g><g id="text-7" data-role="text-7"><text xml:space="preserve" x="15.260" y="372.125" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.371" font-weight="400" fill="#123b51" text-anchor="start">Some communities are also providing education classes and free Wi-Fi to</text><text xml:space="preserve" x="15.260" y="395.089" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.371" font-weight="400" fill="#123b51" text-anchor="start">decrease the digital divide.</text></g></svg>