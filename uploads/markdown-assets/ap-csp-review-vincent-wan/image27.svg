<svg xmlns="http://www.w3.org/2000/svg" width="1126" height="532" viewBox="0 0 1126 532" role="img"><title>Multifactor authentication</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1126" height="532" fill="#fff"/><g id="heading-0" data-role="heading-0"><text xml:space="preserve" x="18.620" y="46.208" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27.588" font-weight="700" fill="#123b51" text-anchor="start">Multifactor authentication</text></g><g id="text-1" data-role="text-1"><text xml:space="preserve" x="18.620" y="89.405" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.200" font-weight="400" fill="#123b51" text-anchor="start">Multifactor authentication is a method of computer access control in which a user</text><text xml:space="preserve" x="18.620" y="119.655" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.200" font-weight="400" fill="#123b51" text-anchor="start">is granted access only after successfully presenting several pieces of evidence to</text><text xml:space="preserve" x="18.620" y="149.905" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.200" font-weight="400" fill="#123b51" text-anchor="start">an authentication mechanism, typically in at least two of the following categories:</text></g><g id="bullet-2" data-role="bullet-2"><circle cx="22.976000000000006" cy="177.73500000000024" r="3.1460000000000052" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="42.820" y="186.205" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.200" font-weight="400" fill="#123b51" text-anchor="start">Knowledge—something the user knows</text></g><g id="bullet-3" data-role="bullet-3"><circle cx="22.976000000000006" cy="214.0350000000003" r="3.1460000000000052" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="42.820" y="222.505" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.200" font-weight="400" fill="#123b51" text-anchor="start">Possession—something the user has</text></g><g id="bullet-4" data-role="bullet-4"><circle cx="22.976000000000006" cy="250.33500000000038" r="3.1460000000000052" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="42.820" y="258.805" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.200" font-weight="400" fill="#123b51" text-anchor="start">Inherence—something the user is</text></g><g id="text-5" data-role="text-5"><text xml:space="preserve" x="18.620" y="295.105" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.200" font-weight="400" fill="#123b51" text-anchor="start">图注：Digital Certificate。</text></g><g id="text-6" data-role="text-6"><text xml:space="preserve" x="18.620" y="331.405" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.200" font-weight="400" fill="#123b51" text-anchor="start">Multifactor authentication requires at least two steps to unlock protected</text><text xml:space="preserve" x="18.620" y="361.655" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.200" font-weight="400" fill="#123b51" text-anchor="start">information. Each step adds a new layer of security that must be broken to gain</text><text xml:space="preserve" x="18.620" y="391.905" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.200" font-weight="400" fill="#123b51" text-anchor="start">unauthorized access.</text></g><g id="text-7" data-role="text-7"><text xml:space="preserve" x="18.620" y="428.205" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.200" font-weight="400" fill="#123b51" text-anchor="start">Digital certificate authorities issue digital certificates that validate the</text><text xml:space="preserve" x="18.620" y="458.455" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.200" font-weight="400" fill="#123b51" text-anchor="start">ownership of encryption keys used in secure communications and are based on a</text><text xml:space="preserve" x="18.620" y="488.705" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24.200" font-weight="400" fill="#123b51" text-anchor="start">trust model.</text></g></svg>