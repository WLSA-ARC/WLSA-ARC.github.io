<svg xmlns="http://www.w3.org/2000/svg" width="1132" height="456" viewBox="0 0 1132 456" role="img"><title>Why Is Parallel Computing Used?</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1132" height="456" fill="#fff"/><g id="heading-0" data-role="heading-0"><text xml:space="preserve" x="15.960" y="47.652" font-family="Arial, Microsoft YaHei, sans-serif" font-size="31.692" font-weight="700" fill="#123b51" text-anchor="start">Why Is Parallel Computing Used?</text></g><g id="bullet-1" data-role="bullet-1"><circle cx="20.96400000000001" cy="87.54500000000012" r="3.614000000000006" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="43.760" y="97.275" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27.800" font-weight="400" fill="#123b51" text-anchor="start">In the real world, many things happen at the same time in different</text><text xml:space="preserve" x="43.760" y="132.025" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27.800" font-weight="400" fill="#123b51" text-anchor="start">places concurrently.</text></g><g id="bullet-2" data-role="bullet-2"><circle cx="20.96400000000001" cy="163.99500000000023" r="3.614000000000006" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="43.760" y="173.725" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27.800" font-weight="400" fill="#123b51" text-anchor="start">Parallel computing is needed for real-world simulations and modeling.</text></g><g id="text-3" data-role="text-3"><text xml:space="preserve" x="15.960" y="215.425" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27.800" font-weight="400" fill="#123b51" text-anchor="start">Some examples of complex computer simulations that benefit from parallel</text><text xml:space="preserve" x="15.960" y="250.175" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27.800" font-weight="400" fill="#123b51" text-anchor="start">computing include weather forecasting, flight simulators, car crash</text><text xml:space="preserve" x="15.960" y="284.925" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27.800" font-weight="400" fill="#123b51" text-anchor="start">modeling, seismic surveying, and so on. The “speedup” of a parallel</text><text xml:space="preserve" x="15.960" y="319.675" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27.800" font-weight="400" fill="#123b51" text-anchor="start">solution is measured in the time to complete the task sequentially</text><text xml:space="preserve" x="15.960" y="354.425" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27.800" font-weight="400" fill="#123b51" text-anchor="start">divided by the time to complete the task when done in parallel:</text></g><g id="text-4" data-role="text-4"><text xml:space="preserve" x="15.960" y="396.125" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27.800" font-weight="400" fill="#123b51" text-anchor="start">Speedup=(sequential run time)/(parallel run time)</text></g></svg>