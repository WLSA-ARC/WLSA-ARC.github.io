<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="686" viewBox="0 0 1190 686" role="img"><title>Boolean Table (Logic Operator)</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1190" height="686" fill="#fff"/><g id="heading-0" data-role="heading-0"><text xml:space="preserve" x="24.010" y="60.832" font-family="Arial, Microsoft YaHei, sans-serif" font-size="36.822" font-weight="700" fill="#123b51" text-anchor="start">Boolean Table (Logic Operator)</text></g><g id="table-1" data-role="table-1"><rect x="24.01" y="86.188" width="433.952" height="106.59" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="36.930" y="122.364" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.716" font-weight="700" fill="#fff" text-anchor="start">Instruction (Text and</text><text xml:space="preserve" x="36.930" y="164.354" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.716" font-weight="700" fill="#fff" text-anchor="start">Block)</text><rect x="457.962" y="86.188" width="708.028" height="106.59" rx="0" fill="#153e52" stroke="#bfd0d9"/><text xml:space="preserve" x="470.882" y="122.364" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.716" font-weight="700" fill="#fff" text-anchor="start">Explanation</text><rect x="24.01" y="192.778" width="433.952" height="106.59" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="36.930" y="228.954" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.716" font-weight="400" fill="#163142" text-anchor="start">NOT condition</text><rect x="457.962" y="192.778" width="708.028" height="106.59" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="470.882" y="228.954" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.716" font-weight="400" fill="#163142" text-anchor="start">Evaluates to “true” if condition is</text><text xml:space="preserve" x="470.882" y="270.944" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.716" font-weight="400" fill="#163142" text-anchor="start">false; otherwise evaluates to “false.”</text><rect x="24.01" y="299.368" width="433.952" height="148.58" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="36.930" y="335.544" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.716" font-weight="400" fill="#163142" text-anchor="start">condition1 AND condition2</text><rect x="457.962" y="299.368" width="708.028" height="148.58" rx="0" fill="#fff" stroke="#bfd0d9"/><text xml:space="preserve" x="470.882" y="335.544" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.716" font-weight="400" fill="#163142" text-anchor="start">Evaluates to “true” if both condition1</text><text xml:space="preserve" x="470.882" y="377.534" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.716" font-weight="400" fill="#163142" text-anchor="start">and condition2 are true; otherwise,</text><text xml:space="preserve" x="470.882" y="419.524" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.716" font-weight="400" fill="#163142" text-anchor="start">evaluates to “false.”</text><rect x="24.01" y="447.948" width="433.952" height="190.57" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="36.930" y="484.124" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.716" font-weight="400" fill="#163142" text-anchor="start">condition1 OR condition2</text><rect x="457.962" y="447.948" width="708.028" height="190.57" rx="0" fill="#eef5f8" stroke="#bfd0d9"/><text xml:space="preserve" x="470.882" y="484.124" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.716" font-weight="400" fill="#163142" text-anchor="start">Evaluates to “true” if either</text><text xml:space="preserve" x="470.882" y="526.114" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.716" font-weight="400" fill="#163142" text-anchor="start">condition1 is true or condition2 is true</text><text xml:space="preserve" x="470.882" y="568.104" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.716" font-weight="400" fill="#163142" text-anchor="start">or if both condition1 and condition2 are</text><text xml:space="preserve" x="470.882" y="610.094" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29.716" font-weight="400" fill="#163142" text-anchor="start">true; otherwise, evaluates to “false.”</text></g></svg>