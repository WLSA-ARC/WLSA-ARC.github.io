<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790"><title>Isotopemassspectrum</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><line x1="160" y1="510" x2="590" y2="510" stroke="#172033" stroke-width="2.4"/><path d="M580 505.5 L590 510 L580 514.5" fill="none" stroke="#172033" stroke-width="2.4"/><line x1="160" y1="510" x2="160" y2="150" stroke="#172033" stroke-width="2.4"/><path d="M155.5 160 L160 150 L164.5 160" fill="none" stroke="#172033" stroke-width="2.4"/><text x="375" y="565" font-size="26" fill="#172033" text-anchor="middle">Mass / charge ratio (m/z)</text><text x="105" y="330" font-size="25" fill="#172033" text-anchor="middle" transform="rotate(-90 105 330.0)">Relative abundance (%)</text><line x1="160" y1="505" x2="160" y2="517" stroke="#172033" stroke-width="2.2"/><text x="160" y="541" font-size="22" fill="#172033" text-anchor="middle">34</text><line x1="267.5" y1="505" x2="267.5" y2="517" stroke="#172033" stroke-width="2.2"/><text x="267.5" y="541" font-size="22" fill="#172033" text-anchor="middle">35</text><line x1="375" y1="505" x2="375" y2="517" stroke="#172033" stroke-width="2.2"/><text x="375" y="541" font-size="22" fill="#172033" text-anchor="middle">36</text><line x1="482.5" y1="505" x2="482.5" y2="517" stroke="#172033" stroke-width="2.2"/><text x="482.5" y="541" font-size="22" fill="#172033" text-anchor="middle">37</text><line x1="590" y1="505" x2="590" y2="517" stroke="#172033" stroke-width="2.2"/><text x="590" y="541" font-size="22" fill="#172033" text-anchor="middle">38</text><rect x="251.5" y="410" width="32" height="100" rx="0" fill="#e2e8f0" stroke="#172033" stroke-width="2"/><text x="267.5" y="390" font-size="29" fill="#172033" text-anchor="middle">25%</text><rect x="466.5" y="210" width="32" height="300" rx="0" fill="#e2e8f0" stroke="#172033" stroke-width="2"/><text x="482.5" y="190" font-size="29" fill="#172033" text-anchor="middle">75%</text><rect x="650" y="55" width="400" height="168.4" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="665" y="94" font-size="27" fill="#172033">Each bar represents an</text><text x="665" y="128.56" font-size="27" fill="#172033">isotope. Relative bar height</text><text x="665" y="163.12" font-size="27" fill="#172033">gives its abundance; the</text><text x="665" y="197.68" font-size="27" fill="#172033">abundances sum to 100%.</text><rect x="650" y="300" width="400" height="133.3" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="665" y="339" font-size="27" fill="#172033">For monatomic ions, m/z (or</text><text x="665" y="373.56" font-size="27" fill="#172033">mass number) approximates</text><text x="665" y="408.12" font-size="27" fill="#172033">the isotopic mass in amu.</text></g></svg>
