<svg xmlns="http://www.w3.org/2000/svg" width="1075" height="589" viewBox="0 0 1075 589" role="img"><title>王利发｜茶馆掌柜、线索人物</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8f1717"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="43.00" y="53.01" font-size="38.39" font-weight="700" fill="#8f1717">王利发｜茶馆掌柜、线索人物</text><rect x="37.63" y="106.02" width="239.94" height="50.35" rx="0" fill="#8f1717" stroke="#d8d2ca"/><text x="49.63" y="136.45" font-size="22.40" font-weight="700" fill="white">性格特征</text><rect x="277.56" y="106.02" width="759.81" height="50.35" rx="0" fill="#8f1717" stroke="#d8d2ca"/><text x="289.56" y="136.45" font-size="22.40" font-weight="700" fill="white">人物言行与含义</text><rect x="37.63" y="156.37" width="239.94" height="81.71" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="49.63" y="186.80" font-size="22.40" font-weight="400" fill="#191919">圆滑机灵</text><rect x="277.56" y="156.37" width="759.81" height="81.71" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="289.56" y="186.80" font-size="22.40" font-weight="400" fill="#191919">继承了父亲的处世哲学，多说好话，多请安，讨人人的喜欢。“我知道您多</text><text x="289.56" y="218.16" font-size="22.40" font-weight="400" fill="#191919">么照应我，心疼我，决不会叫我挑着大茶壶，到街上卖热茶去！”</text><rect x="37.63" y="238.08" width="239.94" height="50.35" rx="0" fill="white" stroke="#d8d2ca"/><text x="49.63" y="268.51" font-size="22.40" font-weight="400" fill="#191919">善于应酬</text><rect x="277.56" y="238.08" width="759.81" height="50.35" rx="0" fill="white" stroke="#d8d2ca"/><text x="289.56" y="268.51" font-size="22.40" font-weight="400" fill="#191919">“那么多的买卖，您的小手指头都比我的腰还粗。”</text><rect x="37.63" y="288.44" width="239.94" height="50.35" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="49.63" y="318.86" font-size="22.40" font-weight="400" fill="#191919">精明干练</text><rect x="277.56" y="288.44" width="759.81" height="50.35" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="289.56" y="318.86" font-size="22.40" font-weight="400" fill="#191919">在动荡年代经营茶馆，后来也曾试图改良以顺应时代，善于经营。</text><rect x="37.63" y="338.79" width="239.94" height="113.06" rx="0" fill="white" stroke="#d8d2ca"/><text x="49.63" y="369.22" font-size="22.40" font-weight="400" fill="#191919">胆小自私</text><rect x="277.56" y="338.79" width="759.81" height="113.06" rx="0" fill="white" stroke="#d8d2ca"/><text x="289.56" y="369.22" font-size="22.40" font-weight="400" fill="#191919">茶馆的规矩“莫谈国事”表明他想避开政治，维持生计自保为上。常四爷赏</text><text x="289.56" y="400.57" font-size="22.40" font-weight="400" fill="#191919">乡妇母女面吃，他说“我告诉您，这路事儿太多了，太多了！谁也管不了</text><text x="289.56" y="431.93" font-size="22.40" font-weight="400" fill="#191919">！”反映出他自私自利的一面。</text><text x="37.63" y="497.45" font-size="22.40" font-weight="400" fill="#555">旧社会小商人的代表，广大市民的典型，乱世底层商贩维生之艰难。</text></g></svg>