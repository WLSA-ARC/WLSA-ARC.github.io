<svg xmlns="http://www.w3.org/2000/svg" width="986" height="540" viewBox="0 0 986 540" role="img"><title>潜台词：常四爷与康六</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8f1717"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="39.44" y="48.60" font-size="35.21" font-weight="700" fill="#8f1717">潜台词：常四爷与康六</text><rect x="39.44" y="86.40" width="907.12" height="192.64" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="57.44" y="123.38" font-size="28.35" font-weight="700" fill="#8f1717">③ 常四爷：“要抖威风，跟洋人干去，洋人厉害！英法联军烧了圆明</text><text x="57.44" y="166.46" font-size="28.35" font-weight="700" fill="#8f1717">园，尊家吃着官饷，可没见您去冲锋打仗！”</text><text x="57.44" y="217.55" font-size="24.65" font-weight="400" fill="#191919">常四爷言辞犀利地回敬对方，明里讽刺二德子，暗中指责腐败政府，一针见</text><text x="57.44" y="255.02" font-size="24.65" font-weight="400" fill="#191919">血，咄咄逼人。</text><rect x="39.44" y="298.76" width="907.12" height="192.64" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="57.44" y="335.74" font-size="28.35" font-weight="700" fill="#8f1717">④ 康六：“那不是因为乡下种地的都没法子混了吗？一家大小要是一</text><text x="57.44" y="378.82" font-size="28.35" font-weight="700" fill="#8f1717">天能吃上一顿粥，我要还想卖女儿，我就不是人！”</text><text x="57.44" y="429.91" font-size="24.65" font-weight="400" fill="#191919">一种社会现象：农村破产，民不聊生。农民已经无法生存下去，只能靠卖儿卖</text><text x="57.44" y="467.38" font-size="24.65" font-weight="400" fill="#191919">女以维持暂时的生计。</text></g></svg>