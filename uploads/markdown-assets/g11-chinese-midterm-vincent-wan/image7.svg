<svg xmlns="http://www.w3.org/2000/svg" width="1267" height="691" viewBox="0 0 1267 691" role="img"><title>话剧的三种结构</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8f1717"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50.68" y="62.19" font-size="42.00" font-weight="700" fill="#8f1717">话剧的三种结构</text><rect x="44.35" y="124.38" width="294.58" height="55.95" rx="0" fill="#8f1717" stroke="#d8d2ca"/><text x="56.35" y="159.53" font-size="26.40" font-weight="700" fill="white">结构</text><rect x="338.92" y="124.38" width="589.15" height="55.95" rx="0" fill="#8f1717" stroke="#d8d2ca"/><text x="350.92" y="159.53" font-size="26.40" font-weight="700" fill="white">涵义</text><rect x="928.08" y="124.38" width="294.58" height="55.95" rx="0" fill="#8f1717" stroke="#d8d2ca"/><text x="940.08" y="159.53" font-size="26.40" font-weight="700" fill="white">典型</text><rect x="44.35" y="180.33" width="294.58" height="166.82" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="56.35" y="215.48" font-size="26.40" font-weight="400" fill="#191919">锁闭式结构（“内省</text><text x="56.35" y="252.44" font-size="26.40" font-weight="400" fill="#191919">式”或“回顾式”）</text><rect x="338.92" y="180.33" width="589.15" height="166.82" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="350.92" y="215.48" font-size="26.40" font-weight="400" fill="#191919">从事件接近高潮的地方写起，之前所涉及的人</text><text x="350.92" y="252.44" font-size="26.40" font-weight="400" fill="#191919">物、所发生的事件则随着情节的发展通过人物回</text><text x="350.92" y="289.39" font-size="26.40" font-weight="400" fill="#191919">顾来补充交代。</text><rect x="928.08" y="180.33" width="294.58" height="166.82" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="940.08" y="215.48" font-size="26.40" font-weight="400" fill="#191919">《俄狄浦斯王》（索福</text><text x="940.08" y="252.44" font-size="26.40" font-weight="400" fill="#191919">克勒斯）、《群鬼》</text><text x="940.08" y="289.39" font-size="26.40" font-weight="400" fill="#191919">（易卜生）、《雷雨》</text><text x="940.08" y="326.34" font-size="26.40" font-weight="400" fill="#191919">（曹禺）</text><rect x="44.35" y="347.15" width="294.58" height="92.91" rx="0" fill="white" stroke="#d8d2ca"/><text x="56.35" y="382.30" font-size="26.40" font-weight="400" fill="#191919">开放式结构（“线性</text><text x="56.35" y="419.25" font-size="26.40" font-weight="400" fill="#191919">式”）</text><rect x="338.92" y="347.15" width="589.15" height="92.91" rx="0" fill="white" stroke="#d8d2ca"/><text x="350.92" y="382.30" font-size="26.40" font-weight="400" fill="#191919">将事件按照发生发展的顺序的从头写到尾，作品</text><text x="350.92" y="419.25" font-size="26.40" font-weight="400" fill="#191919">反映事件的始末，风格较为洒脱。</text><rect x="928.08" y="347.15" width="294.58" height="92.91" rx="0" fill="white" stroke="#d8d2ca"/><text x="940.08" y="382.30" font-size="26.40" font-weight="400" fill="#191919">《奥赛罗》（莎士比</text><text x="940.08" y="419.25" font-size="26.40" font-weight="400" fill="#191919">亚）</text><rect x="44.35" y="440.06" width="294.58" height="129.86" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="56.35" y="475.21" font-size="26.40" font-weight="400" fill="#191919">人像展览式结构</text><rect x="338.92" y="440.06" width="589.15" height="129.86" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="350.92" y="475.21" font-size="26.40" font-weight="400" fill="#191919">以人物呈现为中心的结构，以刻画形形色色的人</text><text x="350.92" y="512.16" font-size="26.40" font-weight="400" fill="#191919">物表现时代的社会风貌，剧情往往在一个比较特</text><text x="350.92" y="549.11" font-size="26.40" font-weight="400" fill="#191919">殊的地点展开，作为一个平台。</text><rect x="928.08" y="440.06" width="294.58" height="129.86" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="940.08" y="475.21" font-size="26.40" font-weight="400" fill="#191919">《茶馆》（老舍）、</text><text x="940.08" y="512.16" font-size="26.40" font-weight="400" fill="#191919">《日出》（曹禺）</text></g></svg>