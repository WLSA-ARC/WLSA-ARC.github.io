<svg xmlns="http://www.w3.org/2000/svg" width="987" height="556" viewBox="0 0 987 556" role="img"><title>常四爷｜正义爱国的晚清旗人</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8f1717"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="39.48" y="50.04" font-size="35.25" font-weight="700" fill="#8f1717">常四爷｜正义爱国的晚清旗人</text><rect x="34.55" y="100.08" width="220.30" height="45.69" rx="0" fill="#8f1717" stroke="#d8d2ca"/><text x="46.55" y="126.57" font-size="19.06" font-weight="700" fill="white">性格特征</text><rect x="254.84" y="100.08" width="697.61" height="45.69" rx="0" fill="#8f1717" stroke="#d8d2ca"/><text x="266.84" y="126.57" font-size="19.06" font-weight="700" fill="white">人物言行与含义</text><rect x="34.55" y="145.77" width="220.30" height="99.06" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="46.55" y="172.26" font-size="19.06" font-weight="400" fill="#191919">忧国忧民</text><rect x="254.84" y="145.77" width="697.61" height="99.06" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="266.84" y="172.26" font-size="19.06" font-weight="400" fill="#191919">看到刘麻子身上的洋货，他忧虑“这得往外流多少银子啊！”康六卖女儿，他忧</text><text x="266.84" y="198.95" font-size="19.06" font-weight="400" fill="#191919">虑“乡下是怎么了？会弄得这么卖儿卖女的！”乡妇卖女儿，他感叹“大清国要</text><text x="266.84" y="225.64" font-size="19.06" font-weight="400" fill="#191919">完！”</text><rect x="34.55" y="244.83" width="220.30" height="72.38" rx="0" fill="white" stroke="#d8d2ca"/><text x="46.55" y="271.32" font-size="19.06" font-weight="400" fill="#191919">爱憎分明，敢作敢当</text><rect x="254.84" y="244.83" width="697.61" height="72.38" rx="0" fill="white" stroke="#d8d2ca"/><text x="266.84" y="271.32" font-size="19.06" font-weight="400" fill="#191919">爱国的同时，痛恨洋鬼子和洋人的走狗，“我就不佩服吃洋饭的！”被宋、恩二</text><text x="266.84" y="298.01" font-size="19.06" font-weight="400" fill="#191919">人抓走时也坦言“我爱大清国，我怕她完了”，说“甭锁，我跑不了！”</text><rect x="34.55" y="317.20" width="220.30" height="99.06" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="46.55" y="343.70" font-size="19.06" font-weight="400" fill="#191919">硬气仗义，有正义感</text><rect x="254.84" y="317.20" width="697.61" height="99.06" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="266.84" y="343.70" font-size="19.06" font-weight="400" fill="#191919">当面训斥二德子，“尊家吃着官饷，可没见您去冲锋打仗！”还斥责伤天害理的</text><text x="266.84" y="370.39" font-size="19.06" font-weight="400" fill="#191919">纤手刘麻子“您可真有个狠劲儿，给拉拢这路事！”同情受苦受难、啼饥号寒的</text><text x="266.84" y="397.07" font-size="19.06" font-weight="400" fill="#191919">乡妇小孩，叫了烂肉面给她们吃。</text><text x="34.55" y="456.86" font-size="19.06" font-weight="400" fill="#555">晚清遗老中的正义爱国之士。</text></g></svg>