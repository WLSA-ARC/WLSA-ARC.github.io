<svg xmlns="http://www.w3.org/2000/svg" width="1442" height="766" viewBox="0 0 1442 766" role="img"><title>情节与主题的对应关系</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8f1717"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="57.68" y="68.94" font-size="42.00" font-weight="700" fill="#8f1717">情节与主题的对应关系</text><rect x="50.47" y="137.88" width="402.32" height="47.00" rx="0" fill="#8f1717" stroke="#d8d2ca"/><text x="62.47" y="165.48" font-size="20.00" font-weight="700" fill="white">情节</text><rect x="452.79" y="137.88" width="938.74" height="47.00" rx="0" fill="#8f1717" stroke="#d8d2ca"/><text x="464.79" y="165.48" font-size="20.00" font-weight="700" fill="white">揭示主题</text><rect x="50.47" y="184.88" width="402.32" height="47.00" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="62.47" y="212.48" font-size="20.00" font-weight="400" fill="#191919">唐铁嘴讨茶</text><rect x="452.79" y="184.88" width="938.74" height="47.00" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="464.79" y="212.48" font-size="20.00" font-weight="400" fill="#191919">大烟残害百姓，迷信思想盛行</text><rect x="50.47" y="231.88" width="402.32" height="47.00" rx="0" fill="white" stroke="#d8d2ca"/><text x="62.47" y="259.48" font-size="20.00" font-weight="400" fill="#191919">二德子打人</text><rect x="452.79" y="231.88" width="938.74" height="47.00" rx="0" fill="white" stroke="#d8d2ca"/><text x="464.79" y="259.48" font-size="20.00" font-weight="400" fill="#191919">官府残酷迫害百姓</text><rect x="50.47" y="278.88" width="402.32" height="47.00" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="62.47" y="306.48" font-size="20.00" font-weight="400" fill="#191919">马五爷施威</text><rect x="452.79" y="278.88" width="938.74" height="47.00" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="464.79" y="306.48" font-size="20.00" font-weight="400" fill="#191919">帝国主义的势力庞大</text><rect x="50.47" y="325.88" width="402.32" height="47.00" rx="0" fill="white" stroke="#d8d2ca"/><text x="62.47" y="353.48" font-size="20.00" font-weight="400" fill="#191919">康六卖女</text><rect x="452.79" y="325.88" width="938.74" height="47.00" rx="0" fill="white" stroke="#d8d2ca"/><text x="464.79" y="353.48" font-size="20.00" font-weight="400" fill="#191919">农村经济破产，农民走投无路</text><rect x="50.47" y="372.88" width="402.32" height="47.00" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="62.47" y="400.48" font-size="20.00" font-weight="400" fill="#191919">刘麻子卖洋货</text><rect x="452.79" y="372.88" width="938.74" height="47.00" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="464.79" y="400.48" font-size="20.00" font-weight="400" fill="#191919">洋货大量倾销、帝国主义的经济侵略</text><rect x="50.47" y="419.88" width="402.32" height="47.00" rx="0" fill="white" stroke="#d8d2ca"/><text x="62.47" y="447.48" font-size="20.00" font-weight="400" fill="#191919">鸽子之争</text><rect x="452.79" y="419.88" width="938.74" height="47.00" rx="0" fill="white" stroke="#d8d2ca"/><text x="464.79" y="447.48" font-size="20.00" font-weight="400" fill="#191919">豪门骄奢，人不如鸽，百姓生活在水深火热中</text><rect x="50.47" y="466.88" width="402.32" height="47.00" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="62.47" y="494.48" font-size="20.00" font-weight="400" fill="#191919">秦仲义梦想实业救国</text><rect x="452.79" y="466.88" width="938.74" height="47.00" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="464.79" y="494.48" font-size="20.00" font-weight="400" fill="#191919">民族资本家兴起，但力量薄弱</text><rect x="50.47" y="513.88" width="402.32" height="47.00" rx="0" fill="white" stroke="#d8d2ca"/><text x="62.47" y="541.48" font-size="20.00" font-weight="400" fill="#191919">秦庞交锋</text><rect x="452.79" y="513.88" width="938.74" height="47.00" rx="0" fill="white" stroke="#d8d2ca"/><text x="464.79" y="541.48" font-size="20.00" font-weight="400" fill="#191919">民族资本家和封建势力的博弈、斗争</text><rect x="50.47" y="560.88" width="402.32" height="47.00" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="62.47" y="588.48" font-size="20.00" font-weight="400" fill="#191919">茶客对话</text><rect x="452.79" y="560.88" width="938.74" height="47.00" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="464.79" y="588.48" font-size="20.00" font-weight="400" fill="#191919">百姓对变法漠不关心，维新运动脱离群众</text><rect x="50.47" y="607.88" width="402.32" height="47.00" rx="0" fill="white" stroke="#d8d2ca"/><text x="62.47" y="635.48" font-size="20.00" font-weight="400" fill="#191919">常四爷被抓走</text><rect x="452.79" y="607.88" width="938.74" height="47.00" rx="0" fill="white" stroke="#d8d2ca"/><text x="464.79" y="635.48" font-size="20.00" font-weight="400" fill="#191919">封建统治下的言论不自由，好人遭殃</text><rect x="50.47" y="654.88" width="402.32" height="47.00" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="62.47" y="682.48" font-size="20.00" font-weight="400" fill="#191919">庞太监买妻</text><rect x="452.79" y="654.88" width="938.74" height="47.00" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="464.79" y="682.48" font-size="20.00" font-weight="400" fill="#191919">封建势力腐朽没落，荒淫无耻</text></g></svg>