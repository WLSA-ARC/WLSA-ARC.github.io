<svg xmlns="http://www.w3.org/2000/svg" width="852" height="455" viewBox="0 0 852 455" role="img"><title>卷轴画式的平面结构</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8f1717"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="34.08" y="40.95" font-size="30.43" font-weight="700" fill="#8f1717">卷轴画式的平面结构</text><rect x="34.08" y="72.80" width="249.92" height="341.25" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="52.08" y="104.75" font-size="24.49" font-weight="700" fill="#8f1717">人物与情节</text><text x="52.08" y="149.98" font-size="21.30" font-weight="400" fill="#191919">没有统一的情节，也没</text><text x="52.08" y="182.36" font-size="21.30" font-weight="400" fill="#191919">有一个中心人物；人物</text><text x="52.08" y="214.73" font-size="21.30" font-weight="400" fill="#191919">陆续展出，情节逐个嵌</text><text x="52.08" y="247.11" font-size="21.30" font-weight="400" fill="#191919">入。</text><rect x="301.04" y="72.80" width="249.92" height="341.25" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="319.04" y="104.75" font-size="24.49" font-weight="700" fill="#8f1717">舞台与社会</text><text x="319.04" y="149.98" font-size="21.30" font-weight="400" fill="#191919">展现社会生活的横截</text><text x="319.04" y="182.36" font-size="21.30" font-weight="400" fill="#191919">面，如同画卷逐渐展</text><text x="319.04" y="214.73" font-size="21.30" font-weight="400" fill="#191919">开。</text><rect x="568.00" y="72.80" width="249.92" height="341.25" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="586.00" y="104.75" font-size="24.49" font-weight="700" fill="#8f1717">联系</text><text x="586.00" y="149.98" font-size="21.30" font-weight="400" fill="#191919">人物虽多，大多单线联</text><text x="586.00" y="182.36" font-size="21.30" font-weight="400" fill="#191919">系，故事较为独立。</text></g></svg>