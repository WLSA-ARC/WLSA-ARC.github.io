<svg xmlns="http://www.w3.org/2000/svg" width="926" height="517" viewBox="0 0 926 517" role="img"><title>松二爷｜晚清旗人</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8f1717"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="37.04" y="46.53" font-size="33.07" font-weight="700" fill="#8f1717">松二爷｜晚清旗人</text><rect x="32.41" y="93.06" width="206.68" height="46.01" rx="0" fill="#8f1717" stroke="#d8d2ca"/><text x="44.41" y="119.82" font-size="19.29" font-weight="700" fill="white">性格特征</text><rect x="239.09" y="93.06" width="654.50" height="46.01" rx="0" fill="#8f1717" stroke="#d8d2ca"/><text x="251.09" y="119.82" font-size="19.29" font-weight="700" fill="white">人物言行与含义</text><rect x="32.41" y="139.07" width="206.68" height="73.02" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="44.41" y="165.83" font-size="19.29" font-weight="400" fill="#191919">懒散无能</text><rect x="239.09" y="139.07" width="654.50" height="73.02" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="251.09" y="165.83" font-size="19.29" font-weight="400" fill="#191919">爱鸟、爱表，悠哉度日。清朝灭亡前，他游手好闲，整日喝茶玩鸟。清亡</text><text x="251.09" y="192.84" font-size="19.29" font-weight="400" fill="#191919">后，“铁杆庄稼”没有了，但他仍然留恋过去的生活，不愿自食其力。</text><rect x="32.41" y="212.08" width="206.68" height="73.02" rx="0" fill="white" stroke="#d8d2ca"/><text x="44.41" y="238.85" font-size="19.29" font-weight="400" fill="#191919">善良却胆小怯懦</text><rect x="239.09" y="212.08" width="654.50" height="73.02" rx="0" fill="white" stroke="#d8d2ca"/><text x="251.09" y="238.85" font-size="19.29" font-weight="400" fill="#191919">心眼好，但胆小怕事。前面试着调节常四爷与二德子的争执，结尾也有常四</text><text x="251.09" y="265.86" font-size="19.29" font-weight="400" fill="#191919">爷解围，但最终也承认了“我听见了，他是说……”。</text><text x="32.41" y="326.04" font-size="19.29" font-weight="400" fill="#555">缺乏谋生能力、留恋旧时代、无力适应新时代的晚清遗老。</text></g></svg>