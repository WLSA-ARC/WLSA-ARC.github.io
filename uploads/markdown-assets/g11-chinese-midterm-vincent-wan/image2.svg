<svg xmlns="http://www.w3.org/2000/svg" width="1267" height="944" viewBox="0 0 1267 944" role="img"><title>《氓》原文与重点字音</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8f1717"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50.68" y="84.96" font-size="42.00" font-weight="700" fill="#8f1717">《氓》原文与重点字音</text><text x="57.02" y="160.48" font-size="29.00" font-weight="400" fill="#191919">氓之蚩蚩，抱布贸丝。匪来贸丝，来即我谋。送子涉淇，至于顿丘。匪我愆期，子无良</text><text x="57.02" y="203.40" font-size="29.00" font-weight="400" fill="#191919">媒。将子无怒，秋以为期。</text><text x="57.02" y="259.32" font-size="29.00" font-weight="400" fill="#191919">乘彼垝垣，以望复关。不见复关，泣涕涟涟。既见复关，载笑载言。尔卜尔筮，体无咎</text><text x="57.02" y="302.24" font-size="29.00" font-weight="400" fill="#191919">言。以尔车来，以我贿迁。</text><text x="57.02" y="358.16" font-size="29.00" font-weight="400" fill="#191919">桑之未落，其叶沃若。于嗟鸠兮，无食桑葚！于嗟女兮，无与士耽！士之耽兮，犹可说</text><text x="57.02" y="401.08" font-size="29.00" font-weight="400" fill="#191919">也。女之耽兮，不可说也！</text><text x="57.02" y="457.00" font-size="29.00" font-weight="400" fill="#191919">桑之落矣，其黄而陨。自我徂尔，三岁食贫。淇水汤汤，渐车帷裳。女也不爽，士贰其</text><text x="57.02" y="499.92" font-size="29.00" font-weight="400" fill="#191919">行。士也罔极，二三其德。</text><text x="57.02" y="555.84" font-size="29.00" font-weight="400" fill="#191919">三岁为妇，靡室劳矣。夙兴夜寐，靡有朝矣。言既遂矣，至于暴矣。兄弟不知，咥其笑</text><text x="57.02" y="598.76" font-size="29.00" font-weight="400" fill="#191919">矣。静言思之，躬自悼矣。</text><text x="57.02" y="654.68" font-size="29.00" font-weight="400" fill="#191919">及尔偕老，老使我怨。淇则有岸，隰则有泮。总角之宴，言笑晏晏。信誓旦旦，不思其</text><text x="57.02" y="697.60" font-size="29.00" font-weight="400" fill="#191919">反。反是不思，亦已焉哉！</text><text x="57.02" y="761.52" font-size="24.65" font-weight="700" fill="#8f1717">重点字音</text><text x="57.02" y="802.82" font-size="21.75" font-weight="400" fill="#555">蚩 chī；淇 qí；匪 fēi；愆 qiān；将 qiāng；垝垣 guǐ yuán；涟 lián；筮 shì；于嗟鸠 xū jiē jiū；耽 dān；说 tuō；</text><text x="57.02" y="835.88" font-size="21.75" font-weight="400" fill="#555">陨 yǔn；徂 cú；汤汤 shāng shāng；渐 jiān；贰 èr；罔 wǎng；靡 mǐ；朝 zhāo；咥 xì；隰 xí。</text></g></svg>