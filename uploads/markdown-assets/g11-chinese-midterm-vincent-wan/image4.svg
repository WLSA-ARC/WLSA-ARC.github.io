<svg xmlns="http://www.w3.org/2000/svg" width="1267" height="702" viewBox="0 0 1267 702" role="img"><title>老舍：代表作品</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8f1717"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50.68" y="63.18" font-size="42.00" font-weight="700" fill="#8f1717">老舍：代表作品</text><rect x="44.35" y="126.36" width="235.66" height="55.95" rx="0" fill="#8f1717" stroke="#d8d2ca"/><text x="56.35" y="161.51" font-size="26.40" font-weight="700" fill="white">类别</text><rect x="280.01" y="126.36" width="942.65" height="55.95" rx="0" fill="#8f1717" stroke="#d8d2ca"/><text x="292.01" y="161.51" font-size="26.40" font-weight="700" fill="white">作品</text><rect x="44.35" y="182.31" width="235.66" height="55.95" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="56.35" y="217.46" font-size="26.40" font-weight="400" fill="#191919">长篇小说</text><rect x="280.01" y="182.31" width="942.65" height="55.95" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="292.01" y="217.46" font-size="26.40" font-weight="400" fill="#191919">《老张的哲学》、《离婚》、《骆驼祥子》、《四世同堂》……</text><rect x="44.35" y="238.27" width="235.66" height="55.95" rx="0" fill="white" stroke="#d8d2ca"/><text x="56.35" y="273.42" font-size="26.40" font-weight="400" fill="#191919">中篇小说</text><rect x="280.01" y="238.27" width="942.65" height="55.95" rx="0" fill="white" stroke="#d8d2ca"/><text x="292.01" y="273.42" font-size="26.40" font-weight="400" fill="#191919">《月牙儿》、《我这一辈子》……</text><rect x="44.35" y="294.22" width="235.66" height="55.95" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="56.35" y="329.37" font-size="26.40" font-weight="400" fill="#191919">短篇小说</text><rect x="280.01" y="294.22" width="942.65" height="55.95" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="292.01" y="329.37" font-size="26.40" font-weight="400" fill="#191919">《柳家大院》、《断魂枪》……</text><rect x="44.35" y="350.18" width="235.66" height="55.95" rx="0" fill="white" stroke="#d8d2ca"/><text x="56.35" y="385.32" font-size="26.40" font-weight="400" fill="#191919">剧本</text><rect x="280.01" y="350.18" width="942.65" height="55.95" rx="0" fill="white" stroke="#d8d2ca"/><text x="292.01" y="385.32" font-size="26.40" font-weight="400" fill="#191919">《龙须沟》、《茶馆》、《方珍珠》……</text><text x="44.35" y="457.72" font-size="23.00" font-weight="400" fill="#555">约800万字作品；幽默风格、民族色彩、雅俗共赏。</text></g></svg>