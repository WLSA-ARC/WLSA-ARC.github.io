<svg xmlns="http://www.w3.org/2000/svg" width="1268" height="678" viewBox="0 0 1268 678" role="img"><title>如何评价《茶馆》第一幕？</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8f1717"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50.72" y="61.02" font-size="42.00" font-weight="700" fill="#8f1717">如何评价《茶馆》第一幕？</text><rect x="50.72" y="108.48" width="1166.56" height="152.59" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="68.72" y="151.23" font-size="32.77" font-weight="700" fill="#8f1717">评价</text><text x="68.72" y="209.05" font-size="28.50" font-weight="400" fill="#191919">曹禺称赞《茶馆》第一幕是“古今中外剧作中罕见的第一幕”。</text><rect x="50.72" y="286.43" width="1166.56" height="152.59" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="68.72" y="329.18" font-size="32.77" font-weight="700" fill="#8f1717">三种理解</text><text x="68.72" y="387.00" font-size="28.50" font-weight="400" fill="#191919">“大茶馆小社会”的构思；“召之即来，挥之即去”的编剧手法；对事件与情节的处理。</text><rect x="50.72" y="464.39" width="1166.56" height="152.59" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="68.72" y="507.14" font-size="32.77" font-weight="700" fill="#8f1717">思考</text><text x="68.72" y="564.95" font-size="28.50" font-weight="400" fill="#191919">你赞成哪一种观点？为什么？</text></g></svg>