<svg xmlns="http://www.w3.org/2000/svg" width="1034" height="537" viewBox="0 0 1034 537" role="img"><title>人物群像：社会病态</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8f1717"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="41.36" y="48.33" font-size="36.93" font-weight="700" fill="#8f1717">人物群像：社会病态</text><rect x="41.36" y="85.92" width="303.31" height="402.75" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="59.36" y="124.70" font-size="29.73" font-weight="700" fill="#8f1717">唐铁嘴</text><text x="59.36" y="177.88" font-size="25.85" font-weight="400" fill="#191919">麻衣相士，算命骗人混</text><text x="59.36" y="217.17" font-size="25.85" font-weight="400" fill="#191919">吃混喝（反映社会中的</text><text x="59.36" y="256.46" font-size="25.85" font-weight="400" fill="#191919">迷信落后思想）</text><rect x="365.35" y="85.92" width="303.31" height="402.75" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="383.35" y="124.70" font-size="29.73" font-weight="700" fill="#8f1717">刘麻子</text><text x="383.35" y="177.88" font-size="25.85" font-weight="400" fill="#191919">说媒拉纤、拐卖人口赚</text><text x="383.35" y="217.17" font-size="25.85" font-weight="400" fill="#191919">昧心钱（社会中地痞流</text><text x="383.35" y="256.46" font-size="25.85" font-weight="400" fill="#191919">氓为非作歹的代表）</text><rect x="689.33" y="85.92" width="303.31" height="402.75" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="707.33" y="124.70" font-size="29.73" font-weight="700" fill="#8f1717">宋恩子、吴祥子</text><text x="707.33" y="177.88" font-size="25.85" font-weight="400" fill="#191919">封建势力的走狗，衙门</text><text x="707.33" y="217.17" font-size="25.85" font-weight="400" fill="#191919">的侦缉（特务），顺风</text><text x="707.33" y="256.46" font-size="25.85" font-weight="400" fill="#191919">倒的奸邪小人，坑害别</text><text x="707.33" y="295.76" font-size="25.85" font-weight="400" fill="#191919">人，钻营偷生</text><text x="41.36" y="526.26" font-size="19.15" font-weight="400" fill="#555">社会底层的地痞无赖：反映社会的畸形与病态。</text></g></svg>