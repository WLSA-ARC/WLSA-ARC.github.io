<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="638" viewBox="0 0 1270 638" role="img"><title>G11 语文期中考试：题型与复习范围</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8f1717"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50.80" y="57.42" font-size="42.00" font-weight="700" fill="#8f1717">G11 语文期中考试：题型与复习范围</text><rect x="44.45" y="114.84" width="94.49" height="50.44" rx="0" fill="#8f1717" stroke="#d8d2ca"/><text x="56.45" y="145.34" font-size="22.46" font-weight="700" fill="white">序号</text><rect x="138.94" y="114.84" width="177.16" height="50.44" rx="0" fill="#8f1717" stroke="#d8d2ca"/><text x="150.94" y="145.34" font-size="22.46" font-weight="700" fill="white">题型</text><rect x="316.10" y="114.84" width="212.60" height="50.44" rx="0" fill="#8f1717" stroke="#d8d2ca"/><text x="328.10" y="145.34" font-size="22.46" font-weight="700" fill="white">分值</text><rect x="528.70" y="114.84" width="696.85" height="50.44" rx="0" fill="#8f1717" stroke="#d8d2ca"/><text x="540.70" y="145.34" font-size="22.46" font-weight="700" fill="white">说明</text><rect x="44.45" y="165.28" width="94.49" height="50.44" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="56.45" y="195.78" font-size="22.46" font-weight="400" fill="#191919">一</text><rect x="138.94" y="165.28" width="177.16" height="50.44" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="150.94" y="195.78" font-size="22.46" font-weight="400" fill="#191919">选择题</text><rect x="316.10" y="165.28" width="212.60" height="50.44" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="328.10" y="195.78" font-size="22.46" font-weight="400" fill="#191919">10分</text><rect x="528.70" y="165.28" width="696.85" height="50.44" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="540.70" y="195.78" font-size="22.46" font-weight="400" fill="#191919">每题2分，请将答案填到答题卡相应区域内</text><rect x="44.45" y="215.72" width="94.49" height="50.44" rx="0" fill="white" stroke="#d8d2ca"/><text x="56.45" y="246.22" font-size="22.46" font-weight="400" fill="#191919">二</text><rect x="138.94" y="215.72" width="177.16" height="50.44" rx="0" fill="white" stroke="#d8d2ca"/><text x="150.94" y="246.22" font-size="22.46" font-weight="400" fill="#191919">填空题</text><rect x="316.10" y="215.72" width="212.60" height="50.44" rx="0" fill="white" stroke="#d8d2ca"/><text x="328.10" y="246.22" font-size="22.46" font-weight="400" fill="#191919">20分</text><rect x="528.70" y="215.72" width="696.85" height="50.44" rx="0" fill="white" stroke="#d8d2ca"/><text x="540.70" y="246.22" font-size="22.46" font-weight="400" fill="#191919">每空2分，字迹清晰，请将答案填到答题卡相应区域内</text><rect x="44.45" y="266.16" width="94.49" height="50.44" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="56.45" y="296.67" font-size="22.46" font-weight="400" fill="#191919">三</text><rect x="138.94" y="266.16" width="177.16" height="50.44" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="150.94" y="296.67" font-size="22.46" font-weight="400" fill="#191919">判断题</text><rect x="316.10" y="266.16" width="212.60" height="50.44" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="328.10" y="296.67" font-size="22.46" font-weight="400" fill="#191919">10分</text><rect x="528.70" y="266.16" width="696.85" height="50.44" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="540.70" y="296.67" font-size="22.46" font-weight="400" fill="#191919">请将答案（“√”或“×”）填到题目下方的相应区域内</text><rect x="44.45" y="316.61" width="94.49" height="81.88" rx="0" fill="white" stroke="#d8d2ca"/><text x="56.45" y="347.11" font-size="22.46" font-weight="400" fill="#191919">四</text><rect x="138.94" y="316.61" width="177.16" height="81.88" rx="0" fill="white" stroke="#d8d2ca"/><text x="150.94" y="347.11" font-size="22.46" font-weight="400" fill="#191919">问答题</text><rect x="316.10" y="316.61" width="212.60" height="81.88" rx="0" fill="white" stroke="#d8d2ca"/><text x="328.10" y="347.11" font-size="22.46" font-weight="400" fill="#191919">8分+7分=15分</text><rect x="528.70" y="316.61" width="696.85" height="81.88" rx="0" fill="white" stroke="#d8d2ca"/><text x="540.70" y="347.11" font-size="22.46" font-weight="400" fill="#191919">1. 认真审题，根据文章内容，按照题目要求答题；2. 答案有组织、有</text><text x="540.70" y="378.55" font-size="22.46" font-weight="400" fill="#191919">层次、有逻辑；3. 只涉及《茶馆》相关内容</text><rect x="44.45" y="398.49" width="94.49" height="50.44" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="56.45" y="428.99" font-size="22.46" font-weight="400" fill="#191919">五</text><rect x="138.94" y="398.49" width="177.16" height="50.44" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="150.94" y="428.99" font-size="22.46" font-weight="400" fill="#191919">写作表达</text><rect x="316.10" y="398.49" width="212.60" height="50.44" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="328.10" y="428.99" font-size="22.46" font-weight="400" fill="#191919">45分</text><rect x="528.70" y="398.49" width="696.85" height="50.44" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="540.70" y="428.99" font-size="22.46" font-weight="400" fill="#191919">1. 写作与所学文章有关；2. 观点表达式文章，300–350字</text><rect x="44.45" y="448.93" width="94.49" height="50.44" rx="0" fill="white" stroke="#d8d2ca"/><text x="56.45" y="479.43" font-size="22.46" font-weight="400" fill="#191919">总分</text><rect x="138.94" y="448.93" width="177.16" height="50.44" rx="0" fill="white" stroke="#d8d2ca"/><text x="150.94" y="479.43" font-size="22.46" font-weight="400" fill="#191919"></text><rect x="316.10" y="448.93" width="212.60" height="50.44" rx="0" fill="white" stroke="#d8d2ca"/><text x="328.10" y="479.43" font-size="22.46" font-weight="400" fill="#191919">100分（60min）</text><rect x="528.70" y="448.93" width="696.85" height="50.44" rx="0" fill="white" stroke="#d8d2ca"/><text x="540.70" y="479.43" font-size="22.46" font-weight="400" fill="#191919"></text><text x="44.45" y="545.06" font-size="22.46" font-weight="400" fill="#555">《氓》：字音字义、《诗经》、先秦文化、人物、赋比兴、中西比较。</text><text x="44.45" y="579.20" font-size="22.46" font-weight="400" fill="#555">《茶馆》：第一幕剧情人物、时代背景、台词、文学常识与潜台词。</text></g></svg>