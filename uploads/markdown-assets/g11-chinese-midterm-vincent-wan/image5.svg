<svg xmlns="http://www.w3.org/2000/svg" width="1097" height="614" viewBox="0 0 1097 614" role="img"><title>话剧与剧本</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8f1717"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="43.88" y="55.26" font-size="39.18" font-weight="700" fill="#8f1717">话剧与剧本</text><rect x="43.88" y="98.24" width="1009.24" height="219.28" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="61.88" y="139.38" font-size="31.54" font-weight="700" fill="#8f1717">话剧</text><text x="61.88" y="195.32" font-size="27.43" font-weight="400" fill="#191919">以演员的对话和动作为主要表现手段的戏剧形式，具有舞台性、直观性、综合性、</text><text x="61.88" y="237.00" font-size="27.43" font-weight="400" fill="#191919">对话性等特点。</text><rect x="43.88" y="339.46" width="1009.24" height="219.28" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="61.88" y="380.60" font-size="31.54" font-weight="700" fill="#8f1717">剧本</text><text x="61.88" y="436.54" font-size="27.43" font-weight="400" fill="#191919">文学作品中的一种体裁，指戏剧艺术的文学部分，它直接规定了戏剧的题材、主</text><text x="61.88" y="478.22" font-size="27.43" font-weight="400" fill="#191919">题、人物、情节、语言和结构，是戏剧演出的基础和依据。</text></g></svg>