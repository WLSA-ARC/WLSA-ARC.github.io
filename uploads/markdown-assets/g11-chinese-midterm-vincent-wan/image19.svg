<svg xmlns="http://www.w3.org/2000/svg" width="1115" height="609" viewBox="0 0 1115 609" role="img"><title>潜台词：马五爷与王利发</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8f1717"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="44.60" y="54.81" font-size="39.82" font-weight="700" fill="#8f1717">潜台词：马五爷与王利发</text><rect x="44.60" y="97.44" width="1025.80" height="217.23" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="62.60" y="139.25" font-size="32.06" font-weight="700" fill="#8f1717">① 马五爷：“二德子，你威风啊！”</text><text x="62.60" y="195.98" font-size="27.88" font-weight="400" fill="#191919">这句话把马五爷的威势凸显出来，而这威势不过是依仗洋教的庇护，暗示当时帝</text><text x="62.60" y="238.35" font-size="27.88" font-weight="400" fill="#191919">国主义在中国的威风。</text><rect x="44.60" y="336.97" width="1025.80" height="217.23" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="62.60" y="378.78" font-size="32.06" font-weight="700" fill="#8f1717">② 王利发：“坐下！我告诉你，你要是不戒了大烟，就永远交不了好</text><text x="62.60" y="427.50" font-size="32.06" font-weight="700" fill="#8f1717">运！这是我的相法，比你的更灵验！”</text><text x="62.60" y="484.23" font-size="27.88" font-weight="400" fill="#191919">侧面交代了一个社会现实：清朝末年，鸦片战争失败，清政府腐败，大量鸦片流</text><text x="62.60" y="526.60" font-size="27.88" font-weight="400" fill="#191919">入中国，腐蚀着中国人民的身体和灵魂。</text></g></svg>