<svg xmlns="http://www.w3.org/2000/svg" width="1079" height="626" viewBox="0 0 1079 626" role="img"><title>人物群像：社会病态</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8f1717"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="43.16" y="56.34" font-size="38.54" font-weight="700" fill="#8f1717">人物群像：社会病态</text><rect x="43.16" y="100.16" width="316.51" height="469.50" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="61.16" y="140.62" font-size="31.02" font-weight="700" fill="#8f1717">庞太监</text><text x="61.16" y="195.77" font-size="26.98" font-weight="400" fill="#191919">晚清宫廷生活的糜烂与</text><text x="61.16" y="236.78" font-size="26.98" font-weight="400" fill="#191919">荒唐</text><rect x="381.25" y="100.16" width="316.51" height="469.50" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="399.25" y="140.62" font-size="31.02" font-weight="700" fill="#8f1717">二德子</text><text x="399.25" y="195.77" font-size="26.98" font-weight="400" fill="#191919">营子里的打手；鱼肉百</text><text x="399.25" y="236.78" font-size="26.98" font-weight="400" fill="#191919">姓的典型</text><rect x="719.33" y="100.16" width="316.51" height="469.50" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="737.33" y="140.62" font-size="31.02" font-weight="700" fill="#8f1717">黄胖子</text><text x="737.33" y="195.77" font-size="26.98" font-weight="400" fill="#191919">专门调解“官厅儿”不</text><text x="737.33" y="236.78" font-size="26.98" font-weight="400" fill="#191919">管的纠纷，地痞流氓的</text><text x="737.33" y="277.78" font-size="26.98" font-weight="400" fill="#191919">典型</text><text x="43.16" y="613.48" font-size="19.98" font-weight="400" fill="#555">社会底层的地痞无赖：反映社会的畸形与病态。</text></g></svg>