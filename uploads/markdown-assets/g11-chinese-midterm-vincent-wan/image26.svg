<svg xmlns="http://www.w3.org/2000/svg" width="998" height="569" viewBox="0 0 998 569" role="img"><title>京味儿语言</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8f1717"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="39.92" y="51.21" font-size="35.64" font-weight="700" fill="#8f1717">京味儿语言</text><text x="39.92" y="113.80" font-size="26.26" font-weight="400" fill="#191919">1. 你外边蹓蹓吧。</text><text x="39.92" y="216.22" font-size="26.26" font-weight="400" fill="#191919">2. 你就甭卖那套生意口了。</text><text x="39.92" y="318.64" font-size="26.26" font-weight="400" fill="#191919">3. 你这是对谁甩闲话呢？</text><text x="39.92" y="421.06" font-size="26.26" font-weight="400" fill="#191919">4. 尊家吃着官饷。</text><text x="528.94" y="113.80" font-size="26.26" font-weight="400" fill="#191919">5. 我可眼拙，没看见您！</text><text x="528.94" y="216.22" font-size="26.26" font-weight="400" fill="#191919">6. 这位爷，您圣明，您给评评理！</text><text x="528.94" y="318.64" font-size="26.26" font-weight="400" fill="#191919">7. 也甜不到哪儿去，弄好了，赚个元</text><text x="528.94" y="359.35" font-size="26.26" font-weight="400" fill="#191919">宝。</text><text x="528.94" y="421.06" font-size="26.26" font-weight="400" fill="#191919">8. 我老觉乎着咱们的大缎子，川绸，</text><text x="528.94" y="461.77" font-size="26.26" font-weight="400" fill="#191919">更体面。</text></g></svg>