<svg xmlns="http://www.w3.org/2000/svg" width="1269" height="674" viewBox="0 0 1269 674" role="img"><title>大茶馆，小社会</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8f1717"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50.76" y="60.66" font-size="42.00" font-weight="700" fill="#8f1717">大茶馆，小社会</text><rect x="50.76" y="107.84" width="372.24" height="505.50" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="68.76" y="151.34" font-size="33.35" font-weight="700" fill="#8f1717">场景</text><text x="68.76" y="210.03" font-size="29.00" font-weight="400" fill="#191919">裕泰茶馆，汇集三教九流</text><text x="68.76" y="254.11" font-size="29.00" font-weight="400" fill="#191919">与各色人物。</text><rect x="448.38" y="107.84" width="372.24" height="505.50" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="466.38" y="151.34" font-size="33.35" font-weight="700" fill="#8f1717">叙事</text><text x="466.38" y="210.03" font-size="29.00" font-weight="400" fill="#191919">在狭小空间里，通过人事</text><text x="466.38" y="254.11" font-size="29.00" font-weight="400" fill="#191919">与生活变迁反映社会变</text><text x="466.38" y="298.19" font-size="29.00" font-weight="400" fill="#191919">迁。</text><rect x="846.00" y="107.84" width="372.24" height="505.50" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="864.00" y="151.34" font-size="33.35" font-weight="700" fill="#8f1717">主题</text><text x="864.00" y="210.03" font-size="29.00" font-weight="400" fill="#191919">清末社会黑暗腐朽；从小</text><text x="864.00" y="254.11" font-size="29.00" font-weight="400" fill="#191919">茶馆透视时代的政治全</text><text x="864.00" y="298.19" font-size="29.00" font-weight="400" fill="#191919">貌。</text></g></svg>