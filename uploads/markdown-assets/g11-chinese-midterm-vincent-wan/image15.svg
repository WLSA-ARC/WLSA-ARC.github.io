<svg xmlns="http://www.w3.org/2000/svg" width="994" height="545" viewBox="0 0 994 545" role="img"><title>秦仲义｜民族资本家、茶馆房东</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8f1717"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="39.76" y="49.05" font-size="35.50" font-weight="700" fill="#8f1717">秦仲义｜民族资本家、茶馆房东</text><rect x="34.79" y="98.10" width="221.86" height="47.99" rx="0" fill="#8f1717" stroke="#d8d2ca"/><text x="46.79" y="126.54" font-size="20.71" font-weight="700" fill="white">性格特征</text><rect x="256.65" y="98.10" width="702.56" height="47.99" rx="0" fill="#8f1717" stroke="#d8d2ca"/><text x="268.65" y="126.54" font-size="20.71" font-weight="700" fill="white">人物言行与含义</text><rect x="34.79" y="146.09" width="221.86" height="76.98" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="46.79" y="174.53" font-size="20.71" font-weight="400" fill="#191919">胸怀实业救国理想</text><rect x="256.65" y="146.09" width="702.56" height="76.98" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="268.65" y="174.53" font-size="20.71" font-weight="400" fill="#191919">开玩笑说要收回房子办实业，他梦想通过办大工厂搞民族工业来救国，胸</text><text x="268.65" y="203.52" font-size="20.71" font-weight="400" fill="#191919">怀理想，要做大事，最后却没有逃脱破产的厄运。</text><rect x="34.79" y="223.07" width="221.86" height="76.98" rx="0" fill="white" stroke="#d8d2ca"/><text x="46.79" y="251.51" font-size="20.71" font-weight="400" fill="#191919">敢于反抗</text><rect x="256.65" y="223.07" width="702.56" height="76.98" rx="0" fill="white" stroke="#d8d2ca"/><text x="268.65" y="251.51" font-size="20.71" font-weight="400" fill="#191919">在于庞太监的交锋中，言语犀利，分寸不让，体现了对封建势力的反抗，</text><text x="268.65" y="280.50" font-size="20.71" font-weight="400" fill="#191919">也体现了民族资产阶级的发展和成长。</text><text x="34.79" y="343.12" font-size="20.71" font-weight="400" fill="#555">半封建半殖民地社会民族资本家的命运：实业救国理想最终失败；黑暗中的一道微光。</text></g></svg>