<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="588" viewBox="0 0 1100 588" role="img"><title>潜台词：庞太监与茶客</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8f1717"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="44.00" y="52.92" font-size="39.29" font-weight="700" fill="#8f1717">潜台词：庞太监与茶客</text><rect x="44.00" y="94.08" width="1012.00" height="209.50" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="62.00" y="135.33" font-size="31.62" font-weight="700" fill="#8f1717">⑤ 庞太监：“我要活的，可不要死的！”</text><text x="62.00" y="191.40" font-size="27.50" font-weight="400" fill="#191919">庞太监对买来的“妻子”没有任何同情，在他心中，这只是一个活的玩物而</text><text x="62.00" y="233.20" font-size="27.50" font-weight="400" fill="#191919">已。再次写出庞太监荒淫无耻、狠毒奸诈，没有一点人性和同情心。</text><rect x="44.00" y="325.58" width="1012.00" height="209.50" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="62.00" y="366.83" font-size="31.62" font-weight="700" fill="#8f1717">⑥ 茶客甲：“将！你完啦！”</text><text x="62.00" y="422.90" font-size="27.50" font-weight="400" fill="#191919">这是一句典型的一语双关的台词，它既表示一局棋已经下完，也更点明了一个</text><text x="62.00" y="464.70" font-size="27.50" font-weight="400" fill="#191919">时代的终结：封建社会已经走到尽头。</text></g></svg>