<svg xmlns="http://www.w3.org/2000/svg" width="1267" height="698" viewBox="0 0 1267 698" role="img"><title>《茶馆》的创作构思</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8f1717"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50.68" y="62.82" font-size="42.00" font-weight="700" fill="#8f1717">《茶馆》的创作构思</text><rect x="50.68" y="111.68" width="1165.64" height="523.50" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="68.68" y="155.18" font-size="33.35" font-weight="700" fill="#8f1717">老舍：一个大茶馆，就是一个小社会</text><text x="68.68" y="213.87" font-size="29.00" font-weight="400" fill="#191919">“茶馆是三教九流会面之处，可以容纳各色人物，一个大茶馆就是一个小社会。这出戏</text><text x="68.68" y="257.95" font-size="29.00" font-weight="400" fill="#191919">虽只有三幕，可是写了五十来年的变迁。我不熟悉政治舞台上的高官大人，没法子正面</text><text x="68.68" y="302.03" font-size="29.00" font-weight="400" fill="#191919">描写他们的促进与促退。我也不十分懂政治，只认识一些小人物，这些人是经常下茶馆</text><text x="68.68" y="346.11" font-size="29.00" font-weight="400" fill="#191919">的。那么，我要是把他们集合到一个茶馆里，用他们生活上的变迁反映社会的变迁，不</text><text x="68.68" y="390.19" font-size="29.00" font-weight="400" fill="#191919">就侧面地透露出一些政治消息么？这样，我就决定了去写《茶馆》。”</text></g></svg>