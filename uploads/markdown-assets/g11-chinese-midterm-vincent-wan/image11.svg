<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="738" viewBox="0 0 1270 738" role="img"><title>《茶馆》人物分类</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8f1717"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="50.80" y="66.42" font-size="42.00" font-weight="700" fill="#8f1717">《茶馆》人物分类</text><rect x="44.45" y="132.84" width="330.71" height="56.04" rx="0" fill="#8f1717" stroke="#d8d2ca"/><text x="56.45" y="168.06" font-size="26.46" font-weight="700" fill="white">身份类别</text><rect x="375.16" y="132.84" width="850.39" height="56.04" rx="0" fill="#8f1717" stroke="#d8d2ca"/><text x="387.16" y="168.06" font-size="26.46" font-weight="700" fill="white">人物</text><rect x="44.45" y="188.88" width="330.71" height="56.04" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="56.45" y="224.10" font-size="26.46" font-weight="400" fill="#191919">下层劳动人民</text><rect x="375.16" y="188.88" width="850.39" height="56.04" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="387.16" y="224.10" font-size="26.46" font-weight="400" fill="#191919">王利发、李三、康六、老人、乡妇、小妞、康顺子。</text><rect x="44.45" y="244.92" width="330.71" height="56.04" rx="0" fill="white" stroke="#d8d2ca"/><text x="56.45" y="280.14" font-size="26.46" font-weight="400" fill="#191919">有闲阶级</text><rect x="375.16" y="244.92" width="850.39" height="56.04" rx="0" fill="white" stroke="#d8d2ca"/><text x="387.16" y="280.14" font-size="26.46" font-weight="400" fill="#191919">松二爷、常四爷。</text><rect x="44.45" y="300.96" width="330.71" height="56.04" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="56.45" y="336.19" font-size="26.46" font-weight="400" fill="#191919">民族资本家</text><rect x="375.16" y="300.96" width="850.39" height="56.04" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="387.16" y="336.19" font-size="26.46" font-weight="400" fill="#191919">秦仲义。</text><rect x="44.45" y="357.01" width="330.71" height="56.04" rx="0" fill="white" stroke="#d8d2ca"/><text x="56.45" y="392.23" font-size="26.46" font-weight="400" fill="#191919">反动统治阶级的走狗</text><rect x="375.16" y="357.01" width="850.39" height="56.04" rx="0" fill="white" stroke="#d8d2ca"/><text x="387.16" y="392.23" font-size="26.46" font-weight="400" fill="#191919">二德子、马五爷、庞太监、宋恩子、吴祥子。</text><rect x="44.45" y="413.05" width="330.71" height="56.04" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="56.45" y="448.27" font-size="26.46" font-weight="400" fill="#191919">社会渣滓</text><rect x="375.16" y="413.05" width="850.39" height="56.04" rx="0" fill="#faf9f7" stroke="#d8d2ca"/><text x="387.16" y="448.27" font-size="26.46" font-weight="400" fill="#191919">唐铁嘴、刘麻子、黄胖子。</text></g></svg>