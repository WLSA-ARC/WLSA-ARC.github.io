<svg xmlns="http://www.w3.org/2000/svg" width="1007" height="462" viewBox="0 0 1007 462" role="img"><title>散点式的戏剧冲突</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8f1717"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="40.28" y="41.58" font-size="35.96" font-weight="700" fill="#8f1717">散点式的戏剧冲突</text><rect x="40.28" y="73.92" width="295.39" height="346.50" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="58.28" y="111.68" font-size="28.95" font-weight="700" fill="#8f1717">冲突形式</text><text x="58.28" y="163.69" font-size="25.18" font-weight="400" fill="#191919">没有一个贯穿全剧始终</text><text x="58.28" y="201.95" font-size="25.18" font-weight="400" fill="#191919">的戏剧冲突；每个小故</text><text x="58.28" y="240.22" font-size="25.18" font-weight="400" fill="#191919">事有自己的矛盾。</text><rect x="355.81" y="73.92" width="295.39" height="346.50" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="373.81" y="111.68" font-size="28.95" font-weight="700" fill="#8f1717">共同指向</text><text x="373.81" y="163.69" font-size="25.18" font-weight="400" fill="#191919">这些小矛盾共同指向时</text><text x="373.81" y="201.95" font-size="25.18" font-weight="400" fill="#191919">代与社会的黑暗、腐</text><text x="373.81" y="240.22" font-size="25.18" font-weight="400" fill="#191919">朽。</text><rect x="671.33" y="73.92" width="295.39" height="346.50" rx="6" fill="#f6f4f1" stroke="#d8d2ca"/><text x="689.33" y="111.68" font-size="28.95" font-weight="700" fill="#8f1717">主题作用</text><text x="689.33" y="163.69" font-size="25.18" font-weight="400" fill="#191919">表现不同阶层人们的生</text><text x="689.33" y="201.95" font-size="25.18" font-weight="400" fill="#191919">存状态，为主题服务。</text></g></svg>