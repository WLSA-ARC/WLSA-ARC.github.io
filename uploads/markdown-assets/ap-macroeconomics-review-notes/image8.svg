<svg xmlns="http://www.w3.org/2000/svg" width="1510" height="912" viewBox="0 0 1510 912" role="img"><title>4. Choose a base year and compute the index. The CPI in any year equals</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1510" height="912" fill="#fff"/><g id="text-0" data-role="text-0"><text xml:space="preserve" x="31.920" y="69.920" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">4. Choose a base year and compute the index. The CPI in any year</text><text xml:space="preserve" x="31.920" y="117.420" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">equals</text></g><g id="text-1" data-role="text-1"><text xml:space="preserve" x="31.920" y="174.420" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">100×(cost of basket in current year)/(cost of basket in base year)</text></g><g id="text-2" data-role="text-2"><text xml:space="preserve" x="31.920" y="231.420" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">5. Compute the inflation rate. The percentage change in the CPI from</text><text xml:space="preserve" x="31.920" y="278.920" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">the preceding period.</text></g><g id="text-3" data-role="text-3"><text xml:space="preserve" x="31.920" y="335.920" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">Inflation rate=(CPI this year-CPI last year)/(CPI last year)×100%</text></g></svg>