<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img"><title>How the CPI Is Calculated</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1100" height="620" fill="#fff"/><g id="heading-0" data-role="heading-0"><text xml:space="preserve" x="21.700" y="65.020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="43.320" font-weight="700" fill="#123b51" text-anchor="start">How the CPI Is Calculated</text></g><g id="text-1" data-role="text-1"><text xml:space="preserve" x="21.700" y="132.850" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">1. Fix the “basket.” The Bureau of Labor</text><text xml:space="preserve" x="21.700" y="180.350" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">Statistics (BLS) surveys consumers to determine</text><text xml:space="preserve" x="21.700" y="227.850" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">what’s in the typical consumer’s “shopping</text><text xml:space="preserve" x="21.700" y="275.350" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">basket.”</text></g><g id="text-2" data-role="text-2"><text xml:space="preserve" x="21.700" y="332.350" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">2. Find the prices. The BLS collects data on the</text><text xml:space="preserve" x="21.700" y="379.850" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">prices of all the goods in the basket.</text></g><g id="text-3" data-role="text-3"><text xml:space="preserve" x="21.700" y="436.850" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">3. Compute the basket’s cost. Use the prices to</text><text xml:space="preserve" x="21.700" y="484.350" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">compute the total cost of the basket.</text></g></svg>