<svg xmlns="http://www.w3.org/2000/svg" width="1033" height="803" viewBox="0 0 1033 803" role="img"><title>1. Labor Force（劳动力）</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1033" height="803" fill="#fff"/><g id="text-0" data-role="text-0"><text xml:space="preserve" x="28.105" y="64.998" font-family="Arial, Microsoft YaHei, sans-serif" font-size="36.893" font-weight="400" fill="#123b51" text-anchor="start">1. Labor Force（劳动力）</text></g><g id="text-1" data-role="text-1"><text xml:space="preserve" x="28.105" y="120.337" font-family="Arial, Microsoft YaHei, sans-serif" font-size="36.893" font-weight="400" fill="#123b51" text-anchor="start">Labor Force=Employed+Unemployed</text></g><g id="text-2" data-role="text-2"><text xml:space="preserve" x="28.105" y="175.676" font-family="Arial, Microsoft YaHei, sans-serif" font-size="36.893" font-weight="400" fill="#123b51" text-anchor="start">失业者是指没有工作、能够工作并且正在积极找工作的人。</text></g><g id="text-3" data-role="text-3"><text xml:space="preserve" x="28.105" y="231.016" font-family="Arial, Microsoft YaHei, sans-serif" font-size="36.893" font-weight="400" fill="#123b51" text-anchor="start">不找工作的人通常被归为 Not in the Labor</text><text xml:space="preserve" x="28.105" y="277.132" font-family="Arial, Microsoft YaHei, sans-serif" font-size="36.893" font-weight="400" fill="#123b51" text-anchor="start">Force（非劳动力人口），而不是 Unemployed。</text></g><g id="text-4" data-role="text-4"><text xml:space="preserve" x="28.105" y="332.471" font-family="Arial, Microsoft YaHei, sans-serif" font-size="36.893" font-weight="400" fill="#123b51" text-anchor="start">2. Unemployment Rate（失业率）</text></g><g id="text-5" data-role="text-5"><text xml:space="preserve" x="28.105" y="387.810" font-family="Arial, Microsoft YaHei, sans-serif" font-size="36.893" font-weight="400" fill="#123b51" text-anchor="start">Unemployment Rate=(Unemployed)/(Labor Force)×100%</text></g><g id="text-6" data-role="text-6"><text xml:space="preserve" x="28.105" y="443.150" font-family="Arial, Microsoft YaHei, sans-serif" font-size="36.893" font-weight="400" fill="#123b51" text-anchor="start">3. Labor Force Participation Rate（劳动参与率）</text></g><g id="text-7" data-role="text-7"><text xml:space="preserve" x="28.105" y="498.489" font-family="Arial, Microsoft YaHei, sans-serif" font-size="36.893" font-weight="400" fill="#123b51" text-anchor="start">LFPR=(Labor Force)/(Adult Population)×100%</text></g></svg>