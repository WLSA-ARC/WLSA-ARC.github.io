<svg xmlns="http://www.w3.org/2000/svg" width="1558" height="991" viewBox="0 0 1558 991" role="img"><title>The business cycle</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1558" height="991" fill="#fff"/><g transform="scale(1.558 1.4157142857142857)"><text xml:space="preserve" x="28.000" y="38.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28.000" font-weight="700" fill="#173c52" text-anchor="start">The Business Cycle</text><text xml:space="preserve" x="35.000" y="82.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23.000" font-weight="400" fill="#173c52" text-anchor="start">The national economy rises and falls over time.</text><line x1="90" y1="590" x2="945" y2="590" stroke="#28546c" stroke-width="2" marker-end="url(#arrow)"/><line x1="90" y1="590" x2="90" y2="120" stroke="#28546c" stroke-width="2" marker-end="url(#arrow)"/><text xml:space="preserve" x="95.000" y="120.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22.000" font-weight="400" fill="#173c52" text-anchor="start">Real GDP</text><text xml:space="preserve" x="870.000" y="635.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22.000" font-weight="400" fill="#173c52" text-anchor="start">Time</text><path d="M100 560L900 180" fill="none" stroke="#b0ad5e" stroke-width="3"/><path d="M100 530C170 520 170 370 265 360S350 510 440 440S560 200 650 220S760 370 830 290S880 110 930 110" fill="none" stroke="#347d9e" stroke-width="5"/><text xml:space="preserve" x="225.000" y="325.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.000" font-weight="400" fill="#173c52" text-anchor="start">Peak</text><text xml:space="preserve" x="365.000" y="503.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.000" font-weight="400" fill="#173c52" text-anchor="start">Trough</text><text xml:space="preserve" x="610.000" y="185.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.000" font-weight="400" fill="#173c52" text-anchor="start">Peak</text><text xml:space="preserve" x="760.000" y="357.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.000" font-weight="400" fill="#173c52" text-anchor="start">Trough</text><text xml:space="preserve" x="240.000" y="195.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23.000" font-weight="400" fill="#173c52" text-anchor="start">Recession</text><text xml:space="preserve" x="240.000" y="223.750" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23.000" font-weight="400" fill="#173c52" text-anchor="start">(Contraction)</text><line x1="285" y1="215" x2="390" y2="380" stroke="#28546c" stroke-width="2" marker-end="url(#arrow)"/><text xml:space="preserve" x="470.000" y="510.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23.000" font-weight="400" fill="#173c52" text-anchor="start">Recovery (Expansion)</text><line x1="540" y1="480" x2="590" y2="300" stroke="#28546c" stroke-width="2" marker-end="url(#arrow)"/><text xml:space="preserve" x="690.000" y="145.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21.000" font-weight="400" fill="#173c52" text-anchor="start">Full Employment</text><text xml:space="preserve" x="175.000" y="300.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.000" font-weight="400" fill="#173c52" text-anchor="start">Positive Output Gap</text><line x1="300" y1="315" x2="300" y2="360" stroke="#28546c" stroke-width="2"/><text xml:space="preserve" x="650.000" y="425.000" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18.000" font-weight="400" fill="#173c52" text-anchor="start">Negative Output Gap</text><line x1="770" y1="390" x2="790" y2="320" stroke="#28546c" stroke-width="2"/><text x="820" y="95" font-family="Arial,sans-serif" font-size="21" fill="#347d9e">Real GDP</text></g></svg>