<svg xmlns="http://www.w3.org/2000/svg" width="1363" height="396" viewBox="0 0 1363 396" role="img"><title>Includes spending on:</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1363" height="396" fill="#fff"/><g id="text-0" data-role="text-0"><text xml:space="preserve" x="13.860" y="51.860" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">Includes spending on:</text></g><g id="bullet-1" data-role="bullet-1"><circle cx="20.700000000000003" cy="95.56" r="4.94" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="51.860" y="108.860" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">capital equipment (e.g., machines, tools)</text></g><g id="bullet-2" data-role="bullet-2"><circle cx="20.700000000000003" cy="152.56" r="4.94" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="51.860" y="165.860" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">structures (factories, office buildings, houses)</text></g><g id="bullet-3" data-role="bullet-3"><circle cx="20.700000000000003" cy="209.56" r="4.94" fill="#2580a4" stroke="#2580a4" stroke-width="0"/><text xml:space="preserve" x="51.860" y="222.860" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">inventories (goods produced but not yet sold)</text></g></svg>