<svg xmlns="http://www.w3.org/2000/svg" width="1477" height="781" viewBox="0 0 1477 781" role="img"><title>1. Expenditures Approach — Add up all the spending on final goods and services produced in a given year.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28546c"/></marker></defs><rect width="1477" height="781" fill="#fff"/><g id="text-0" data-role="text-0"><text xml:space="preserve" x="27.335" y="65.335" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">1. Expenditures Approach — Add up all the spending on final goods</text><text xml:space="preserve" x="27.335" y="112.835" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">and services produced in a given year.</text></g><g id="text-1" data-role="text-1"><text xml:space="preserve" x="27.335" y="169.835" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">2. Income Approach — Add up all the income earned from selling all</text><text xml:space="preserve" x="27.335" y="217.335" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">final goods and services produced in a given year.</text></g><g id="text-2" data-role="text-2"><text xml:space="preserve" x="27.335" y="274.335" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">3. Value-added Approach — Add up the dollar value added at each</text><text xml:space="preserve" x="27.335" y="321.835" font-family="Arial, Microsoft YaHei, sans-serif" font-size="38.000" font-weight="400" fill="#123b51" text-anchor="start">stage of the production process.</text></g></svg>