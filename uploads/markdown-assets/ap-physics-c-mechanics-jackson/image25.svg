<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img"><title>Acceleratingbox example4-7: hand/string/crate and vertical arrows, FP100N,mg98N,a0.20m/s² derivation plus source illustration.</title><rect width="100%" height="100%" fill="white"/><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve">Accelerating the box</text><rect x="147" y="160" width="56" height="50" rx="3" fill="#eff4f7" stroke="#263445" stroke-width="1"/><path d="M175 185L175 90" fill="none" stroke="#147fa5" stroke-width="2.5"/><path d="M175 90L171.0 100.0L179.0 100.0Z" stroke="#147fa5" stroke-width="0" fill="#147fa5"/><path d="M175 185L175 285" fill="none" stroke="#c44251" stroke-width="2.5"/><path d="M175 285L179.0 275.0L171.0 275.0Z" stroke="#c44251" stroke-width="0" fill="#c44251"/><text x="190" y="85" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Fₚ = 100.0 N</text><text x="190" y="300" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">mg = 98.0 N</text><path d="M100 200L100 140" fill="none" stroke="#147fa5" stroke-width="2.5"/><path d="M100 140L96.0 150.0L104.0 150.0Z" stroke="#147fa5" stroke-width="0" fill="#147fa5"/><text x="108.0" y="160.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve">a</text><text x="340" y="100" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">ΣFᵧ = Fₙ − mg + Fₚ</text><text x="340" y="138" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Setting a = 0 would give Fₙ = −2.0 N.</text><text x="340" y="176" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">A table cannot pull down on the box.</text><text x="340" y="214" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">The box leaves the table: Fₙ = 0</text><text x="340" y="252" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Fnet = 100.0 − 98.0 = 2.0 N</text><text x="340" y="290" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">a = Fnet / m = 2.0 / 10.0 = 0.20 m/s²</text></svg>
