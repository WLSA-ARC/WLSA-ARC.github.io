<svg xmlns="http://www.w3.org/2000/svg" width="900" height="255" viewBox="0 0 900 255" role="img"><title>Boat river-crossing solution: vBS=vBW+vWS, sqrt(1.85²+1.20²)=2.21m/s, theta33.0deg, width110m,time59.5s,drift71.4m.</title><rect width="100%" height="100%" fill="white"/><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve">River-crossing calculation</text><g id="review-equations-and-explanation"><text x="30" y="85" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">vBS = vBW + vWS</text><text x="30" y="119" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">vBS = √[(1.85 m/s)² + (1.20 m/s)²] = 2.21 m/s</text><text x="30" y="153" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">tan θ = 1.20 / 1.85 = 0.6486 → θ = 33.0°</text><text x="30" y="187" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Crossing time: t = D / vBW = 110 / 1.85 = 59.5 s</text><text x="30" y="221" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Downstream drift: d = (1.20)(59.5) = 71.4 m ≈ 71 m</text></g></svg>
