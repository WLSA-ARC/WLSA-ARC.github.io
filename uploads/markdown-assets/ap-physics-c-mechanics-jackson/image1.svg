<svg xmlns="http://www.w3.org/2000/svg" width="900" height="235" viewBox="0 0 900 235" role="img"><title>Three component vectors V1, V2, V3 and head-to-tail resultant VR; Figure 3-5 caption and resultant formula.</title><rect width="100%" height="100%" fill="white"/><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve">Vector sum</text><g id="components"><path d="M45 135L115 65" fill="none" stroke="#147fa5" stroke-width="2.5"/><path d="M115 65L105.10050506338834 69.24264068711929L110.75735931288071 74.89949493661166Z" stroke="#147fa5" stroke-width="0" fill="#147fa5"/><text x="88.0" y="90.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve">V₁</text><text x="145" y="110" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">+</text><path d="M205 55L205 155" fill="none" stroke="#147fa5" stroke-width="2.5"/><path d="M205 155L209.0 145.0L201.0 145.0Z" stroke="#147fa5" stroke-width="0" fill="#147fa5"/><text x="213.0" y="95.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve">V₂</text><text x="240" y="110" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">+</text><path d="M335 100L285 100" fill="none" stroke="#147fa5" stroke-width="2.5"/><path d="M285 100L295.0 104.0L295.0 96.0Z" stroke="#147fa5" stroke-width="0" fill="#147fa5"/><text x="318.0" y="90.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve">V₃</text><text x="365" y="110" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">=</text></g><g id="resultant"><path d="M445 85L515 15" fill="none" stroke="#147fa5" stroke-width="2.5"/><path d="M515 15L505.1005050633883 19.242640687119284L510.75735931288074 24.899494936611667Z" stroke="#147fa5" stroke-width="0" fill="#147fa5"/><text x="488.0" y="40.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve">V₁</text><path d="M515 15L515 115" fill="none" stroke="#147fa5" stroke-width="2.5"/><path d="M515 115L519.0 105.0L511.0 105.0Z" stroke="#147fa5" stroke-width="0" fill="#147fa5"/><text x="523.0" y="55.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve">V₂</text><path d="M515 115L465 115" fill="none" stroke="#147fa5" stroke-width="2.5"/><path d="M465 115L475.0 119.0L475.0 111.0Z" stroke="#147fa5" stroke-width="0" fill="#147fa5"/><text x="498.0" y="105.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve">V₃</text><path d="M445 85L465 115" fill="none" stroke="#c44251" stroke-width="2.5"/><path d="M465 115L462.7811992150991 104.46069627172064L456.1247968603963 108.89829784152248Z" stroke="#c44251" stroke-width="0" fill="#c44251"/><text x="463.0" y="90.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#c44251" text-anchor="start" xml:space="preserve">Vᵣ</text></g><text x="580" y="85" font-family="Arial,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Head-to-tail addition</text><text x="580" y="121" font-family="Arial,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Vᵣ = V₁ + V₂ + V₃</text></svg>
