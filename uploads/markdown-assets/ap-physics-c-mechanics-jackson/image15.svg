<svg xmlns="http://www.w3.org/2000/svg" width="900" height="289" viewBox="0 0 900 289" role="img"><title>Level horizontal projectile range derivation R=v0²sin(2theta0)/g and side diagrams same-level range and30/45/60deg paths; maximum45deg.</title><rect width="100%" height="100%" fill="white"/><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve">Horizontal range (same launch and landing height)</text><g id="review-equations-and-explanation"><text x="30" y="85" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">R = v₀ₓt = (v₀ cos θ₀)(2v₀ sin θ₀ / g)</text><text x="30" y="119" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">R = v₀² sin(2θ₀) / g</text><text x="30" y="153" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">For fixed speed, θ and (90° − θ) give the same range.</text><text x="30" y="187" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Maximum range: θ₀ = 45°, Rmax = v₀² / g</text><text x="30" y="221" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Doubling v₀ increases the range by a factor of 4.</text><text x="30" y="255" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">With air resistance the range is reduced; maximum-range angle &lt; 45°.</text></g></svg>
