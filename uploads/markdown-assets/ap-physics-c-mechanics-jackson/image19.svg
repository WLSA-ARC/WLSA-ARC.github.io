<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img"><title>Center of mass of three guys on a raft; positions1,5,6m; equalmass mean4.0m and painted banana boat illustration.</title><rect width="100%" height="100%" fill="white" /><rect x="55" y="95" width="450" height="65" rx="3" fill="#f5d468" stroke="#263445" stroke-width="1" /><path d="M55 185L530 185" fill="none" stroke="#263445" stroke-width="2" /><circle cx="115" cy="75" r="12" fill="#d9bca8" stroke="#263445" stroke-width="2" /><path d="M115 88L115 125" fill="none" stroke="#263445" stroke-width="4" /><circle cx="355" cy="75" r="12" fill="#d9bca8" stroke="#263445" stroke-width="2" /><path d="M355 88L355 125" fill="none" stroke="#263445" stroke-width="4" /><circle cx="415" cy="75" r="12" fill="#d9bca8" stroke="#263445" stroke-width="2" /><path d="M415 88L415 125" fill="none" stroke="#263445" stroke-width="4" /><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Center of mass: three people on a raft</text><text x="560" y="95" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Equal masses; ignore the boat mass.</text><text x="560" y="131" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">xA = 1.0 m, xB = 5.0 m, xC = 6.0 m</text><text x="560" y="167" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">xCM = (mxA + mxB + mxC)/(3m)</text><text x="560" y="203" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">xCM = (1 + 5 + 6)/3 = 4.0 m</text><text x="115" y="215" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#263445" text-anchor="middle" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">1.0 m</text><text x="355" y="215" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#263445" text-anchor="middle" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">5.0 m</text><text x="415" y="215" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#263445" text-anchor="middle" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">6.0 m</text></svg>