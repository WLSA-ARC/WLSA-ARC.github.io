<svg xmlns="http://www.w3.org/2000/svg" width="750" height="340" viewBox="0 0 750 340" role="img"><title>Falling stone past a realistically shaded window2.2m high in0.28s, plus problem statement and Figure2-49 caption.</title><rect width="100%" height="100%" fill="white"/><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve">A stone falling past a window</text><rect x="110" y="90" width="180" height="180" rx="3" fill="#dff1fa" stroke="#263445" stroke-width="3"/><path d="M200 90L200 270" fill="none" stroke="#263445" stroke-width="2"/><path d="M110 180L290 180" fill="none" stroke="#263445" stroke-width="2"/><path d="M330 95L330 265" fill="none" stroke="#c44251" stroke-width="2.5"/><path d="M330 265L334.0 255.0L326.0 255.0Z" stroke="#c44251" stroke-width="0" fill="#c44251"/><text x="338.0" y="170.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#c44251" text-anchor="start" xml:space="preserve">2.2 m</text><circle cx="365" cy="95" r="7" fill="#263445" stroke="#263445" stroke-width="2"/><circle cx="365" cy="265" r="7" fill="#263445" stroke="#263445" stroke-width="2"/><text x="420" y="120" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Travel time: 0.28 s</text><text x="420" y="157" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Distance: 2.2 m</text><text x="420" y="194" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">How far above the window</text><text x="420" y="231" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">was the stone released?</text></svg>
