<svg xmlns="http://www.w3.org/2000/svg" width="800" height="405" viewBox="0 0 800 405" role="img"><title>Painted river banks, boat and water with green river current, vWS, vBS, vBW arrows and theta; caption river current1.20m/s.</title><rect width="100%" height="100%" fill="white" /><rect x="40" y="75" width="390" height="275" rx="3" fill="#d9f1f7" stroke="none" stroke-width="1" /><path d="M40 75L430 75" fill="none" stroke="#c7a06b" stroke-width="12" /><path d="M40 350L430 350" fill="none" stroke="#c7a06b" stroke-width="12" /><rect x="260" y="300" width="20" height="36" rx="3" fill="#f8e6bb" stroke="#263445" stroke-width="1" /><path d="M270 315L270 130" fill="none" stroke="#248b67" stroke-width="2.5" /><path d="M270 130L266.0 140.0L274.0 140.0Z" stroke="#248b67" stroke-width="0" fill="#248b67" /><path d="M270 130L130 130" fill="none" stroke="#248b67" stroke-width="2.5" /><path d="M130 130L140.0 134.0L140.0 126.0Z" stroke="#248b67" stroke-width="0" fill="#248b67" /><path d="M270 315L130 130" fill="none" stroke="#147fa5" stroke-width="2.5" /><path d="M130 130L132.8448011594461 140.3878345367653L139.2240522442646 135.560293175281Z" stroke="#147fa5" stroke-width="0" fill="#147fa5" /><path d="M200 95L90 95" fill="none" stroke="#248b67" stroke-width="2.5" /><path d="M90 95L100.0 99.0L100.0 91.0Z" stroke="#248b67" stroke-width="0" fill="#248b67" /><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Crossing a river</text><text x="278.0" y="212.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#248b67" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">vBW</text><text x="208.0" y="120.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#248b67" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">vWS</text><text x="208.0" y="212.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">vBS</text><text x="235" y="240" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">θ</text><text x="475" y="120" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">River current: 1.20 m/s</text><text x="475" y="158" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">vBS = vBW + vWS</text><text x="475" y="196" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Boat heads directly across;</text><text x="475" y="234" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">its path drifts downstream.</text></svg>