<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img"><title>Accelerometer example4-15: two car window photos with hangingmass and annotations; acceleration1.20m/s² gives theta7.0deg.</title><rect width="100%" height="100%" fill="white"/><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve">Accelerometer: a hanging mass in a car</text><rect x="55" y="90" width="245" height="220" rx="3" fill="#eff4f8" stroke="#263445" stroke-width="1"/><circle cx="180" cy="260" r="15" fill="#248b67" stroke="#263445" stroke-width="2"/><path d="M245 105L180 260" fill="none" stroke="#263445" stroke-width="2"/><path d="M245 105L245 280" fill="none" stroke="#263445" stroke-width="1" stroke-dasharray="5 5"/><text x="220" y="195" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">θ</text><path d="M180 260L220 165" fill="none" stroke="#147fa5" stroke-width="2.5"/><path d="M220 165L212.43288849886642 172.66412575114813L219.80597149997095 175.7685817516132Z" stroke="#147fa5" stroke-width="0" fill="#147fa5"/><text x="208.0" y="202.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve">Fₜ</text><path d="M180 260L180 335" fill="none" stroke="#c44251" stroke-width="2.5"/><path d="M180 335L184.0 325.0L176.0 325.0Z" stroke="#c44251" stroke-width="0" fill="#c44251"/><text x="188.0" y="287.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#c44251" text-anchor="start" xml:space="preserve">mg</text><path d="M90 335L155 335" fill="none" stroke="#147fa5" stroke-width="2.5"/><path d="M155 335L145.0 331.0L145.0 339.0Z" stroke="#147fa5" stroke-width="0" fill="#147fa5"/><text x="130.5" y="325.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve">a</text><text x="360" y="95" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Fₜ sin θ = ma; Fₜ cos θ = mg</text><text x="360" y="134" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">tan θ = a / g</text><text x="360" y="173" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">a = 1.20 m/s² → θ = 7.0°</text><text x="360" y="212" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve"></text><text x="360" y="251" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Constant v = 90 km/h → a = 0</text><text x="360" y="290" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">The string hangs vertically: θ = 0.</text></svg>
