<svg xmlns="http://www.w3.org/2000/svg" width="900" height="289" viewBox="0 0 900 289" role="img"><title>Position/displacement vectors r1,r2,delta r, Cartesian unit vectors; average velocity and instantaneous limit derivative, equations3-6a/b,3-7,3-8.</title><rect width="100%" height="100%" fill="white"/><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve">Displacement and velocity in vector form</text><g id="review-equations-and-explanation"><text x="30" y="85" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">r₁ = x₁ i + y₁ j + z₁ k; r₂ = x₂ i + y₂ j + z₂ k</text><text x="30" y="119" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Δr = (x₂ − x₁)i + (y₂ − y₁)j + (z₂ − z₁)k</text><text x="30" y="153" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">For motion only along x: Δy = Δz = 0</text><text x="30" y="187" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Average velocity: v̄ = Δr / Δt</text><text x="30" y="221" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Instantaneous velocity: v = lim(Δt→0) Δr/Δt = dr/dt</text><text x="30" y="255" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">The instantaneous velocity is tangent to the path.</text></g></svg>
