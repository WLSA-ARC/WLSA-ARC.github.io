<svg xmlns="http://www.w3.org/2000/svg" width="900" height="221" viewBox="0 0 900 221" role="img"><title>Average acceleration definition, change in velocity over elapsed time, a-bar=(v2-v1)/(t2-t1)=delta v/delta t, vector direction discussion.</title><rect width="100%" height="100%" fill="white"/><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve">Average acceleration</text><g id="review-equations-and-explanation"><text x="30" y="85" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Average acceleration = change of velocity / elapsed time</text><text x="30" y="119" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">ā = (v₂ − v₁) / (t₂ − t₁) = Δv / Δt</text><text x="30" y="153" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Acceleration is a vector. In one dimension, its sign gives its</text><text x="30" y="187" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">direction along the chosen axis.</text></g></svg>
