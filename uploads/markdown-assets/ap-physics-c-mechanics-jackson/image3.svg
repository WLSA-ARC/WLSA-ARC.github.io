<svg xmlns="http://www.w3.org/2000/svg" width="900" height="221" viewBox="0 0 900 221" role="img"><title>Cartesian vector description: components Vx, Vy, magnitude sqrt(Vx²+Vy²), tan theta=Vy/Vx, equations 3-3a and 3-3b.</title><rect width="100%" height="100%" fill="white"/><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve">Describing a vector</text><g id="review-equations-and-explanation"><text x="30" y="85" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Components: Vₓ and Vᵧ</text><text x="30" y="119" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Magnitude: V = √(Vₓ² + Vᵧ²)</text><text x="30" y="153" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Direction: tan θ = Vᵧ / Vₓ</text><text x="30" y="187" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">θ is measured from the positive x axis.</text></g></svg>
