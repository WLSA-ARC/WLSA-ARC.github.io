<svg xmlns="http://www.w3.org/2000/svg" width="900" height="325" viewBox="0 0 900 325" role="img"><title>Problem33:4.0kgblock stacked on12.0kgblock, a5.2m/s²; frictionminimum and relativeacceleration questions, shaded diagram.</title><rect width="100%" height="100%" fill="white" /><rect x="70" y="210" width="240" height="70" rx="3" fill="#f5dfad" stroke="#263445" stroke-width="1" /><rect x="145" y="150" width="100" height="60" rx="3" fill="#f5dfad" stroke="#263445" stroke-width="1" /><path d="M45 280L345 280" fill="none" stroke="#263445" stroke-width="2" /><path d="M310 225L405 225" fill="none" stroke="#147fa5" stroke-width="2.5" /><path d="M405 225L395.0 221.0L395.0 229.0Z" stroke="#147fa5" stroke-width="0" fill="#147fa5" /><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Two stacked blocks</text><text x="150" y="252" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">12.0 kg</text><text x="156" y="188" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">4.0 kg</text><text x="295" y="305" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">a = 5.2 m/s²</text><text x="440" y="90" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">μₖ = μₛ = μ</text><text x="440" y="126" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">(a) Minimum μ that prevents slipping?</text><text x="440" y="162" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">(b) μ is half that minimum: acceleration</text><text x="440" y="198" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">of the 4.0-kg block relative to the table?</text><text x="440" y="234" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">(c) Relative to the 12.0-kg block?</text><text x="440" y="270" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">(d) Applied force in (a)/(b), frictionless table?</text></svg>