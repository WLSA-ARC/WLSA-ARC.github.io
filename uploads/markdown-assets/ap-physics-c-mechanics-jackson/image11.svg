<svg xmlns="http://www.w3.org/2000/svg" width="900" height="255" viewBox="0 0 900 255" role="img"><title>Free-fall approach/solution with positive downward, g9.80m/s², initial y0=v0=0; positions4.90m,19.6m,44.1m at1/2/3s.</title><rect width="100%" height="100%" fill="white"/><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve">Free fall from rest</text><g id="review-equations-and-explanation"><text x="30" y="85" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Choose downward positive: a = g = 9.80 m/s²; y₀ = 0; v₀ = 0</text><text x="30" y="119" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">y = v₀t + ½at² = ½gt²</text><text x="30" y="153" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">t₁ = 1.00 s → y₁ = 4.90 m</text><text x="30" y="187" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">t₂ = 2.00 s → y₂ = 19.6 m</text><text x="30" y="221" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">t₃ = 3.00 s → y₃ = 44.1 m</text></g></svg>
