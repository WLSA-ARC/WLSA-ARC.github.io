<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img"><title>Pulling against friction example5-3:10.0kgcrate,40.0N at30deg,mu0.30; FN78.0N,friction23.4N,a1.1m/s² with boxdiagram.</title><rect width="100%" height="100%" fill="white" /><path d="M45 260L320 260" fill="none" stroke="#263445" stroke-width="2" /><rect x="137" y="205" width="56" height="50" rx="3" fill="#eff4f7" stroke="#263445" stroke-width="1" /><path d="M165 230L165 135" fill="none" stroke="#248b67" stroke-width="2.5" /><path d="M165 135L161.0 145.0L169.0 145.0Z" stroke="#248b67" stroke-width="0" fill="#248b67" /><path d="M165 230L165 330" fill="none" stroke="#c44251" stroke-width="2.5" /><path d="M165 330L169.0 320.0L161.0 320.0Z" stroke="#c44251" stroke-width="0" fill="#c44251" /><path d="M165 230L75 230" fill="none" stroke="#c44251" stroke-width="2.5" /><path d="M75 230L85.0 234.0L85.0 226.0Z" stroke="#c44251" stroke-width="0" fill="#c44251" /><path d="M165 230L290 158" fill="none" stroke="#147fa5" stroke-width="2.5" /><path d="M290 158L279.3381951185867 159.52509562673012L283.3311727594801 166.45734847550338Z" stroke="#147fa5" stroke-width="0" fill="#147fa5" /><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Pulling against kinetic friction</text><text x="173.0" y="172.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#248b67" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Fₙ</text><text x="173.0" y="270.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#c44251" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">mg</text><text x="65" y="213" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#c44251" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Ffr</text><text x="235.5" y="184.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Fₚ = 40.0 N</text><text x="240" y="210" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">30°</text><text x="145" y="235" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">10 kg</text><text x="370" y="95" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">m = 10.0 kg; μₖ = 0.30; aᵧ = 0</text><text x="370" y="135" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Fₙ − mg + Fₚ sin 30° = 0</text><text x="370" y="175" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Fₙ = 98.0 − 20.0 = 78.0 N</text><text x="370" y="215" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Ffr = μₖFₙ = (0.30)(78.0) = 23.4 N</text><text x="370" y="255" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Fₚₓ = 40.0 cos 30° = 34.6 N</text><text x="370" y="295" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">aₓ = (34.6 − 23.4)/10.0 = 1.1 m/s²</text></svg>