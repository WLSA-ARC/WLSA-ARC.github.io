<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" role="img"><title>Average velocity secant on red x-t curve with P1/P2, x1/x2, t1/t2 and delta x=x2-x1, delta t=t2-t1; Figure2-10 caption.</title><rect width="100%" height="100%" fill="white"/><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve">Average velocity is the secant slope</text><path d="M65 300L485 300" fill="none" stroke="#263445" stroke-width="1.5"/><path d="M485 300L475.0 296.0L475.0 304.0Z" stroke="#263445" stroke-width="0" fill="#263445"/><path d="M65 300L65 85" fill="none" stroke="#263445" stroke-width="1.5"/><path d="M65 85L61.0 95.0L69.0 95.0Z" stroke="#263445" stroke-width="0" fill="#263445"/><text x="493" y="307" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">t</text><text x="53" y="73" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">x</text><path d="M80 275 C180 255 210 120 290 95 S390 90 440 150" stroke="#c44251" stroke-width="3" fill="none"/><circle cx="150" cy="240" r="4" fill="#c44251" stroke="#263445" stroke-width="2"/><circle cx="300" cy="92" r="4" fill="#c44251" stroke="#263445" stroke-width="2"/><path d="M150 240L300 92" fill="none" stroke="#263445" stroke-width="2"/><path d="M150 240L300 240" fill="none" stroke="#263445" stroke-width="1" stroke-dasharray="5 5"/><path d="M300 240L300 92" fill="none" stroke="#263445" stroke-width="1" stroke-dasharray="5 5"/><text x="110" y="225" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">P₁</text><text x="310" y="90" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">P₂</text><text x="320" y="180" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Δx</text><text x="205" y="270" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Δt</text><text x="510" y="145" font-family="Arial,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Δx = x₂ − x₁</text><text x="510" y="185" font-family="Arial,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Δt = t₂ − t₁</text><text x="510" y="225" font-family="Arial,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">v̄ = Δx / Δt</text></svg>
