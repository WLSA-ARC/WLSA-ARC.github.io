<svg xmlns="http://www.w3.org/2000/svg" width="900" height="255" viewBox="0 0 900 255" role="img"><title>Stone falling past window solution:2.2m,0.28s,g9.8m/s²,v0≈6.485m/s,h≈2.1m; displacement and energy equations.</title><rect width="100%" height="100%" fill="white"/><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve">Speed at the top of the window</text><g id="review-equations-and-explanation"><text x="30" y="85" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Let v₀ be the speed at the top of the window.</text><text x="30" y="119" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">y = v₀t + ½gt²</text><text x="30" y="153" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">2.2 = v₀(0.28) + ½(9.8)(0.28)²</text><text x="30" y="187" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">2.2 = 0.28v₀ + 0.38416 → v₀ ≈ 6.485 m/s</text><text x="30" y="221" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">From rest: v₀² = 2gh → h = (6.485)² / [2(9.8)] ≈ 2.1 m</text></g></svg>
