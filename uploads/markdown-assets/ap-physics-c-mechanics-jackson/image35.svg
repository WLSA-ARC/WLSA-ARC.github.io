<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img"><title>Spring work Figure7-11: triangular area under F=kx, W=halfkx²,grey triangle,pink line anddimension arrows x/kx.</title><rect width="100%" height="100%" fill="white"/><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve">Work done stretching a spring</text><path d="M70 275L370 275" fill="none" stroke="#263445" stroke-width="1.5"/><path d="M370 275L360.0 271.0L360.0 279.0Z" stroke="#263445" stroke-width="0" fill="#263445"/><path d="M70 275L70 85" fill="none" stroke="#263445" stroke-width="1.5"/><path d="M70 85L66.0 95.0L74.0 95.0Z" stroke="#263445" stroke-width="0" fill="#263445"/><text x="378" y="282" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">x</text><text x="58" y="73" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">F</text><path d="M70 275L310 115L310 275Z" stroke="none" stroke-width="0" fill="#dbe2e8"/><path d="M70 275L340 95" fill="none" stroke="#c44251" stroke-width="3"/><path d="M310 115L310 275" fill="none" stroke="#263445" stroke-width="1" stroke-dasharray="5 5"/><text x="235" y="125" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">F = kx</text><text x="310" y="300" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">x</text><text x="325" y="195" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">kx</text><text x="430" y="140" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Work = area under F(x)</text><text x="430" y="178" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">W = ½ × base × height</text><text x="430" y="216" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">W = ½(x)(kx) = ½kx²</text></svg>
