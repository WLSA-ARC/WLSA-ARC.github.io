<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img"><title>Horizontal and angled projectile diagrams with independent horizontal and vertical component equations. Source x-component upper equation contains its handwritten extra t exactly as original.</title><rect width="100%" height="100%" fill="white" /><path d="M70 95L310 95" fill="none" stroke="#263445" stroke-width="2.5" /><path d="M310 95L300.0 91.0L300.0 99.0Z" stroke="#263445" stroke-width="0" fill="#263445" /><path d="M70 95L70 265" fill="none" stroke="#263445" stroke-width="2.5" /><path d="M70 265L74.0 255.0L66.0 255.0Z" stroke="#263445" stroke-width="0" fill="#263445" /><path d="M70 95Q190 100 260 250" stroke="#147fa5" stroke-width="3" fill="none" /><path d="M70 420L240 325" fill="none" stroke="#147fa5" stroke-width="2.5" /><path d="M240 325L229.31927974796758 326.3864396481004L233.22185060928712 333.3699875051985Z" stroke="#147fa5" stroke-width="0" fill="#147fa5" /><path d="M50 420L310 420" fill="none" stroke="#263445" stroke-width="2" /><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Independent components of projectile motion</text><text x="70" y="300" font-family="Arial,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Horizontal launch</text><text x="400" y="95" font-family="Arial,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">vᵧ = gt; y = ½gt²</text><text x="400" y="138" font-family="Arial,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">vₓ = vᵢ; x = vᵢt</text><text x="163.0" y="362.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">vᵢ</text><text x="150" y="410" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">θ</text><text x="400" y="300" font-family="Arial,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Angled launch:</text><text x="400" y="340" font-family="Arial,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">x = vᵢ cos θ · t</text><text x="400" y="380" font-family="Arial,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">vᵧ = vᵢ sin θ − gt</text><text x="400" y="420" font-family="Arial,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">y = vᵢ sin θ · t − ½gt²</text></svg>