<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="680" viewBox="0 0 1050 680" role="img"><title>Two 1kg masses linked by spring under 40N force and equations; two horizontal 1kg blocks with 1N pull and 0.5N spring note; static/kinetic friction labels and pushing wall/incline sketches.</title><rect width="100%" height="100%" fill="white"/><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve">Connected masses, springs and friction</text><rect x="70" y="125" width="65" height="40" rx="3" fill="#eff4f7" stroke="#263445" stroke-width="1"/><text x="78" y="153" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">1 kg</text><rect x="70" y="265" width="65" height="40" rx="3" fill="#eff4f7" stroke="#263445" stroke-width="1"/><text x="78" y="293" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">1 kg</text><path d="M100 165L85 180L115 195L85 210L115 225L100 265" stroke="#147fa5" stroke-width="2" fill="none"/><path d="M100 125L100 55" fill="none" stroke="#147fa5" stroke-width="2.5"/><path d="M100 55L96.0 65.0L104.0 65.0Z" stroke="#147fa5" stroke-width="0" fill="#147fa5"/><text x="108.0" y="80.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve">F = 40 N</text><text x="250" y="100" font-family="Arial,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">F − (m₁+m₂)g = (m₁+m₂)a</text><text x="250" y="145" font-family="Arial,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">For m₂: kx − m₂g = m₂a</text><text x="250" y="190" font-family="Arial,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">a = 10; x = 20 cm</text><path d="M40 440L520 440" fill="none" stroke="#263445" stroke-width="2"/><rect x="85" y="385" width="65" height="55" rx="3" fill="#eff4f7" stroke="#263445" stroke-width="1"/><rect x="330" y="385" width="65" height="55" rx="3" fill="#eff4f7" stroke="#263445" stroke-width="1"/><text x="90" y="374" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">1 kg</text><text x="335" y="374" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">1 kg</text><path d="M150 410L165 398L185 422L205 398L225 422L245 398L265 422L285 398L305 422L330 410" stroke="#147fa5" stroke-width="2" fill="none"/><path d="M395 410L500 410" fill="none" stroke="#147fa5" stroke-width="2.5"/><path d="M500 410L490.0 406.0L490.0 414.0Z" stroke="#147fa5" stroke-width="0" fill="#147fa5"/><text x="455.5" y="400.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve">1 N</text><text x="165" y="378" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">0.5 N</text><text x="565" y="365" font-family="Arial,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">F = (m₁+m₂)a</text><text x="565" y="410" font-family="Arial,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">For m₂: N = m₂a</text><text x="45" y="520" font-family="Arial,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Static friction: fₛ</text><text x="45" y="565" font-family="Arial,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Kinetic friction: fₖ</text><text x="45" y="610" font-family="Arial,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">f = μN; μₛ &gt; μₖ</text><rect x="580" y="530" width="80" height="65" rx="3" fill="#eff4f7" stroke="#263445" stroke-width="1"/><path d="M540 595L850 595" fill="none" stroke="#263445" stroke-width="2"/><path d="M620 555L740 555" fill="none" stroke="#147fa5" stroke-width="2.5"/><path d="M740 555L730.0 551.0L730.0 559.0Z" stroke="#147fa5" stroke-width="0" fill="#147fa5"/><text x="688.0" y="545.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve">F</text><path d="M620 580L500 580" fill="none" stroke="#c44251" stroke-width="2.5"/><path d="M500 580L510.0 584.0L510.0 576.0Z" stroke="#c44251" stroke-width="0" fill="#c44251"/><text x="568.0" y="570.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#c44251" text-anchor="start" xml:space="preserve">f</text></svg>
