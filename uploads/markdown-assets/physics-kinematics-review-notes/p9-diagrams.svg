<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="610" viewBox="0 0 1050 610" role="img"><title>Static friction rises to a maximum then kinetic plateau, fs&lt;=fsmax and fsmax=mu_s Fn; stacked A/B/C block force diagrams and acceleration fractions.</title><rect width="100%" height="100%" fill="white" /><path d="M60 270L425 270" fill="none" stroke="#263445" stroke-width="1.5" /><path d="M425 270L415.0 266.0L415.0 274.0Z" stroke="#263445" stroke-width="0" fill="#263445" /><path d="M60 270L60 110" fill="none" stroke="#263445" stroke-width="1.5" /><path d="M60 110L56.0 120.0L64.0 120.0Z" stroke="#263445" stroke-width="0" fill="#263445" /><path d="M60 270L275 95L275 145L405 145" stroke="#147fa5" stroke-width="3" fill="none" /><rect x="130" y="360" width="115" height="65" rx="3" fill="#e6ebf0" stroke="#263445" stroke-width="1" /><rect x="130" y="425" width="115" height="65" rx="3" fill="#e6ebf0" stroke="#263445" stroke-width="1" /><rect x="130" y="490" width="115" height="65" rx="3" fill="#e6ebf0" stroke="#263445" stroke-width="1" /><path d="M60 555L320 555" fill="none" stroke="#263445" stroke-width="2" /><path d="M245 455L370 455" fill="none" stroke="#147fa5" stroke-width="2.5" /><path d="M370 455L360.0 451.0L360.0 459.0Z" stroke="#147fa5" stroke-width="0" fill="#147fa5" /><path d="M130 430L40 430" fill="none" stroke="#c44251" stroke-width="2.5" /><path d="M40 430L50.0 434.0L50.0 426.0Z" stroke="#c44251" stroke-width="0" fill="#c44251" /><path d="M245 515L370 515" fill="none" stroke="#147fa5" stroke-width="2.5" /><path d="M370 515L360.0 511.0L360.0 519.0Z" stroke="#147fa5" stroke-width="0" fill="#147fa5" /><path d="M130 540L40 540" fill="none" stroke="#c44251" stroke-width="2.5" /><path d="M40 540L50.0 544.0L50.0 536.0Z" stroke="#c44251" stroke-width="0" fill="#c44251" /><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Static and kinetic friction; stacked blocks</text><text x="433" y="277" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Applied force</text><text x="48" y="98" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Friction</text><text x="490" y="95" font-family="Arial,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">fₛ ≤ fₛ,max</text><text x="490" y="145" font-family="Arial,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">fₛ,max = μₛFₙ</text><text x="80" y="315" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Static friction rises to a maximum; kinetic friction is lower.</text><text x="175" y="405" font-family="Arial,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">A</text><text x="175" y="470" font-family="Arial,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">B</text><text x="175" y="535" font-family="Arial,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">C</text><text x="315.5" y="445.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">F</text><text x="93.0" y="420.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#c44251" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">fₛ</text><text x="315.5" y="505.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">fc</text><text x="93.0" y="530.0" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#c44251" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">fg = fc</text><text x="490" y="385" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">F − μ₃mg = 3ma</text><text x="490" y="443" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">μ₃ = (F − 3ma)/(3mg)</text><text x="490" y="501" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">μ₂ = (F − 2ma)/(2mg)</text></svg>