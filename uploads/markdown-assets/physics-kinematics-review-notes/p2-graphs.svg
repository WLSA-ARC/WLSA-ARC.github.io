<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="520" viewBox="0 0 1050 520" role="img"><title>Vertical launch: initial and return velocity, v_f=v_i-gt, h=v_it-halfgt², h=(vi²-vf²)/(2g), highest point and equal-area velocity-time triangles. All handwritten notation and clipped neighboring ink retained.</title><rect width="100%" height="100%" fill="white" /><path d="M65 280L610 280" fill="none" stroke="#263445" stroke-width="1.5" /><path d="M610 280L600.0 276.0L600.0 284.0Z" stroke="#263445" stroke-width="0" fill="#263445" /><path d="M65 430L65 75" fill="none" stroke="#263445" stroke-width="1.5" /><path d="M65 75L61.0 85.0L69.0 85.0Z" stroke="#263445" stroke-width="0" fill="#263445" /><path d="M65 280L65 110L320 280Z" stroke="#147fa5" stroke-width="2" fill="#d9e9f3" /><path d="M320 280L575 450L575 280Z" stroke="#c44251" stroke-width="2" fill="#f6e2e5" /><path d="M65 110L575 450" fill="none" stroke="#147fa5" stroke-width="3" /><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Vertical launch: highest point and return</text><text x="590" y="310" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">t</text><text x="40" y="70" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">v</text><text x="20" y="110" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">vᵢ</text><text x="15" y="450" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">−vᵢ</text><text x="285" y="318" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">v=0</text><text x="110" y="175" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Equal areas</text><text x="360" y="380" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Equal time intervals</text><text x="670" y="95" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">vf = vᵢ − gt</text><text x="670" y="134" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">h = vᵢt − ½gt²</text><text x="670" y="173" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">h = (vᵢ² − vf²)/(2g)</text><text x="670" y="212" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" /><text x="670" y="251" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Highest point:</text><text x="670" y="290" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">t = vᵢ/g; H = vᵢ²/(2g)</text><text x="670" y="329" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" /><text x="670" y="368" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Return to launch height:</text><text x="670" y="407" font-family="Arial,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve" paint-order="stroke fill" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">t = 2vᵢ/g; vf = −vᵢ</text></svg>