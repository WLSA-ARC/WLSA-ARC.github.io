<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img"><title>Inclined-plane free-body diagram: block, normal force, downward mg, downhill mg sin(theta), perpendicular mg cos(theta), a=F/m=sin(theta)g, and ruled-paper background.</title><rect width="100%" height="100%" fill="white"/><text x="28" y="37" font-family="Arial,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#263445" text-anchor="start" xml:space="preserve">Sliding on a frictionless incline</text><path d="M65 300L395 300L395 120Z" stroke="#263445" stroke-width="1.8" fill="#edf1f5"/><text x="125" y="290" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">θ</text><circle cx="230" cy="210" r="9" fill="#e6ebf0" stroke="#263445" stroke-width="2"/><path d="M230 210L175 115" fill="none" stroke="#248b67" stroke-width="2.5"/><path d="M175 115L176.54865756349253 125.65840793697808L183.47206784734155 121.65011777264445Z" stroke="#248b67" stroke-width="0" fill="#248b67"/><text x="210.5" y="152.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#248b67" text-anchor="start" xml:space="preserve">Normal</text><path d="M230 210L230 335" fill="none" stroke="#c44251" stroke-width="2.5"/><path d="M230 335L234.0 325.0L226.0 325.0Z" stroke="#c44251" stroke-width="0" fill="#c44251"/><text x="238.0" y="262.5" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#c44251" text-anchor="start" xml:space="preserve">mg</text><path d="M230 210L177.4 238.7" fill="none" stroke="#147fa5" stroke-width="2.5"/><path d="M177.4 238.7L188.09419407988935 237.42163660031287L184.26244164427357 230.39898231064768Z" stroke="#147fa5" stroke-width="0" fill="#147fa5"/><text x="211.7" y="214.35" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve">mg sin θ</text><path d="M230 210L282.6 306.3" fill="none" stroke="#147fa5" stroke-width="2.5"/><path d="M282.6 306.3L281.31683857394694 295.60638055873085L274.29590418025873 299.4412834570486Z" stroke="#147fa5" stroke-width="0" fill="#147fa5"/><text x="264.3" y="248.14999999999998" font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#147fa5" text-anchor="start" xml:space="preserve">mg cos θ</text><text x="470" y="130" font-family="Arial,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Along the slope: F = mg sin θ</text><text x="470" y="178" font-family="Arial,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">Normal component: mg cos θ</text><text x="470" y="226" font-family="Arial,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#263445" text-anchor="start" xml:space="preserve">a = F/m = g sin θ</text></svg>
