<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>PDF reader · WLSA ARC</title><link href="./assets/site.css" rel="stylesheet"/><link href="./assets/arc-logo.svg" rel="icon" type="image/svg+xml"/></head>
<body class="viewer-body"><div class="viewer-app"><header class="viewer-toolbar"><a class="viewer-brand" href="./">WLSA ARC</a><div class="viewer-title" id="viewerTitle">Study material reader</div><div class="viewer-tools"><button aria-label="Toggle thumbnails" id="toggleThumbs" title="Toggle thumbnails" type="button">☰</button><button aria-label="Zoom out" id="zoomOut" title="Zoom out" type="button">−</button><span id="zoomLabel">100%</span><button aria-label="Zoom in" id="zoomIn" title="Zoom in" type="button">+</button><button aria-label="Fit width" id="fitWidth" title="Fit width" type="button">Fit</button><div class="page-control"><input aria-label="Page number" id="pageInput" min="1" type="number" value="1"/><span>/ <span id="pageCount">—</span></span></div><button aria-label="Search document" id="searchToggle" title="Search document" type="button">⌕</button><button aria-label="Fullscreen" id="fullscreenBtn" title="Fullscreen" type="button">⛶</button><a aria-label="Download PDF" class="toolbar-link" download="" id="downloadBtn" title="Download PDF">↓</a></div></header><div class="viewer-search" id="viewerSearch"><input aria-label="Search inside this PDF" id="documentSearch" placeholder="Search inside this document"/><button aria-label="Previous matching page" id="searchPrev" type="button">↑</button><button aria-label="Next matching page" id="searchNext" type="button">↓</button><span aria-live="polite" id="searchStatus"></span></div><div class="viewer-main"><aside class="thumb-sidebar" id="thumbSidebar"><div id="thumbList"></div></aside><main class="pdf-scroll" id="pdfScroll"><div class="reader-status" id="readerStatus" role="status">Loading document…</div><div id="pages"></div></main></div></div><script src="./assets/viewer.js" type="module"></script></body></html>
